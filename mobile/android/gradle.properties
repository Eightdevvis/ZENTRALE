# Sparsam für den Laptop (3,8 GB RAM): Flutter stellt hier 8 GB ein, und der
# Gradle-Daemon bleibt nach dem Bau im Hintergrund und behält den Speicher.
# Kein Daemon: Gradle gibt den RAM nach jedem Bau frei (Bau etwas langsamer).
# Kotlin im selben Prozess: sonst startet ein zweiter, eigener Kotlin-Daemon.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
