<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>ZENTRALE</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* Body: tiefschwarzer Untergrund mit hauchdünnem Cyan-Schimmer in der
       Mitte → wirkt wie eine schwach beleuchtete Maschinen-Konsole.
       Radial-Gradient ist subtil (5% Opacity), damit Text lesbar bleibt. */
    body {
      background:
        radial-gradient(ellipse at center, rgba(0, 80, 60, 0.08) 0%, transparent 60%),
        #050708;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 1.5rem;
      gap: 1rem;
      overflow: hidden;
      position: relative;
    }

    /* CRT-Scanlines: 1px-Streifen alle 3px über den ganzen Viewport.
       pointer-events: none → blockiert keine Klicks.
       fixed → bleibt beim Scrollen.
       Bewusst KEIN mix-blend-mode: das ist auf Pi-GPU (VC4) extrem teuer,
       weil es Per-Pixel-Compositing ohne Hardware-Beschleunigung erzwingt
       und einen globalen Layer baut, der bei jeder Frame-Animation neu
       evaluiert wird. Statt blend-mode reicht eine niedrige Alpha-Stufe
       als simples Overlay → visuell fast identisch, ein Bruchteil der Last. */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        transparent           0px,
        transparent           2px,
        rgba(0, 255, 136, 0.05) 2px,
        rgba(0, 255, 136, 0.05) 3px
      );
      z-index: 9999;
    }

    /* ── Header (immer sichtbar) ── */
    .header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .title {
      font-size: 4rem;
      font-weight: bold;
      color: #00ff88;
      letter-spacing: 0.2em;
      text-shadow: 0 0 30px rgba(0, 255, 136, 0.6), 0 0 60px rgba(0, 255, 136, 0.2);
    }

    .date {
      font-size: 0.9rem;
      color: rgba(0, 255, 136, 0.5);
      letter-spacing: 0.2em;
      text-shadow: 0 0 6px rgba(0, 255, 136, 0.25);
    }

    /* ── Main View ──
       3-Spalten-Layout mit benannten Grid-Areas:
         sensors  |  ai (mittig, nimmt den Rest)  |  graph (kompakt rechts)
         term term term  (Footer über alle Spalten)

       Warum named areas: später wollen wir den AI- und den Graph-Bereich
       per JS swappen können (z.B. Graph groß, AI klein und rechts). Mit
       areas reicht es, an einer Stelle die Reihenfolge zu tauschen statt
       jede Card einzeln umzubauen.

       Spaltenbreiten:
         - auto              → Sensoren-Spalte so schmal wie Inhalt
         - minmax(0, 1fr)    → AI-Mitte nimmt den Rest, minmax(0,...) damit
                               flex/overflow-Kinder nicht aufblasen
         - clamp(220, 22vw, 340) → Graph-Spalte responsiv: zwischen 220px
                                   und 340px, sonst 22% der Viewport-Breite */
    #view-main {
      flex: 1;
      display: grid;
      grid-template-rows: 1fr auto;
      grid-template-columns: auto minmax(0, 1fr) clamp(220px, 22vw, 340px);
      grid-template-areas:
        "sensors ai graph"
        "term    term term";
      gap: 1rem;
      min-height: 0;
    }

    /* Grid-Area-Zuweisungen für die einzelnen Panels */
    .side-col      { grid-area: sensors; }
    #main-display  { grid-area: ai; }
    .side-graph    { grid-area: graph; }
    .terminal      { grid-area: term; }

    /* ── Cyberpunk-Card ──
       Eckig + Neon-HUD-Look:
       - 1px Border in Neon-Grün-Glas (rgba) → schon ohne Glow erkennbar als
         „aktive" Tafel.
       - box-shadow doppelt: außen ein weicher Cyan-Glow für die Neon-Optik,
         innen ein dunklerer Vignette-Schatten damit die Karte „eingebettet"
         wirkt statt aufgesetzt.
       - Hintergrund bleibt dunkel-durchscheinend, damit der scanline-Overlay
         vom body::after (siehe weiter unten) leicht durchscheint. */
    .card {
      background: rgba(8, 14, 18, 0.65);
      border: 1px solid rgba(0, 255, 136, 0.35);
      border-radius: 0;
      padding: 1rem 1.25rem;
      overflow: hidden;
      /* Nur ein einziger outer-Glow. Inset-Shadow weg, weil der bei jeder
         Repaint-Aktion neu gerastert wird — auf Pi-GPU spürbar teuer. */
      box-shadow: 0 0 10px rgba(0, 255, 136, 0.07);
      position: relative;
    }

    /* Card-Header: Neon-Cyan/Mint mit Glow, klassischer HUD-Label-Look.
       border-bottom als „Trennlinie" wird ebenfalls neongrün. */
    .card h2 {
      color: #00ff88;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      margin-bottom: 0.75rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid rgba(0, 255, 136, 0.2);
      text-shadow: 0 0 8px rgba(0, 255, 136, 0.55);
    }

    #main-display {
      display: flex;
      flex-direction: column;
    }

    .chart-empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #2a2a2a;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
    }

    /* Side-Col = Sensoren-Spalte. Liegt links neben dem Graph.
       Keine eigene Breite gesetzt → übernimmt das `auto` aus dem Grid,
       also exakt so breit wie der breiteste Sensor-Eintrag. */
    .side-col {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .sensor-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.4rem 0;
      font-size: 0.9rem;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #2a2a2a;
      border: 1px solid #333;
      flex-shrink: 0;
      transition: background 0.2s, box-shadow 0.2s;
    }

    .dot.active {
      background: #00ff88;
      border-color: #00ff88;
      box-shadow: 0 0 8px rgba(0, 255, 136, 0.7);
    }

    /* Terminal-Footer: neon-grüne HUD-Console.
       Dunkler-getuntes Background als die Cards → wirkt wie eine eigene
       „Hardware-Konsole" unter den Hauptpanels. Grid-Platzierung erfolgt
       weiter oben über grid-area: term (spannt alle 3 Spalten). */
    .terminal {
      background: rgba(4, 8, 10, 0.78);
      border: 1px solid rgba(0, 255, 136, 0.35);
      border-radius: 0;
      padding: 0.6rem 1rem;
      height: 9rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
      box-shadow: 0 0 10px rgba(0, 255, 136, 0.07);
    }

    .terminal-header {
      color: rgba(0, 255, 136, 0.55);
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      margin-bottom: 0.4rem;
      flex-shrink: 0;
      text-shadow: 0 0 6px rgba(0, 255, 136, 0.35);
    }

    .log-line {
      font-size: 0.75rem;
      color: #4a9;
      white-space: pre;
    }

    .log-line .log-time {
      color: #333;
      margin-right: 0.75rem;
    }

    /* ════════════════════════════════════════════════════════════════
       ── AI-Orb-Panel ──
       Cyberpunk-„Kopf" der AI: pixelierte Sonne mit Halo, rotierenden
       Strahlen, gegenläufigem Pixel-Ring, pulsierendem Kern und einer
       Partikelwolke. Im idle-State ruhige Animation, mit
       .ai-orb.active wird's schneller/intensiver → JS toggelt das
       sobald die AI tatsächlich Tokens streamt.
       ════════════════════════════════════════════════════════════════ */

    /* panel-ai = Default-Inhalt von #main-display (statt vorher panel-graph).
       Vertikale Aufteilung: Orb oben (nimmt allen Raum), Mini-Log unten. */
    #panel-ai {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      gap: 0.75rem;
      align-items: stretch;
    }

    /* Wrapper für den Orb: zentriert, square. flex: 1 + min-height: 0
       damit der Mini-Log unten Platz behält und der Orb nicht überfließt. */
    .ai-orb-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Der Orb selbst: quadratisch via aspect-ratio.
       Breite ist min(parent, 480px-Cap) — aspect-ratio rechnet die Höhe daraus.
       Falls die berechnete Höhe größer als der Parent ist, klemmt max-height
       und der Browser passt die Breite entsprechend nach unten an. */
    .ai-orb {
      position: relative;
      aspect-ratio: 1 / 1;
      width: min(100%, 480px);
      max-height: 100%;
    }

    /* Fallback für alte Browser ohne aspect-ratio (ungewahrscheinlich auf FF-ESR). */
    @supports not (aspect-ratio: 1) {
      .ai-orb { height: 100%; width: auto; }
    }

    /* SVG füllt den Orb komplett. shape-rendering: crispEdges sorgt
       dafür dass Quadrate/Strahlen NICHT antialiased werden → Pixel-Look. */
    .orb-svg {
      width: 100%;
      height: 100%;
      display: block;
      shape-rendering: crispEdges;
      overflow: visible;
    }

    /* Damit CSS-Animationen auf SVG-<g>-Elemente sauber um deren Zentrum
       drehen, brauchen wir transform-box: fill-box. Sonst rotiert die
       Group um (0,0) des Hosting-CSS-Box-Modells, nicht des SVG-Viewports. */
    .orb-halo, .orb-rays, .orb-ring, .orb-core {
      transform-box: fill-box;
      transform-origin: center;
    }

    /* ── Idle-State (Default, "standby") ──
       Bewusst minimalistisch wegen Pi-3-GPU:
       - Halo sehr neblig & langsam pulsierend (8s Zyklus, kaum Scale-Change)
       - Strahlen GANZ AUS → stattdessen ein solider Kreis-Outline (orb-disk)
       - Pixel-Ring rotiert extrem langsam (240s = 4min volle Umdrehung)
       - Core atmet sehr sanft (5s)
       - Partikel komplett aus
       Eine GPU-arme Konfiguration mit nur 3 wirklich animierten Eigenschaften
       (halo opacity/scale, ring transform, core opacity). */

    .orb-halo {
      opacity: 0.25;
      animation: orb-halo-idle 8s ease-in-out infinite;
    }
    .orb-rays {
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    .orb-disk {
      opacity: 0.55;
      transition: opacity 0.6s ease;
    }
    .orb-ring {
      opacity: 0.6;
      animation: orb-rays-rot 240s linear infinite reverse;
    }
    .orb-core {
      animation: orb-core-pulse 5s ease-in-out infinite;
    }

    /* ── Active-State ──
       Volle Cyberpunk-Performance: schnelles Halo-Pulsen, sichtbare
       rotierende Strahlen, schneller Pixel-Ring, intensives Core-Flackern,
       Partikel fliegen. Wird durch JS via setOrbActive(true) angeschaltet
       während die AI tatsächlich Tokens streamt. */
    .ai-orb.active .orb-halo {
      animation: orb-halo-active 0.9s ease-in-out infinite;
    }
    .ai-orb.active .orb-rays {
      opacity: 1;
      animation: orb-rays-rot 8s linear infinite;
    }
    .ai-orb.active .orb-disk {
      opacity: 0;          /* Solider Idle-Kreis verblasst */
    }
    .ai-orb.active .orb-ring {
      opacity: 1;
      animation-duration: 16s;
    }
    .ai-orb.active .orb-core {
      animation: orb-core-pulse 0.5s ease-in-out infinite;
    }
    .ai-orb.active .particles span {
      animation: orb-particle 1.6s linear infinite;
      animation-delay: var(--delay, 0s);
    }

    /* ── Keyframes ── */

    /* Idle-Halo: kaum-sichtbare Atmung. Geringe Opacity, minimale Skalierung. */
    @keyframes orb-halo-idle {
      0%, 100% { opacity: 0.20; transform: scale(1); }
      50%      { opacity: 0.32; transform: scale(1.025); }
    }
    /* Active-Halo: kräftiger, schneller Glow-Puls. */
    @keyframes orb-halo-active {
      0%, 100% { opacity: 0.50; transform: scale(1); }
      50%      { opacity: 0.85; transform: scale(1.10); }
    }
    @keyframes orb-rays-rot {
      to { transform: rotate(360deg); }
    }
    @keyframes orb-core-pulse {
      0%, 100% { opacity: 0.75; }
      50%      { opacity: 1; }
    }

    /* ── Partikel-Layer ──
       Liegt absolut über dem Orb. Jedes Pixel-Quadrat bekommt im HTML eine
       individuelle Flug-Richtung (--tx, --ty) und einen --delay,
       sodass sie unterschiedlich gestaffelt nach außen fliegen.
       Pure CSS, keine Canvas/JS-Schleife → günstig für den Pi. */
    .particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: visible;
    }
    .particles span {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 3px;
      height: 3px;
      background: #00ff88;
      box-shadow: 0 0 4px rgba(0, 255, 136, 0.8);
      opacity: 0;
      /* Im Idle: keine Animation, opacity bleibt 0 → unsichtbar.
         Wird erst durch .ai-orb.active aktiviert (siehe unten). */
    }
    @keyframes orb-particle {
      0%   { transform: translate(-50%, -50%); opacity: 0; }
      8%   { opacity: 1; }
      100% { transform: translate(calc(-50% + var(--tx)),
                                  calc(-50% + var(--ty)));
             opacity: 0; }
    }

    /* ── Mini-Chat-Log unter dem Orb ──
       Zeigt die letzten ~5 Konversationszeilen. Wird vom fetchState-Loop
       (oder einem dedizierten Poll) aktualisiert. Kein scroll, weil es
       immer nur die jüngsten Zeilen anzeigt. */
    .mini-log {
      flex-shrink: 0;
      max-height: 8rem;
      /* overflow-y: auto statt hidden → wenn der gewrappte Text mehr Höhe
         braucht als max-height, kann der User scrollen statt dass Inhalt
         abgeschnitten wird. JS scrollt nach jedem Render ans Ende. */
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      padding-top: 0.5rem;
      border-top: 1px solid rgba(0, 255, 136, 0.15);
      font-size: 0.75rem;
      line-height: 1.4;
    }
    .mini-log-row {
      display: flex;
      gap: 0.6rem;
      /* KEIN nowrap/ellipsis hier mehr – sonst werden lange AI-Antworten
         mit "..." abgeschnitten und der User sieht nie den ganzen Text.
         align-items: flex-start damit das Role-Label oben bleibt, auch
         wenn der Text-Span mehrzeilig wird. */
      align-items: flex-start;
    }
    .mini-log-role {
      flex-shrink: 0;
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      min-width: 2.5rem;
      padding-top: 0.15rem;   /* leicht runter, sodass das Label auf Höhe der ersten Textzeile sitzt */
    }
    .mini-log-role.user { color: #00aaff; }
    .mini-log-role.ai   { color: #00ff88; text-shadow: 0 0 4px rgba(0,255,136,0.5); }
    .mini-log-text {
      color: #bbb;
      /* Wrap erlauben: lange AI-Antworten brechen in die nächste Zeile
         statt in ellipsis zu enden. word-break: break-word für extreme
         Fälle wie URLs ohne Leerzeichen. */
      white-space: pre-wrap;
      word-break: break-word;
      flex: 1;
      min-width: 0;
    }
    .mini-log-empty {
      color: #333;
      text-align: center;
      font-size: 0.7rem;
      padding: 0.5rem 0;
      letter-spacing: 0.1em;
    }

    /* ── Side-Graph (rechte Spalte, Mini-Chart) ──
       Hier landet der vorher zentrale Sleep-Quality-Graph in kompakter Form. */
    .side-graph {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .side-graph #panel-graph {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .side-graph #panel-graph svg {
      flex: 1;
      min-height: 0;
    }

    /* ── Chat Panel (tauscht den Graph-Bereich aus) ── */

    /* panel-graph und panel-chat leben beide in #main-display.
       Nur einer ist jeweils sichtbar. */
    #panel-graph {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    #panel-graph svg { flex: 1; }

    #panel-chat {
      display: none;          /* startet versteckt */
      flex-direction: column;
      flex: 1;
      gap: 0.5rem;
      min-height: 0;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      padding: 0.25rem 0;
    }

    .chat-msg {
      display: flex;
      gap: 1rem;
      font-size: 0.85rem;
      line-height: 1.55;
    }

    .chat-msg-role {
      color: #00ff88;
      flex-shrink: 0;
      width: 3.5rem;
      text-align: right;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      padding-top: 0.15rem;
    }

    .chat-msg-role.assistant { color: #ff9900; }

    .chat-msg-content {
      color: #ccc;
      flex: 1;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .chat-msg.thinking .chat-msg-content {
      color: #444;
      font-style: italic;
    }

    .chat-input-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      border-top: 1px solid #2a2a2a;
      padding-top: 0.75rem;
      flex-shrink: 0;
    }

    .chat-prompt { color: #00ff88; font-size: 1.1rem; }

    .chat-input {
      background: transparent;
      border: none;
      outline: none;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      font-size: 0.95rem;
      flex: 1;
      caret-color: #00ff88;
    }

    /* Blinkender Block-Cursor während AI schreibt */
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }
    .chat-cursor {
      display: inline-block;
      color: #00ff88;
      animation: blink 0.8s step-start infinite;
      margin-left: 1px;
    }

    .chat-status {
      font-size: 0.65rem;
      color: #333;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .chat-status.online  { color: #00ff88; }
    .chat-status.offline { color: #ff4444; }

    /* ── Data Collection View ── */
    #view-datacollection {
      display: none;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      min-height: 0;
    }

    /* ── Kategorie-Auswahl ── */
    .dc-question {
      font-size: 1.4rem;
      color: #888;
      letter-spacing: 0.05em;
      text-align: center;
    }

    .category-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .category-item {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      font-size: 1.3rem;
      color: #ccc;
      cursor: default;
    }

    .cat-num {
      width: 2.2rem;
      height: 2.2rem;
      border-radius: 50%;
      border: 2px solid #00ff88;
      color: #00ff88;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      font-weight: bold;
      flex-shrink: 0;
    }

    /* ── Formular ── */
    .form-title {
      font-size: 1.6rem;
      color: #00ff88;
      letter-spacing: 0.1em;
      text-align: center;
    }

    .form-fields {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
      max-width: 600px;
    }

    .form-field {
      background: rgba(8, 14, 18, 0.65);
      border: 1px solid rgba(0, 255, 136, 0.2);
      border-radius: 0;
      padding: 0.9rem 1.25rem;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .form-field.focused {
      border-color: #00ff88;
      box-shadow: 0 0 10px rgba(0, 255, 136, 0.15);
    }

    .field-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: #555;
      margin-bottom: 0.5rem;
    }

    .field-value {
      font-size: 1.1rem;
      color: #ccc;
    }

    .field-value.editing {
      color: #00ff88;
    }

    /* ── Smileys ── */
    .smiley-row {
      display: flex;
      gap: 1.25rem;
      align-items: flex-end;
      padding-top: 0.4rem;
    }

    .smiley-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .smiley-wrap svg {
      display: block;
    }

    .smiley-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #00ff88;
      opacity: 0;
    }

    .smiley-wrap.selected .smiley-dot {
      opacity: 1;
    }

    /* ── Tutor Panel ── */
    #panel-tutor {
      display: none;          /* startet versteckt, T-Taste blendet ein */
      flex-direction: column;
      height: 100%;
      gap: 0;
    }
    .tutor-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.4rem 0;
      border-bottom: 1px solid #1a1a1a;
      margin-bottom: 0.5rem;
      flex-shrink: 0;
    }
    .tutor-label {
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      color: #ff6600;
      flex: 1;
    }
    .tutor-mic-status {
      font-size: 0.75rem;
      color: #444;
      min-width: 5rem;
      text-align: right;
      transition: color 0.2s;
    }
    .tutor-mic-status.recording { color: #ff3300; animation: blink 0.8s infinite; }
    .tutor-mic-status.listening { color: #00cc66; }
    .tutor-stop-btn {
      background: none;
      border: 1px solid #333;
      color: #555;
      font-size: 0.6rem;
      padding: 0.2rem 0.5rem;
      cursor: pointer;
      letter-spacing: 0.1em;
    }
    .tutor-stop-btn:hover { border-color: #ff3300; color: #ff3300; }
    .tutor-messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      padding-right: 0.3rem;
    }
    .tutor-msg { display: flex; gap: 0.6rem; align-items: flex-start; }
    .tutor-msg-role {
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      color: #444;
      padding-top: 0.1rem;
      flex-shrink: 0;
      min-width: 2.5rem;
    }
    .tutor-msg-role.ai     { color: #ff6600; }
    .tutor-msg-role.user   { color: #00aaff; }
    .tutor-msg-content {
      font-size: 0.85rem;
      line-height: 1.5;
      color: #ccc;
      white-space: pre-wrap;
    }
    .tutor-hint {
      font-size: 0.65rem;
      color: #333;
      letter-spacing: 0.1em;
      text-align: center;
      padding: 0.4rem 0 0.1rem;
      flex-shrink: 0;
    }

    .form-hint {
      font-size: 0.65rem;
      color: #333;
      letter-spacing: 0.1em;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Header bleibt immer -->
  <div class="header">
    <span class="title">ZENTRALE</span>
    <span class="date" id="date">--. --- ----</span>
  </div>

  <!-- ── Main View ──
       DOM-Reihenfolge entspricht den Grid-Areas:
         1) side-col   → grid-area: sensors (links, schmal)
         2) main-display → grid-area: ai      (mittig, quadratisch via Inhalt)
         3) side-graph → grid-area: graph    (rechts, kompakt)
         4) terminal   → grid-area: term     (Footer, volle Breite) -->
  <div id="view-main">

    <div class="side-col">
      <div class="card">
        <h2>Sensoren</h2>
        <div class="sensor-row">
          <div class="dot" id="dot-button"></div>
          <span>Button</span>
        </div>
        <div class="sensor-row">
          <div class="dot" id="dot-light"></div>
          <span>Light Sensor</span>
        </div>
      </div>
    </div>

    <div class="card" id="main-display">
      <!-- ── AI-Panel (Default-Inhalt) ──
           Pixelierter Sonnen-Orb + Mini-Chat-Log darunter.
           Wird beim Wechsel in Chat- oder Tutor-Modus per JS versteckt. -->
      <div id="panel-ai">
        <div class="ai-orb-wrap">
          <div class="ai-orb" id="ai-orb">

            <!-- SVG mit Halo, Strahlen, Pixel-Ring, Core -->
            <svg class="orb-svg" viewBox="-100 -100 200 200" aria-hidden="true">
              <defs>
                <!-- Halo-Gradient: Neon-Grün im Zentrum, weich nach außen aus -->
                <radialGradient id="halo-grad" cx="50%" cy="50%" r="50%">
                  <stop offset="0%"   stop-color="#00ff88" stop-opacity="0.45"/>
                  <stop offset="55%"  stop-color="#00ff88" stop-opacity="0.10"/>
                  <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
                </radialGradient>
              </defs>

              <!-- Halo: pulsierender Glow-Kreis hinter allem -->
              <circle class="orb-halo" cx="0" cy="0" r="92" fill="url(#halo-grad)"/>

              <!-- Idle-Disk: solider Kreis-Outline, ersetzt die einzelnen
                   Strahlen im Standby. Wird im Active-State auf opacity:0 gefadet. -->
              <circle class="orb-disk" cx="0" cy="0" r="64"
                      fill="none" stroke="#00ff88" stroke-width="1.5"/>

              <!-- Strahlen: 8 Stück, rotieren langsam.
                   Master-Rect oben (12-Uhr), <use> kopiert es mit rotate-transforms.
                   So muss man die Geometrie nur einmal anpassen. -->
              <g class="orb-rays">
                <rect id="ray-px" x="-2" y="-72" width="4" height="14" fill="#00ff88"/>
                <use href="#ray-px" transform="rotate(45)"/>
                <use href="#ray-px" transform="rotate(90)"/>
                <use href="#ray-px" transform="rotate(135)"/>
                <use href="#ray-px" transform="rotate(180)"/>
                <use href="#ray-px" transform="rotate(225)"/>
                <use href="#ray-px" transform="rotate(270)"/>
                <use href="#ray-px" transform="rotate(315)"/>
              </g>

              <!-- Pixel-Ring: 12 Quadrate auf R=42, gegenläufige Rotation.
                   Master-Pixel sitzt 12-Uhr, <use> rotiert um Mehrfache von 30°. -->
              <g class="orb-ring">
                <rect id="ring-px" x="-2" y="-42" width="4" height="4" fill="#00ff88"/>
                <use href="#ring-px" transform="rotate(30)"/>
                <use href="#ring-px" transform="rotate(60)"/>
                <use href="#ring-px" transform="rotate(90)"/>
                <use href="#ring-px" transform="rotate(120)"/>
                <use href="#ring-px" transform="rotate(150)"/>
                <use href="#ring-px" transform="rotate(180)"/>
                <use href="#ring-px" transform="rotate(210)"/>
                <use href="#ring-px" transform="rotate(240)"/>
                <use href="#ring-px" transform="rotate(270)"/>
                <use href="#ring-px" transform="rotate(300)"/>
                <use href="#ring-px" transform="rotate(330)"/>
              </g>

              <!-- Core-Cluster: Plus-förmiger Pixel-Klumpen im Zentrum -->
              <g class="orb-core">
                <rect x="-6"  y="-6"  width="12" height="12" fill="#00ff88"/>
                <rect x="-10" y="-2"  width="4"  height="4"  fill="#00ff88"/>
                <rect x="6"   y="-2"  width="4"  height="4"  fill="#00ff88"/>
                <rect x="-2"  y="-10" width="4"  height="4"  fill="#00ff88"/>
                <rect x="-2"  y="6"   width="4"  height="4"  fill="#00ff88"/>
              </g>
            </svg>

            <!-- Partikel-Layer: 8 Pixel, jeder mit eigener Flug-Richtung (--tx,--ty)
                 und Stagger-Delay. Pure-CSS-Animation, kein JS-RAF nötig. -->
            <div class="particles" aria-hidden="true">
              <span style="--tx: 130px;  --ty:   0px;  --delay: 0.0s"></span>
              <span style="--tx:  92px;  --ty: -92px;  --delay: 0.45s"></span>
              <span style="--tx:   0px;  --ty:-115px;  --delay: 0.9s"></span>
              <span style="--tx: -85px;  --ty: -85px;  --delay: 1.35s"></span>
              <span style="--tx:-140px;  --ty:   0px;  --delay: 1.8s"></span>
              <span style="--tx: -88px;  --ty:  88px;  --delay: 2.25s"></span>
              <span style="--tx:   0px;  --ty: 110px;  --delay: 2.7s"></span>
              <span style="--tx:  95px;  --ty:  95px;  --delay: 3.15s"></span>
            </div>
          </div>
        </div>

        <!-- Mini-Chat-Log: letzte ~5 Zeilen User+AI, scrolllos. -->
        <div class="mini-log" id="mini-log">
          <div class="mini-log-empty">// listening …</div>
        </div>
      </div>

      <!-- Tutor-Panel: wird per T-Taste oder Motion-Sensor eingeblendet -->
      <div id="panel-tutor">
        <div class="tutor-header">
          <span class="tutor-label">普通话 · MANDARIN TUTOR</span>
          <span class="tutor-mic-status" id="tutor-mic-status">·</span>
          <button class="tutor-stop-btn" onclick="stopTutor()">■ stop</button>
        </div>
        <div class="tutor-messages" id="tutor-messages"></div>
        <div class="tutor-hint" id="tutor-hint">Space = Aufnahme starten</div>
      </div>

      <!-- Chat-Panel: wird per C-Taste eingeblendet, ESC zurück -->
      <div id="panel-chat">
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input-row">
          <span class="chat-prompt">&gt;</span>
          <input type="text" id="chat-input" class="chat-input"
                 autocomplete="off" spellcheck="false" placeholder="Nachricht eingeben..."/>
          <span class="chat-status" id="chat-status">checking...</span>
        </div>
        <p class="form-hint">Enter senden &nbsp;·&nbsp; /memory &nbsp;·&nbsp; /forget N &nbsp;·&nbsp; /clear &nbsp;·&nbsp; Esc zurück</p>
      </div>
    </div>

    <!-- Side-Graph: der ehemals zentrale Sleep-Quality-Graph in kompakter Form -->
    <div class="card side-graph">
      <div id="panel-graph"></div>
    </div>

    <div class="terminal" id="terminal">
      <div class="terminal-header">// stdout</div>
    </div>
  </div>

  <!-- ── Data Collection View ── -->
  <div id="view-datacollection">
    <!-- Inhalt wird per JS gerendert -->
  </div>

  <script>
    // ═══════════════════════════════════════════════════════
    //  State
    // ═══════════════════════════════════════════════════════
    let appMode    = 'main';      // 'main' | 'category' | 'form' | 'chat'
    let categories = [];
    let activeCategory = null;

    let fieldIndex    = 0;
    let editingField  = false;
    let fieldValues   = {};
    let smileyHover   = 2;

    // Mundbogen-Pfade: von tief traurig bis breit lächelnd
    const SMILEY_MOUTHS = [
      'M 11,27 Q 20,19 29,27',   // tiefes Stirnrunzeln
      'M 12,26 Q 20,22 28,26',   // leichtes Stirnrunzeln
      'M 12,24 L 28,24',          // neutral, gerade Linie
      'M 12,24 Q 20,29 28,24',   // leichtes Lächeln
      'M 11,23 Q 20,32 29,23',   // breites Lächeln
    ];

    function makeSmiley(index, state) {
      // state: 'dim' | 'hovered' | 'selected'
      const stroke  = state === 'dim' ? '#2e2e2e' : '#00ff88';
      const size    = state === 'hovered' ? 48 : 38;
      const glow    = state === 'hovered'
        ? 'filter:drop-shadow(0 0 7px rgba(0,255,136,0.85))'
        : '';
      const wrapCls = `smiley-wrap${state === 'selected' ? ' selected' : ''}`;
      const eyeR    = state === 'hovered' ? 2.2 : 1.8;

      return `
        <div class="${wrapCls}">
          <svg viewBox="0 0 40 40" width="${size}" height="${size}"
               style="${glow};transition:all 0.1s">
            <circle cx="20" cy="20" r="17"
                    fill="none" stroke="${stroke}" stroke-width="1.8"/>
            <circle cx="13" cy="15" r="${eyeR}" fill="${stroke}"/>
            <circle cx="27" cy="15" r="${eyeR}" fill="${stroke}"/>
            <path d="${SMILEY_MOUTHS[index]}"
                  fill="none" stroke="${stroke}"
                  stroke-width="2" stroke-linecap="round"/>
          </svg>
          <div class="smiley-dot"></div>
        </div>`;
    }

    // ═══════════════════════════════════════════════════════
    //  Polling (nur im Main-Mode aktiv)
    // ═══════════════════════════════════════════════════════
    async function fetchState() {
      if (appMode !== 'main') return;
      try {
        const res  = await fetch('/api/state');
        const data = await res.json();

        document.getElementById('date').textContent = data.time;

        document.getElementById('dot-button').classList.toggle('active', data.sensors.button);
        document.getElementById('dot-light').classList.toggle('active', data.sensors.light);

        // Mandarin-Vokabel-Block ist in dieser UI-Phase entfernt – `data.vocab`
        // wird vom Backend weiter geliefert, hier aber nicht mehr angezeigt.

        const terminal = document.getElementById('terminal');
        const wasAtBottom = terminal.scrollHeight - terminal.scrollTop <= terminal.clientHeight + 5;
        const header = terminal.querySelector('.terminal-header');
        terminal.innerHTML = '';
        terminal.appendChild(header);
        data.logs.forEach(l => {
          const line = document.createElement('div');
          line.className = 'log-line';
          line.innerHTML = `<span class="log-time">${l.time}</span>${l.text}`;
          terminal.appendChild(line);
        });
        if (wasAtBottom) terminal.scrollTop = terminal.scrollHeight;

      } catch (e) {
        console.error('Fetch failed:', e);
      }
    }

    // ═══════════════════════════════════════════════════════
    //  Mini-Chat-Log unter dem Orb
    // ═══════════════════════════════════════════════════════
    /* Holt die letzten paar Konversations-Zeilen und rendert sie unter
       dem Orb. Läuft nur im Main-Modus → im Chat- oder Tutor-Mode wäre
       das redundant (dort sieht man die volle Konversation).
       Limit 5 Zeilen damit es nicht zur Wand wird. */
    async function fetchMiniLog() {
      if (appMode !== 'main') return;
      try {
        const res     = await fetch('/api/chat/history');
        const history = await res.json();
        renderMiniLog(history.slice(-5));
      } catch (e) { /* offline-tolerant: stille Schleife */ }
    }

    function renderMiniLog(items) {
      const container = document.getElementById('mini-log');
      if (!container) return;
      if (!items || items.length === 0) {
        container.innerHTML = '<div class="mini-log-empty">// listening …</div>';
        return;
      }
      // Roles aus /api/chat/history: 'user' | 'assistant'
      // → Label kürzen für die schmale Spalte.
      container.innerHTML = items.map(m => {
        const role  = m.role === 'user' ? 'user' : 'ai';
        const label = m.role === 'user' ? 'du'   : 'ai';
        return `
          <div class="mini-log-row">
            <span class="mini-log-role ${role}">${label}</span>
            <span class="mini-log-text">${escHtml(m.content || '')}</span>
          </div>`;
      }).join('');
      // Auto-Scroll ans Ende: damit die neuste Nachricht (= die volle AI-
      // Antwort die der User gerade erwartet) sichtbar ist, auch wenn der
      // gewrappte Text mehr als max-height beansprucht.
      container.scrollTop = container.scrollHeight;
    }

    setInterval(fetchState,    1000);
    setInterval(fetchMiniLog,  2500);
    fetchState();
    fetchMiniLog();
    fetchChart();
    checkAiStatus();

    // ═══════════════════════════════════════════════════════
    //  Mode-Wechsel
    // ═══════════════════════════════════════════════════════
    function goToMain() {
      // Main-Display zeigt jetzt den AI-Orb als Default (panel-graph wurde
      // in die rechte Side-Spalte verschoben und bleibt dort dauerhaft sichtbar).
      appMode = 'main';
      document.getElementById('view-main').style.display = 'grid';
      document.getElementById('view-datacollection').style.display = 'none';
      document.getElementById('panel-chat').style.display  = 'none';
      document.getElementById('panel-tutor').style.display = 'none';
      document.getElementById('panel-ai').style.display    = 'flex';
    }

    /* Orb-State umschalten: aktiv = schnellere/intensivere Animationen.
       Wird genutzt während AI-Tokens streamen (Chat- oder Voice-Antwort). */
    function setOrbActive(active) {
      const orb = document.getElementById('ai-orb');
      if (orb) orb.classList.toggle('active', active);
    }

    // ═══════════════════════════════════════════════════════
    //  Tutor
    // ═══════════════════════════════════════════════════════
    let tutorRecording  = false;   // läuft gerade eine Aufnahme?
    let tutorWaiting    = false;   // wartet auf KI-Antwort?
    let mediaRecorder   = null;
    let audioChunks     = [];

    async function goToTutor() {
      appMode = 'tutor';
      document.getElementById('panel-ai').style.display    = 'none';
      document.getElementById('panel-chat').style.display  = 'none';
      document.getElementById('panel-tutor').style.display = 'flex';
      setTutorHint('Starte Session...');
      // KI-Begrüßung streamen
      await tutorAiRespond(null);
    }

    async function stopTutor() {
      // Laufende Aufnahme abbrechen
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      tutorRecording = false;
      tutorWaiting   = false;
      await fetch('/api/tutor/stop', { method: 'POST' });
      goToMain();
    }

    function setTutorHint(text, cls = '') {
      const el = document.getElementById('tutor-hint');
      el.textContent = text;
    }

    function setMicStatus(text, cls = '') {
      const el = document.getElementById('tutor-mic-status');
      el.textContent    = text;
      el.className      = 'tutor-mic-status ' + cls;
    }

    function addTutorMessage(role, content) {
      // Neue Nachricht zum Tutor-Verlauf hinzufügen
      const container = document.getElementById('tutor-messages');
      const div       = document.createElement('div');
      div.className   = 'tutor-msg';
      div.innerHTML   = `
        <span class="tutor-msg-role ${role}">${role === 'ai' ? 'KI' : 'DU'}</span>
        <span class="tutor-msg-content" id="tutor-msg-${Date.now()}"></span>`;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
      // Referenz auf das Content-Element zurückgeben (für streaming)
      return div.querySelector('.tutor-msg-content');
    }

    async function tutorAiRespond(userText) {
      // Streamt KI-Antwort, spielt danach TTS ab und geht in Hör-Modus
      if (tutorWaiting) return;
      tutorWaiting = true;
      setOrbActive(true);   // Orb-Animation hochfahren während AI streamt
      setMicStatus('KI denkt...', '');
      setTutorHint('');

      const contentEl = addTutorMessage('ai', '');
      const url       = userText === null ? '/api/tutor/start' : '/api/tutor/respond';
      const body      = userText === null ? null : JSON.stringify({ text: userText });

      try {
        const resp   = await fetch(url, {
          method:  'POST',
          headers: body ? { 'Content-Type': 'application/json' } : {},
          body,
        });
        const reader  = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer    = '';
        let fullText  = '';

        // Token-für-Token aus dem SSE-Stream lesen
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();
          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const data = JSON.parse(line.slice(6));
            if (data.token) {
              fullText += data.token;
              contentEl.textContent = fullText;
              document.getElementById('tutor-messages').scrollTop = 999999;
            }
          }
        }

        // TTS: KI-Text vorlesen lassen
        if (fullText.trim()) await tutorSpeak(fullText);

      } catch (e) {
        contentEl.textContent = '[Fehler: ' + e.message + ']';
      } finally {
        tutorWaiting = false;
        setOrbActive(false);
        // Jetzt ist die KI fertig → User kann sprechen
        setMicStatus('bereit', 'listening');
        setTutorHint('Space = Aufnahme starten');
      }
    }

    async function tutorSpeak(text) {
      // TTS-Audio vom Server holen und abspielen
      setMicStatus('spricht...', '');
      try {
        const resp = await fetch('/api/tutor/speak', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ text, speed: 0.9 }),
        });
        if (!resp.ok) return;
        const blob  = await resp.blob();
        const url   = URL.createObjectURL(blob);
        const audio = new Audio(url);
        // Warten bis das Audio fertig gespielt hat
        await new Promise(resolve => { audio.onended = resolve; audio.play(); });
        URL.revokeObjectURL(url);
      } catch (e) {
        console.warn('TTS Fehler:', e);
      }
    }

    async function tutorStartRecording() {
      // Mikrofon-Zugriff anfordern und Aufnahme starten
      if (tutorWaiting || tutorRecording) return;
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks  = [];
        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = e => {
          if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = async () => {
          // Aufnahme ist fertig → Blob bauen → an Whisper schicken
          stream.getTracks().forEach(t => t.stop());
          const blob     = new Blob(audioChunks, { type: 'audio/wav' });
          const formData = new FormData();
          formData.append('audio', blob, 'speech.wav');

          setMicStatus('transkribiert...', '');
          setTutorHint('');

          try {
            const res  = await fetch('/api/tutor/transcribe', { method: 'POST', body: formData });
            const data = await res.json();
            const text = (data.text || '').trim();

            if (text) {
              // User-Nachricht anzeigen
              const el = addTutorMessage('user', '');
              el.textContent = text;
              // KI antworten lassen
              await tutorAiRespond(text);
            } else {
              setMicStatus('bereit', 'listening');
              setTutorHint('Nichts erkannt – Space zum nochmal versuchen');
            }
          } catch (e) {
            setMicStatus('bereit', 'listening');
            setTutorHint('Fehler beim Transkribieren');
          }
        };

        mediaRecorder.start();
        tutorRecording = true;
        setMicStatus('● aufnehmen', 'recording');
        setTutorHint('Space = Aufnahme stoppen und senden');

      } catch (e) {
        setTutorHint('Mikrofon-Zugriff verweigert: ' + e.message);
      }
    }

    function tutorStopRecording() {
      if (!tutorRecording || !mediaRecorder) return;
      tutorRecording = false;
      mediaRecorder.stop();
    }

    // Tutor-Status-Polling ist raus (Tutor pausiert).
    // goToTutor/stopTutor/tutorAiRespond etc. unten sind dormant –
    // nichts ruft sie mehr auf. Reaktivierung: T-Hotkey + 3s-Poller
    // wieder aktivieren und Routes in ui/app.py zurueckholen.

    // ═══════════════════════════════════════════════════════
    //  Chat
    // ═══════════════════════════════════════════════════════
    let chatWaiting = false;

    async function goToChat() {
      appMode = 'chat';
      // view-main bleibt sichtbar – nur das Panel innerhalb tauscht.
      // panel-ai (Orb) raus, panel-chat rein. panel-graph in side-graph
      // bleibt unverändert sichtbar.
      document.getElementById('panel-ai').style.display   = 'none';
      document.getElementById('panel-chat').style.display = 'flex';
      await renderChatHistory();
      // Direkt fokussieren → sofort tippen ohne Klick
      document.getElementById('chat-input').focus();
    }

    async function renderChatHistory() {
      try {
        const res     = await fetch('/api/chat/history');
        const history = await res.json();
        const container = document.getElementById('chat-messages');
        if (history.length === 0) {
          container.innerHTML = '<div style="color:#333;font-size:0.8rem;padding:0.5rem 0">Noch keine Nachrichten. Fang einfach an.</div>';
          return;
        }
        container.innerHTML = history.map(m => `
          <div class="chat-msg">
            <span class="chat-msg-role ${m.role}">${m.role === 'user' ? 'du' : 'ai'}</span>
            <span class="chat-msg-content">${escHtml(m.content)}</span>
          </div>
        `).join('');
        container.scrollTop = container.scrollHeight;
      } catch (e) { /* ignore */ }
    }

    function escHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    async function sendChatMessage() {
      if (chatWaiting) return;
      const input   = document.getElementById('chat-input');
      const message = input.value.trim();
      if (!message) return;

      if (message === '/clear') {
        input.value = '';
        await fetch('/api/chat/clear', { method: 'POST' });
        renderChatHistory();
        return;
      }

      // /memory – zeigt alle gespeicherten Memory-Einträge an
      if (message === '/memory') {
        input.value = '';
        const res  = await fetch('/api/memory');
        const entries = await res.json();
        const container = document.getElementById('chat-messages');
        if (entries.length === 0) {
          container.innerHTML += `<div class="chat-msg"><span class="chat-msg-role assistant">sys</span><span class="chat-msg-content" style="color:#555">Memory ist leer.</span></div>`;
        } else {
          const lines = entries.map(e => `[${e.id}][${e.type}] ${escHtml(e.content)}`).join('\n');
          container.innerHTML += `<div class="chat-msg"><span class="chat-msg-role assistant">mem</span><span class="chat-msg-content" style="color:#ff9900">${lines}</span></div>`;
        }
        container.scrollTop = container.scrollHeight;
        return;
      }

      // /forget N – löscht Memory-Eintrag mit ID N
      const forgetMatch = message.match(/^\/forget\s+(\d+)$/);
      if (forgetMatch) {
        input.value = '';
        const id  = parseInt(forgetMatch[1]);
        const res = await fetch(`/api/memory/${id}`, { method: 'DELETE' });
        const data = await res.json();
        const container = document.getElementById('chat-messages');
        container.innerHTML += `<div class="chat-msg"><span class="chat-msg-role assistant">sys</span><span class="chat-msg-content" style="color:#555">${escHtml(data.message)}</span></div>`;
        container.scrollTop = container.scrollHeight;
        return;
      }

      input.value = '';
      chatWaiting = true;
      setOrbActive(true);   // Orb-Pulse hochfahren, solange der Stream läuft

      const container = document.getElementById('chat-messages');

      // User-Nachricht sofort anzeigen
      container.innerHTML += `
        <div class="chat-msg">
          <span class="chat-msg-role user">du</span>
          <span class="chat-msg-content">${escHtml(message)}</span>
        </div>
      `;

      // AI-Bubble mit blinkendem Cursor einfügen – hier landen die Tokens
      const aiMsgEl = document.createElement('div');
      aiMsgEl.className = 'chat-msg';
      aiMsgEl.innerHTML = `
        <span class="chat-msg-role assistant">ai</span>
        <span class="chat-msg-content"><span class="chat-cursor">▍</span></span>
      `;
      container.appendChild(aiMsgEl);
      const contentEl = aiMsgEl.querySelector('.chat-msg-content');
      container.scrollTop = container.scrollHeight;

      try {
        const resp = await fetch('/api/chat', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ message }),
        });

        // ReadableStream: wir lesen den SSE-Response Chunk für Chunk
        const reader  = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer    = '';  // Puffer für unvollständige Zeilen zwischen Chunks
        let fullText  = '';  // Kompletter Text für den finalen Zustand

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          // Chunk dekodieren und an den Puffer anhängen.
          // { stream: true } = TextDecoder weiß dass noch mehr kommt (für Multi-Byte-Zeichen)
          buffer += decoder.decode(value, { stream: true });

          // SSE-Zeilen sind durch \n\n getrennt. Wir splitten und verarbeiten
          // alles außer der letzten (möglicherweise unvollständigen) Zeile.
          const lines = buffer.split('\n\n');
          buffer = lines.pop(); // letzte (unvollständige) Zeile zurück in den Puffer

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;

            const data = JSON.parse(line.slice(6)); // "data: " (6 Zeichen) abschneiden

            if (data.done) break; // Abschluss-Signal vom Server

            if (data.token) {
              fullText += data.token;
              // Token in die AI-Bubble schreiben + Cursor ans Ende setzen
              contentEl.innerHTML = escHtml(fullText) + '<span class="chat-cursor">▍</span>';
              container.scrollTop = container.scrollHeight;
            }
          }
        }

        // Cursor entfernen wenn fertig
        contentEl.textContent = fullText;

      } catch (e) {
        contentEl.innerHTML = '<span style="color:#ff4444">[Verbindungsfehler]</span>';
      } finally {
        chatWaiting = false;
        setOrbActive(false);  // Orb wieder in Idle-Pulse
        if (appMode === 'chat') document.getElementById('chat-input').focus();
      }
    }

    async function checkAiStatus() {
      try {
        const res  = await fetch('/api/ai/status');
        const data = await res.json();
        const el   = document.getElementById('chat-status');
        if (el) {
          el.textContent = data.available ? `${data.model} · lokal` : 'nicht verfügbar';
          el.className   = 'chat-status ' + (data.available ? 'online' : 'offline');
        }
      } catch (e) { /* ignore */ }
    }

    // AI-Status alle 30s aktualisieren
    setInterval(checkAiStatus, 30000);

    // Chat-Input: Enter = senden, Escape = zurück zum Dashboard
    document.getElementById('chat-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter')  { e.preventDefault(); sendChatMessage(); }
      if (e.key === 'Escape') { e.preventDefault(); goToMain(); }
    });

    async function goToCategory() {
      if (categories.length === 0) {
        const res = await fetch('/api/categories');
        categories = await res.json();
      }
      appMode = 'category';
      document.getElementById('view-main').style.display = 'none';
      const dc = document.getElementById('view-datacollection');
      dc.style.display = 'flex';
      renderCategoryList();
    }

    function goToForm(category) {
      activeCategory = category;
      fieldIndex     = 0;
      editingField   = false;
      fieldValues    = initFieldValues(category);
      smileyHover    = 2;
      appMode        = 'form';
      renderForm();
    }

    // ═══════════════════════════════════════════════════════
    //  Initialisierung der Feldwerte
    // ═══════════════════════════════════════════════════════
    function initFieldValues(category) {
      const today  = new Date();
      const values = {};
      for (const field of category.fields) {
        if (field.type === 'date') {
          values[field.id] = toISODate(today);
        } else if (field.type === 'smiley_scale') {
          values[field.id] = null;
        } else {
          values[field.id] = '';
        }
      }
      return values;
    }

    // ═══════════════════════════════════════════════════════
    //  Rendern
    // ═══════════════════════════════════════════════════════
    function renderCategoryList() {
      const dc = document.getElementById('view-datacollection');
      dc.innerHTML = `
        <p class="dc-question">Which data will be entered?</p>
        <ul class="category-list">
          ${categories.map((cat, i) => `
            <li class="category-item">
              <span class="cat-num">${i + 1}</span>
              <span>${cat.name}</span>
            </li>
          `).join('')}
        </ul>
        <p class="form-hint">[1–${categories.length}] auswählen · K zurück</p>
      `;
    }

    function renderForm() {
      const dc = document.getElementById('view-datacollection');
      dc.innerHTML = `
        <p class="form-title">${activeCategory.name}</p>
        <div class="form-fields">
          ${activeCategory.fields.map((f, i) => renderFieldHTML(f, i)).join('')}
        </div>
        <p class="form-hint">↑↓ navigieren · Enter bearbeiten · K speichern · Esc abbrechen</p>
      `;
    }

    function renderFieldHTML(field, index) {
      const isFocused  = index === fieldIndex;
      const isEditing  = isFocused && editingField;
      let valueHTML    = '';

      if (field.type === 'date') {
        const val = fieldValues[field.id];
        valueHTML = `<span class="field-value ${isEditing ? 'editing' : ''}">${formatDate(val)}</span>`;

      } else if (field.type === 'smiley_scale') {
        const selected = fieldValues[field.id]; // null oder 0–4
        valueHTML = `<div class="smiley-row">
          ${Array.from({length: field.steps}, (_, si) => {
            let state = 'dim';
            if (isEditing && si === smileyHover) state = 'hovered';
            else if (!isEditing && si === selected) state = 'selected';
            return makeSmiley(si, state);
          }).join('')}
        </div>`;

      } else if (field.type === 'text') {
        const val = fieldValues[field.id] || '';
        valueHTML = `<span class="field-value ${isEditing ? 'editing' : ''}">${val || '—'}</span>`;
      }

      return `
        <div class="form-field ${isFocused ? 'focused' : ''}">
          <div class="field-label">${field.label}</div>
          <div class="field-content">${valueHTML}</div>
        </div>
      `;
    }

    // ═══════════════════════════════════════════════════════
    //  Tastatur
    // ═══════════════════════════════════════════════════════
    document.addEventListener('keydown', (e) => {
      // Wenn Chat-Input fokussiert ist, eigenen Listener übernehmen lassen
      if (document.activeElement === document.getElementById('chat-input')) return;

      if (appMode === 'main') {
        if (e.key === 'k') goToCategory();
        if (e.key === 'c') goToChat();
        // T-Hotkey (Tutor) ist pausiert – siehe memory/tutor_system.md

      } else if (appMode === 'category') {
        const num = parseInt(e.key);
        if (!isNaN(num) && num >= 1 && num <= categories.length) {
          goToForm(categories[num - 1]);
        } else if (e.key === 'k' || e.key === 'Escape') {
          goToMain();
        }

      } else if (appMode === 'form') {
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
          e.preventDefault();
        }
        handleFormKey(e);
      }
    });

    function handleFormKey(e) {
      const fields = activeCategory.fields;
      const field  = fields[fieldIndex];

      if (!editingField) {
        if (e.key === 'k')          { saveAndGoToMain(); return; }
        if (e.key === 'Escape')     { goToMain(); return; }   // ESC ohne speichern
        if (e.key === 'ArrowDown')  { fieldIndex = Math.min(fieldIndex + 1, fields.length - 1); renderForm(); return; }
        if (e.key === 'ArrowUp')    { fieldIndex = Math.max(fieldIndex - 1, 0);                  renderForm(); return; }
        if (e.key === 'Enter')      { startEditing(field); return; }

      } else {
        if (field.type === 'date') {
          if (e.key === 'Enter' || e.key === 'Escape') { editingField = false;   renderForm(); return; }
          if (e.key === 'ArrowUp')                     { shiftDate(field.id, +1);               return; }
          if (e.key === 'ArrowDown')                   { shiftDate(field.id, -1);               return; }

        } else if (field.type === 'smiley_scale') {
          if (e.key === 'Enter')      { fieldValues[field.id] = smileyHover; editingField = false; renderForm(); return; }
          if (e.key === 'Escape')     { editingField = false;                                      renderForm(); return; }
          if (e.key === 'ArrowLeft')  { smileyHover = Math.max(0, smileyHover - 1);               renderForm(); return; }
          if (e.key === 'ArrowRight') { smileyHover = Math.min(4, smileyHover + 1);               renderForm(); return; }
        }
      }
    }

    function startEditing(field) {
      editingField = true;
      if (field.type === 'smiley_scale') {
        smileyHover = fieldValues[field.id] !== null && fieldValues[field.id] !== undefined
          ? fieldValues[field.id]
          : Math.floor(field.steps / 2);
      }
      renderForm();
    }

    function shiftDate(fieldId, days) {
      const d = new Date(fieldValues[fieldId]);
      d.setDate(d.getDate() + days);
      fieldValues[fieldId] = toISODate(d);
      renderForm();
    }

    async function saveAndGoToMain() {
      const hasData = Object.values(fieldValues).some(v => v !== null && v !== '');
      if (hasData) {
        await fetch('/api/log', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ category: activeCategory.id, data: fieldValues }),
        });
        fetchChart(); // Chart nach neuem Eintrag aktualisieren
      }
      goToMain();
    }

    // ═══════════════════════════════════════════════════════
    //  Chart
    // ═══════════════════════════════════════════════════════
    async function fetchChart() {
      try {
        const res     = await fetch('/api/data/sleep_quality');
        const entries = await res.json();
        renderChart(document.getElementById('panel-graph'), entries);
      } catch (e) {
        console.error('Chart fetch failed:', e);
      }
    }

    // SVG-Smiley direkt als SVG-Elemente (kein HTML-Wrapper, für Einbettung in SVG)
    function makeSmileyInSVG(index, cx, cy, r, color) {
      const s  = r / 17;                  // scale factor
      const sw = (1.8 / s).toFixed(2);    // stroke-width kompensiert scaling
      const sw2= (2   / s).toFixed(2);
      const er = (1.8 / s).toFixed(2);    // Augenradius
      return `<g transform="translate(${cx},${cy}) scale(${s}) translate(-20,-20)">
        <circle cx="20" cy="20" r="17" fill="none" stroke="${color}" stroke-width="${sw}"/>
        <circle cx="13" cy="15" r="${er}" fill="${color}"/>
        <circle cx="27" cy="15" r="${er}" fill="${color}"/>
        <path d="${SMILEY_MOUTHS[index]}" fill="none" stroke="${color}"
              stroke-width="${sw2}" stroke-linecap="round"/>
      </g>`;
    }

    function renderChart(container, rawEntries) {
      const entries = rawEntries
        .filter(e => e.quality !== null && e.quality !== undefined)
        .sort((a, b) => a.date.localeCompare(b.date))
        .slice(-14);

      container.innerHTML = `
        <h2>Sleep Quality</h2>
        ${entries.length === 0
          ? `<div class="chart-empty">Noch keine Daten</div>`
          : buildSVG(entries)
        }
      `;
    }

    function buildSVG(entries) {
      const W = 460, H = 200;
      const m = { top: 16, right: 24, bottom: 32, left: 52 };
      const iW = W - m.left - m.right;
      const iH = H - m.top  - m.bottom;

      const n    = entries.length;
      const xOf  = i => n > 1 ? (i / (n - 1)) * iW : iW / 2;
      const yOf  = v => iH - (v / 4) * iH;

      // Gridlinien + SVG-Smileys als Y-Labels
      const grid = [0, 1, 2, 3, 4].map(v => `
        <line x1="0" y1="${yOf(v)}" x2="${iW}" y2="${yOf(v)}"
              stroke="#1e1e1e" stroke-width="1"/>
        ${makeSmileyInSVG(v, -24, yOf(v), 9, '#3a3a3a')}
      `).join('');

      // X-Labels (Datum)
      const xLabels = entries.map((e, i) => {
        const d     = new Date(e.date + 'T00:00:00');
        const label = `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}`;
        // Nur jeden zweiten zeigen wenn viele Einträge
        if (n > 7 && i % 2 !== 0) return '';
        return `<text x="${xOf(i)}" y="${iH + 22}" text-anchor="middle"
                      fill="#444" font-size="10">${label}</text>`;
      }).join('');

      // Gefüllte Fläche unter dem Graphen
      const areaPoints = [
        `${xOf(0)},${iH}`,
        ...entries.map((e, i) => `${xOf(i)},${yOf(e.quality)}`),
        `${xOf(n-1)},${iH}`,
      ].join(' ');

      // Linie
      const linePath = entries
        .map((e, i) => `${i === 0 ? 'M' : 'L'} ${xOf(i)} ${yOf(e.quality)}`)
        .join(' ');

      // Punkte
      const dots = entries.map((e, i) => `
        <circle cx="${xOf(i)}" cy="${yOf(e.quality)}" r="3.5"
                fill="#00ff88" stroke="#0a0a0a" stroke-width="1.5"/>
      `).join('');

      return `
        <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet"
             style="width:100%;height:100%">
          <defs>
            <linearGradient id="area-fill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"   stop-color="#00ff88" stop-opacity="0.15"/>
              <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <g transform="translate(${m.left},${m.top})">
            ${grid}
            <polygon points="${areaPoints}" fill="url(#area-fill)"/>
            <path d="${linePath}" fill="none" stroke="#00ff88"
                  stroke-width="2" stroke-linejoin="round"/>
            ${dots}
            ${xLabels}
          </g>
        </svg>
      `;
    }

    // ═══════════════════════════════════════════════════════
    //  Datum-Helfer
    // ═══════════════════════════════════════════════════════
    function toISODate(d) {
      return d.toISOString().split('T')[0];
    }

    function formatDate(iso) {
      if (!iso) return '—';
      const d = new Date(iso + 'T00:00:00');
      return d.toLocaleDateString('de-DE', { day: '2-digit', month: 'long', year: 'numeric' });
    }
  </script>
