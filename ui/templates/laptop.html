<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ZENTRALE · LAPTOP</title>
<!-- Fonts lokal vendored (offline-Pflicht): keine Google-Fonts-Anfrage übers Netz -->
<link rel="stylesheet" href="/static/fonts/fonts.css" />
<!--
  ════════════════════════════════════════════════════════════════════════
  ZENTRALE — Laptop-Kassette (laptop.html)
  ------------------------------------------------------------------------
  "ZENTRALE in klein" für die 0rammachine. BEWUSST eigenständig, NICHT vom
  Monolith abgeleitet (kein engine.js/viz.js/ascii.js, kein Frametick, kein
  Flicker). Was hier drinsteht ist abgestimmt (siehe memory/dashboard.md,
  Abschnitt "Kassetten"):

    - 3 Spalten, lean. KI komplett raus (kein Chat/Audio, kein Ollama-Status).
    - ZENTRALE-Optik, AUTO-Theme (hell tags / dunkel nachts), STATISCHE
      Scanlines (das ruhige Streifen-Overlay) — aber KEINE Dauer-Animation.
    - Eigener Mini-Adapter unten: pollt NUR /api/state (1s) + /api/telemetry
      (2s). Kein /api/ai/status, kein /api/chat/history -> nichts läuft ins
      Leere, minimaler RAM/CPU-Fußabdruck.
    - MITTE ist absichtlich ein leeres Skelett — der Inhalt wird gemeinsam
      festgelegt.
  ════════════════════════════════════════════════════════════════════════
-->
<style>
  /* ── Theme: TAG (hell/papier) — identisch zum Monolith für Wiedererkennung ── */
  [data-theme="day"] {
    --bg: #ece7dc; --paper: rgba(255,255,255,0.25);
    --ink: #232019; --bright: #000; --dim: #7c7768; --faint: #bdb6a4; --line: #cbc4b3;
    --acc: #2f6b48; --acc-soft: #6f8f7c;
    --t-net: #1d6a8c; --t-graph: #8a3fb0; --t-event: #3a7d3a; --t-audio: #2f6b48;
    --t-hook: #9a6a2c; --t-num: #9a6a2c; --t-dim: #9a9482; --warn: #9a6a2c;
    --scan: rgba(0,0,0,0.045);
  }
  /* ── Theme: NACHT (code-dark) ── */
  [data-theme="night"] {
    --bg: #0d1017; --paper: rgba(255,255,255,0.018);
    --ink: #c5cdd6; --bright: #eaf0f6; --dim: #909eae; --faint: #44505f; --line: #222a33;
    --acc: #7ec699; --acc-soft: #4f6353;
    --t-net: #56b6c2; --t-graph: #c678dd; --t-event: #98c379; --t-audio: #7ec699;
    --t-hook: #e0a458; --t-num: #d19a66; --t-dim: #5c6773; --warn: #e0a458;
    --scan: rgba(0,0,0,0.16);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }

  #stage {
    position: absolute; left: 50%; top: 50%;
    width: 1920px; height: 1080px;
    transform: translate(-50%, -50%); transform-origin: center;
    background: var(--bg); color: var(--ink);
    font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; line-height: 1.5;
    display: grid; grid-template-rows: 86px 1fr; padding: 22px 28px; gap: 14px; overflow: hidden;
    transition: background .8s ease, color .8s ease;
  }
  /* STATISCHE Scanlines: vollflächiges Streifen-Overlay, bewegt sich NICHT
     (kein keyframe) — genau der ruhige Look, der gewünscht ist. */
  #stage::after { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 60;
    background: repeating-linear-gradient(to bottom, transparent 0 3px, var(--scan) 3px 4px); }
  #stage > * { position: relative; z-index: 1; }

  .vt { font-family: 'VT323', monospace; }

  /* Header */
  .top { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
  .brand { font-weight: 700; font-size: 46px; letter-spacing: 0.24em; color: var(--bright); line-height: 1; }
  .brand .blk { background: var(--ink); color: var(--bg); padding: 0 8px; }
  /* KEIN Flackern in der Laptop-Kassette: "TRALE" steht still in Akzentfarbe. */
  .brand .still { color: var(--acc); }
  .brand-sub { font-size: 11px; letter-spacing: 0.32em; color: var(--dim); text-transform: uppercase; margin-top: 7px; }
  .meta { display: flex; gap: 22px; align-items: center; }
  .kv { font-size: 11px; letter-spacing: 0.1em; color: var(--dim); text-transform: uppercase; white-space: nowrap; }
  .kv b { color: var(--ink); font-weight: 600; }
  .kv .ok { color: var(--acc); }
  .kv .warn { color: var(--warn); }
  .clock { font-family: 'VT323', monospace; font-size: 50px; letter-spacing: 0.04em; color: var(--bright); text-align: right; line-height: 0.8; }
  .date { font-size: 11px; letter-spacing: 0.22em; color: var(--dim); text-align: right; text-transform: uppercase; margin-top: 2px; }
  /* Theme-Schalter */
  .theme-ctl { display: flex; border: 1px solid var(--line); }
  .theme-ctl button { font-family: 'VT323', monospace; font-size: 17px; letter-spacing: 0.08em; background: transparent; color: var(--dim); border: 0; padding: 4px 11px; cursor: pointer; border-right: 1px solid var(--line); }
  .theme-ctl button:last-child { border-right: 0; }
  .theme-ctl button.on { background: var(--acc); color: var(--bg); }

  /* Body: 3 Spalten, lean */
  .body { display: grid; grid-template-columns: 320px 1fr 360px; gap: 14px; min-height: 0; }
  .col { display: flex; flex-direction: column; gap: 14px; min-height: 0; }

  .box { border: 1px solid var(--line); padding: 23px 15px 12px; position: relative; display: flex; flex-direction: column; min-height: 0; background: var(--paper); }
  .box > .bt { position: absolute; top: -11px; left: 13px; background: var(--bg); padding: 0 9px; font-family: 'VT323', monospace; font-size: 19px; line-height: 1; letter-spacing: 0.14em; color: var(--acc); text-transform: uppercase; }
  .box > .bt::before { content: '┤ '; color: var(--faint); } .box > .bt::after { content: ' ├'; color: var(--faint); }
  .box > .bt2 { position: absolute; top: -9px; right: 13px; background: var(--bg); padding: 0 7px; font-size: 10px; letter-spacing: 0.12em; color: var(--dim); }

  /* Platzhalter für (noch) unverkabelte Daten-Panels — ehrlich, kein Fake-Wert */
  .nodata { color: var(--faint); font-size: 12px; letter-spacing: 0.06em; padding: 8px 2px; font-style: italic; }

  /* Sensoren */
  .srow { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 9px; padding: 5px 0; font-size: 14px; letter-spacing: 0.04em; border-bottom: 1px dotted var(--line); }
  .srow:last-child { border-bottom: 0; }
  .srow .ind { color: var(--faint); } .srow.on .ind { color: var(--acc); }
  .srow .nm { color: var(--ink); } .srow.on .nm { color: var(--bright); }
  .srow .val { color: var(--dim); font-size: 12px; } .srow.on .val { color: var(--acc); }

  /* Telemetrie: EIN rotierendes Meter (wechselt durch die Laptop-Werte) */
  .meter { display: grid; grid-template-columns: 84px 1fr 56px; align-items: center; gap: 9px; padding: 6px 0 2px; }
  .meter .ml { font-size: 13px; color: var(--acc); letter-spacing: 0.1em; }
  .meter .ml.stale { color: var(--warn); }
  .meter .mb { font-family: 'VT323', monospace; font-size: 18px; line-height: 1; white-space: pre; overflow: hidden; }
  .meter .mv { font-family: 'VT323', monospace; font-size: 18px; color: var(--bright); text-align: right; }
  .meter .mbf { color: var(--acc); }
  .meter .mbe { color: var(--faint); }

  /* Terminals (token-coloriert) — stdout + outbound */
  .term-body { flex: 1; overflow: hidden; display: flex; flex-direction: column-reverse; font-size: 13px; line-height: 1.5; }
  .term-body:hover { overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--acc) transparent; }
  .term-body:hover::-webkit-scrollbar { width: 7px; }
  .term-body:hover::-webkit-scrollbar-thumb { background: var(--acc); border-radius: 4px; }
  .term-body:hover::-webkit-scrollbar-track { background: transparent; }
  .lg { display: flex; gap: 10px; white-space: pre; }
  .lg .tt { color: var(--faint); } .lg .tx { color: var(--ink); }
  .t-net { color: var(--t-net); } .t-graph { color: var(--t-graph); } .t-event { color: var(--t-event); }
  .t-audio { color: var(--t-audio); } .t-hook { color: var(--t-hook); } .t-num { color: var(--t-num); }
  .t-dim { color: var(--t-dim); } .t-acc { color: var(--acc); }
  .box.net > .bt { color: var(--warn); } .box.net { border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }
  .box.net .tx { color: var(--warn); }
  .term-idle { color: var(--acc-soft); font-size: 13px; letter-spacing: 0.03em; }

  /* ── MITTE: leeres Skelett ───────────────────────────────────────────
     Bewusst Platzhalter. Inhalt wird gemeinsam festgelegt. */
  .mid-box { flex: 1; min-height: 0; align-items: center; justify-content: center; }
  .mid-skel { text-align: center; color: var(--faint); }
  .mid-skel .big { font-family: 'VT323', monospace; font-size: 40px; letter-spacing: 0.18em; color: var(--dim); text-transform: uppercase; }
  .mid-skel .small { font-size: 12px; letter-spacing: 0.14em; margin-top: 10px; text-transform: uppercase; }
</style>
</head>
<body>
  <div id="stage" data-theme="day">
    <header class="top">
      <div>
        <div class="brand"><span class="blk">ZEN</span><span class="still">TRALE</span></div>
        <div class="brand-sub">laptop · kassette</div>
      </div>
      <div class="meta">
        <!-- KEIN Ollama-Status: KI ist in dieser Kassette aus. -->
        <div class="kv">NET <b id="h-net" class="ok">OFFLINE ✓</b></div>
        <div class="kv">UP <b id="p-up">—</b></div>
        <div class="theme-ctl" id="theme-ctl">
          <button data-tm="auto" class="on">AUTO</button>
          <button data-tm="day">HELL</button>
          <button data-tm="night">DUNKEL</button>
        </div>
        <div>
          <div class="clock" id="clock">--:--:--</div>
          <div class="date" id="date">--</div>
        </div>
      </div>
    </header>

    <div class="body">
      <!-- LINKS: Telemetrie / stdout -->
      <!-- Sensoren-Panel entfernt (2026-06): kein echter Sensor angeschlossen.
           Backend/Verkabelung bleibt – Box + setSensor()-Logik aus git-History
           zurückholen, sobald ein echter Sensor dranhängt. -->
      <div class="col">
        <div class="box" style="flex:0 0 auto">
          <span class="bt">telemetrie</span><span class="bt2" id="tele-src">…</span>
          <div class="meter">
            <span class="ml" id="tsg-lbl">LAP·CPU</span>
            <span class="mb" id="tsg-bar"></span>
            <span class="mv" id="tsg-val">–</span>
          </div>
        </div>
        <div class="box" style="flex:1 1 auto;min-height:0">
          <span class="bt">stdout</span><span class="bt2">live</span>
          <div class="term-body" id="term"></div>
        </div>
      </div>

      <!-- MITTE: leeres Skelett (kommt später, gemeinsam) -->
      <div class="col" id="col-mid">
        <div class="box mid-box">
          <span class="bt">mitte</span><span class="bt2">tbd</span>
          <div class="mid-skel">
            <div class="big">Kassette · laptop</div>
            <div class="small">Mitte noch leer — Inhalt folgt</div>
          </div>
        </div>
      </div>

      <!-- RECHTS: Lifestyle / Outbound -->
      <div class="col">
        <div class="box" style="flex:0 0 auto">
          <span class="bt">lifestyle</span>
          <!-- Tracker (sleep/food) noch nicht an /api/data verkabelt — ehrlich leer -->
          <div class="nodata">// tracker-quelle noch nicht verkabelt</div>
        </div>
        <div class="box net" style="flex:1 1 auto;min-height:0">
          <span class="bt">outbound</span><span class="bt2">tripwire</span>
          <div class="term-body" id="term-net"><div class="term-idle">// offline ✓</div></div>
        </div>
      </div>
    </div>
  </div>

  <script>
  /* ════════════════════════════════════════════════════════════════════
     Laptop-Adapter — eigenständig, schlank, KI-frei.
     Pollt NUR was die Kassette anzeigt:
       /api/state      (1 s)  → sensoren, stdout, outbound, uptime, datum
       /api/telemetry  (2 s)  → Laptop CPU/RAM/Temp (rotierendes Meter)
     Kein /api/ai/status, kein /api/chat/history → nichts läuft ins Leere.
     ════════════════════════════════════════════════════════════════════ */
  (function () {
    'use strict';
    var stage = document.getElementById('stage');

    // ── AUTO-Theme (hell 05–21, sonst dunkel) ──────────────────────────
    var themeMode = 'auto';
    function computeTheme() { var h = new Date().getHours(); return (h >= 5 && h < 21) ? 'day' : 'night'; }
    function applyTheme() { stage.setAttribute('data-theme', themeMode === 'auto' ? computeTheme() : themeMode); }
    document.getElementById('theme-ctl').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      themeMode = b.getAttribute('data-tm');
      [].forEach.call(this.children, function (c) { c.classList.toggle('on', c === b); });
      applyTheme();
    });

    // ── Uhr/Datum + Theme-Refresh (1 s, rein lokal — kein Netz) ─────────
    function hms() {
      var d = new Date();
      return [d.getHours(), d.getMinutes(), d.getSeconds()].map(function (n) { return ('0' + n).slice(-2); }).join(':');
    }
    var clockEl = document.getElementById('clock');
    function tickClock() { clockEl.textContent = hms(); if (themeMode === 'auto') applyTheme(); }
    tickClock(); applyTheme(); setInterval(tickClock, 1000);

    // ── stdout / outbound: Log-Zeilen token-coloriert anhängen ──────────
    function colorize(text) {
      var t = text.replace(/&/g, '&amp;').replace(/</g, '&lt;');
      var m = t.match(/^([A-ZÄÖÜ]+)/);
      var cls = { NET:'t-net', GRAPH:'t-graph', EVENT:'t-event', STT:'t-audio', TTS:'t-audio', WEBHOOK:'t-hook', CONSOLIDATE:'t-graph', STATE:'t-dim', CLOCK:'t-num', GESTURE:'t-acc', LOGGED:'t-event' };
      if (m && cls[m[1]]) t = '<span class="' + cls[m[1]] + '">' + m[1] + '</span>' + t.slice(m[1].length);
      t = t.replace(/(\d+[\d.:]*)/g, '<span class="t-num">$1</span>');
      return t;
    }
    function appendLog(id, e, cap) {
      var c = document.getElementById(id); var idle = c.querySelector('.term-idle'); if (idle) idle.remove();
      var row = document.createElement('div'); row.className = 'lg';
      row.innerHTML = '<span class="tt">' + (e.time || hms()) + '</span><span class="tx">' + colorize(e.text || '') + '</span>';
      c.insertBefore(row, c.firstChild); while (c.children.length > (cap || 100)) c.removeChild(c.lastChild);
    }

    // Sensoren-Panel entfernt (2026-06): kein echter Sensor angeschlossen.
    // /api/state liefert sensors weiterhin (Backend verkabelt) – wird hier
    // nur nicht mehr gezeichnet.

    // ── Telemetrie: rotierendes Meter über die LAPTOP-Werte ─────────────
    // Quelle ist /api/telemetry.pc (lokaler Host = der Laptop). Nicht
    // verfügbare Werte werden übersprungen.
    var ROT = [
      ['CPU',  'cpu',  '%'],
      ['RAM',  'ram',  '%'],
      ['TEMP', 'temp', '°C']
    ];
    var rotIdx = 0, lastMetrics = null;
    var tsgLbl = document.getElementById('tsg-lbl'), tsgBar = document.getElementById('tsg-bar'), tsgVal = document.getElementById('tsg-val');
    function rotValue(def) {
      var src = lastMetrics && lastMetrics.pc;
      var m = src && src[def[1]];
      if (!m || m.v == null) return null;
      var pct = def[1] === 'temp' ? (m.v - 30) / 60 * 100 : m.v;   // Temp ehrlich auf 30–90°C skaliert
      return { pct: pct, text: Math.round(m.v) + def[2] };
    }
    // Balken mit Sub-Zellen-Auflösung: volle █ + ein Teilblock (Achtel) +
    // matter Rest ░. Aus 16 Zellen werden so ~128 Stufen → 35 % und 40 %
    // sind sichtbar verschieden, nicht mehr derselbe Balken.
    var SUB = [' ', '▏', '▎', '▍', '▌', '▋', '▊', '▉'];
    function meterBar(pct, cells) {
      var f = Math.max(0, Math.min(100, pct)) / 100 * cells;
      var full = Math.floor(f), pi = Math.round((f - full) * 8);
      if (pi === 8) { full += 1; pi = 0; }
      var head = '█'.repeat(full) + (pi ? SUB[pi] : '');
      var tail = '░'.repeat(Math.max(0, cells - full - (pi ? 1 : 0)));
      return '<span class="mbf">' + head + '</span><span class="mbe">' + tail + '</span>';
    }
    function renderRot() {
      var tries = 0, def = null, val = null;
      while (tries < ROT.length) {
        def = ROT[rotIdx]; val = rotValue(def);
        if (val) break;
        rotIdx = (rotIdx + 1) % ROT.length; tries++;
      }
      if (!val) { tsgLbl.textContent = '—'; tsgBar.innerHTML = ''; tsgVal.textContent = '–'; return; }
      tsgLbl.textContent = 'LAP·' + def[0];
      tsgBar.innerHTML = meterBar(val.pct, 16);
      tsgVal.textContent = val.text;
    }
    setInterval(function () { rotIdx = (rotIdx + 1) % ROT.length; renderRot(); }, 2600);

    // ── Poll: /api/state (1 s) ──────────────────────────────────────────
    var lastLogLen = 0, lastNetLen = 0;
    var hNet = document.getElementById('h-net'), pUp = document.getElementById('p-up'), dateEl = document.getElementById('date');
    function pollState() {
      fetch('/api/state').then(function (r) { return r.json(); }).then(function (s) {
        // Datum
        if (s.time) dateEl.textContent = s.time;
        // Uptime
        if (s.uptime_s != null) {
          var u = s.uptime_s;
          pUp.textContent = [Math.floor(u / 3600), Math.floor(u / 60) % 60, u % 60].map(function (n) { return ('0' + n).slice(-2); }).join(':');
        }
        // stdout — nur den neuen Schwanz
        var logs = s.logs || [];
        if (logs.length < lastLogLen) lastLogLen = 0;   // Backend-Neustart → Reset
        for (var i = lastLogLen; i < logs.length; i++) appendLog('term', logs[i], 100);
        lastLogLen = logs.length;
        // Outbound-Tripwire + NET-Header
        var nets = s.internet_logs || [];
        if (nets.length > 0) { hNet.textContent = 'TRAFFIC !'; hNet.className = 'warn'; }
        else { hNet.textContent = 'OFFLINE ✓'; hNet.className = 'ok'; }
        if (nets.length < lastNetLen) lastNetLen = 0;
        for (var j = lastNetLen; j < nets.length; j++) appendLog('term-net', nets[j], 100);
        lastNetLen = nets.length;
      }).catch(function () { /* Backend kurz weg — nächster Tick versucht's erneut */ });
    }

    // ── Poll: /api/telemetry (2 s) ──────────────────────────────────────
    var teleSrc = document.getElementById('tele-src');
    function pollTelemetry() {
      fetch('/api/telemetry').then(function (r) { return r.json(); }).then(function (t) {
        if (t && !t.error) { lastMetrics = t; teleSrc.textContent = 'laptop live'; renderRot(); }
      }).catch(function () { /* nächster Tick rendert weiter '–' */ });
    }

    // ── Scale-to-fit: 1920×1080-Stage füllt jeden Viewport ──────────────
    function fitStage() {
      var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
    }
    fitStage(); window.addEventListener('resize', fitStage);

    // ── Loops starten ───────────────────────────────────────────────────
    pollState(); setInterval(pollState, 1000);
    pollTelemetry(); setInterval(pollTelemetry, 2000);
  })();
  </script>
</body>
</html>
