<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ZENTRALE · LAPTOP</title>
<!-- Fonts lokal vendored (offline-Pflicht): keine Google-Fonts-Anfrage übers Netz -->
<link rel="stylesheet" href="/static/fonts/fonts.css" />
<!--
  ════════════════════════════════════════════════════════════════════════
  ZENTRALE — Laptop-Kassette (laptop.html)
  ------------------------------------------------------------------------
  "ZENTRALE in klein" für die 0rammachine. BEWUSST eigenständig, NICHT vom
  Monolith abgeleitet (kein engine.js/viz.js/ascii.js, kein Frametick, kein
  Flicker). Was hier drinsteht ist abgestimmt (siehe memory/dashboard.md,
  Abschnitt "Kassetten"):

    - 3 Spalten, lean. KI komplett raus (kein Chat/Audio, kein Ollama-Status).
    - ZENTRALE-Optik, AUTO-Theme (hell tags / dunkel nachts), STATISCHE
      Scanlines (das ruhige Streifen-Overlay) — aber KEINE Dauer-Animation.
    - Eigener Mini-Adapter unten: pollt NUR /api/state (1s) + /api/telemetry
      (2s). Kein /api/ai/status, kein /api/chat/history -> nichts läuft ins
      Leere, minimaler RAM/CPU-Fußabdruck.
    - MITTE ist absichtlich ein leeres Skelett — der Inhalt wird gemeinsam
      festgelegt.
  ════════════════════════════════════════════════════════════════════════
-->
<style>
  /* ── Theme: TAG (hell/papier) — identisch zum Monolith für Wiedererkennung ── */
  [data-theme="day"] {
    --bg: #ece7dc; --paper: rgba(255,255,255,0.25);
    --ink: #232019; --bright: #000; --dim: #7c7768; --faint: #bdb6a4; --line: #cbc4b3;
    --acc: #2f6b48; --acc-soft: #6f8f7c;
    --t-net: #1d6a8c; --t-graph: #8a3fb0; --t-event: #3a7d3a; --t-audio: #2f6b48;
    --t-hook: #9a6a2c; --t-num: #9a6a2c; --t-dim: #9a9482; --warn: #9a6a2c;
    --scan: rgba(0,0,0,0.045);
  }
  /* ── Theme: NACHT (code-dark) ── */
  [data-theme="night"] {
    --bg: #0d1017; --paper: rgba(255,255,255,0.018);
    --ink: #c5cdd6; --bright: #eaf0f6; --dim: #909eae; --faint: #44505f; --line: #222a33;
    --acc: #7ec699; --acc-soft: #4f6353;
    --t-net: #56b6c2; --t-graph: #c678dd; --t-event: #98c379; --t-audio: #7ec699;
    --t-hook: #e0a458; --t-num: #d19a66; --t-dim: #5c6773; --warn: #e0a458;
    --scan: rgba(0,0,0,0.16);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }

  #stage {
    position: absolute; left: 50%; top: 50%;
    width: 1920px; height: 1080px;
    transform: translate(-50%, -50%); transform-origin: center;
    background: var(--bg); color: var(--ink);
    font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; line-height: 1.5;
    display: grid; grid-template-rows: 86px 1fr; padding: 22px 28px; gap: 14px; overflow: hidden;
    transition: background .8s ease, color .8s ease;
  }
  /* STATISCHE Scanlines: vollflächiges Streifen-Overlay, bewegt sich NICHT
     (kein keyframe) — genau der ruhige Look, der gewünscht ist. */
  #stage::after { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 60;
    background: repeating-linear-gradient(to bottom, transparent 0 3px, var(--scan) 3px 4px); }
  #stage > * { position: relative; z-index: 1; }

  .vt { font-family: 'VT323', monospace; }

  /* Header */
  .top { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
  .brand { font-weight: 700; font-size: 46px; letter-spacing: 0.24em; color: var(--bright); line-height: 1; }
  .brand .blk { background: var(--ink); color: var(--bg); padding: 0 8px; }
  /* KEIN Flackern in der Laptop-Kassette: "TRALE" steht still in Akzentfarbe. */
  .brand .still { color: var(--acc); }
  .brand-sub { font-size: 11px; letter-spacing: 0.32em; color: var(--dim); text-transform: uppercase; margin-top: 7px; }
  .meta { display: flex; gap: 22px; align-items: center; }
  .kv { font-size: 11px; letter-spacing: 0.1em; color: var(--dim); text-transform: uppercase; white-space: nowrap; }
  .kv b { color: var(--ink); font-weight: 600; }
  .kv .ok { color: var(--acc); }
  .kv .warn { color: var(--warn); }
  .clock { font-family: 'VT323', monospace; font-size: 50px; letter-spacing: 0.04em; color: var(--bright); text-align: right; line-height: 0.8; }
  .date { font-size: 11px; letter-spacing: 0.22em; color: var(--dim); text-align: right; text-transform: uppercase; margin-top: 2px; }
  /* Theme-Schalter */
  .theme-ctl { display: flex; border: 1px solid var(--line); }
  .theme-ctl button { font-family: 'VT323', monospace; font-size: 17px; letter-spacing: 0.08em; background: transparent; color: var(--dim); border: 0; padding: 4px 11px; cursor: pointer; border-right: 1px solid var(--line); }
  .theme-ctl button:last-child { border-right: 0; }
  .theme-ctl button.on { background: var(--acc); color: var(--bg); }

  /* Body: 3 Spalten, lean */
  .body { display: grid; grid-template-columns: 320px 1fr 360px; gap: 14px; min-height: 0; }
  .col { display: flex; flex-direction: column; gap: 14px; min-height: 0; }

  .box { border: 1px solid var(--line); padding: 23px 15px 12px; position: relative; display: flex; flex-direction: column; min-height: 0; background: var(--paper); }
  .box > .bt { position: absolute; top: -11px; left: 13px; background: var(--bg); padding: 0 9px; font-family: 'VT323', monospace; font-size: 19px; line-height: 1; letter-spacing: 0.14em; color: var(--acc); text-transform: uppercase; }
  .box > .bt::before { content: '┤ '; color: var(--faint); } .box > .bt::after { content: ' ├'; color: var(--faint); }
  .box > .bt2 { position: absolute; top: -9px; right: 13px; background: var(--bg); padding: 0 7px; font-size: 10px; letter-spacing: 0.12em; color: var(--dim); }

  /* Platzhalter für (noch) unverkabelte Daten-Panels — ehrlich, kein Fake-Wert */
  .nodata { color: var(--faint); font-size: 12px; letter-spacing: 0.06em; padding: 8px 2px; font-style: italic; }

  /* Sensoren */
  .srow { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 9px; padding: 5px 0; font-size: 14px; letter-spacing: 0.04em; border-bottom: 1px dotted var(--line); }
  .srow:last-child { border-bottom: 0; }
  .srow .ind { color: var(--faint); } .srow.on .ind { color: var(--acc); }
  .srow .nm { color: var(--ink); } .srow.on .nm { color: var(--bright); }
  .srow .val { color: var(--dim); font-size: 12px; } .srow.on .val { color: var(--acc); }

  /* Telemetrie: EIN rotierendes Meter (wechselt durch die Laptop-Werte) */
  .meter { display: grid; grid-template-columns: 84px 1fr 56px; align-items: center; gap: 9px; padding: 6px 0 2px; }
  .meter .ml { font-size: 13px; color: var(--acc); letter-spacing: 0.1em; }
  .meter .ml.stale { color: var(--warn); }
  .meter .mb { font-family: 'VT323', monospace; font-size: 18px; line-height: 1; white-space: pre; overflow: hidden; }
  .meter .mv { font-family: 'VT323', monospace; font-size: 18px; color: var(--bright); text-align: right; }
  .meter .mbf { color: var(--acc); }
  .meter .mbe { color: var(--faint); }

  /* Terminals (token-coloriert) — stdout + outbound */
  .term-body { flex: 1; overflow: hidden; display: flex; flex-direction: column-reverse; font-size: 13px; line-height: 1.5; }
  .term-body:hover { overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--acc) transparent; }
  .term-body:hover::-webkit-scrollbar { width: 7px; }
  .term-body:hover::-webkit-scrollbar-thumb { background: var(--acc); border-radius: 4px; }
  .term-body:hover::-webkit-scrollbar-track { background: transparent; }
  .lg { display: flex; gap: 10px; white-space: pre; }
  .lg .tt { color: var(--faint); } .lg .tx { color: var(--ink); }
  .t-net { color: var(--t-net); } .t-graph { color: var(--t-graph); } .t-event { color: var(--t-event); }
  .t-audio { color: var(--t-audio); } .t-hook { color: var(--t-hook); } .t-num { color: var(--t-num); }
  .t-dim { color: var(--t-dim); } .t-acc { color: var(--acc); }
  .box.net > .bt { color: var(--warn); } .box.net { border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }
  .box.net .tx { color: var(--warn); }
  .term-idle { color: var(--acc-soft); font-size: 13px; letter-spacing: 0.03em; }

  /* ── MITTE: leeres Skelett ───────────────────────────────────────────
     Bewusst Platzhalter. Inhalt wird gemeinsam festgelegt. */
  .mid-box { flex: 1; min-height: 0; align-items: center; justify-content: center; }
  .mid-skel { text-align: center; color: var(--faint); }
  .mid-skel .big { font-family: 'VT323', monospace; font-size: 40px; letter-spacing: 0.18em; color: var(--dim); text-transform: uppercase; }
  .mid-skel .small { font-size: 12px; letter-spacing: 0.14em; margin-top: 10px; text-transform: uppercase; }

  /* ── MITTE: Kalender (blätterbare Woche/Monat, teilt /api/calendar mit TUI
     und Monolith — die Datums-/Layer-Logik liegt im Backend, core/kalender.py) */
  .cal-box { align-items: stretch; justify-content: flex-start; gap: 12px; }
  .cal-head { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
  .cal-head button { font-family: 'VT323', monospace; font-size: 18px; background: transparent; color: var(--dim); border: 1px solid var(--line); padding: 2px 11px; cursor: pointer; }
  .cal-head button:hover { color: var(--acc); border-color: var(--acc); }
  .cal-head button.on { background: var(--acc); color: var(--bg); border-color: var(--acc); }
  .cal-label { font-family: 'VT323', monospace; font-size: 23px; color: var(--bright); letter-spacing: 0.04em; }
  .cal-alarm { color: var(--warn); font-size: 16px; margin-left: 7px; }
  .cal-space { flex: 1; }
  .cal-body { flex: 1; min-height: 0; overflow: auto; }
  .cw { display: flex; flex-direction: column; gap: 3px; }
  .cw-day { display: flex; gap: 10px; padding: 5px 4px; border-left: 3px solid transparent; align-items: baseline; }
  .cw-day.today { border-left-color: var(--acc); background: color-mix(in srgb, var(--acc) 9%, transparent); }
  .cw-date { min-width: 96px; color: var(--dim); font-size: 14px; white-space: nowrap; }
  .cw-day.today .cw-date { color: var(--acc); }
  .cw-ents { display: flex; flex-wrap: wrap; gap: 6px; }
  .cw-ent { font-size: 13px; padding: 1px 8px; border: 1px solid var(--line); color: var(--ink); white-space: nowrap; }
  .cw-ent.ausfall { color: var(--dim); border-style: dashed; }
  .cw-empty { color: var(--faint); font-style: italic; font-size: 12px; }
  .cm { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cm-wd { text-align: center; color: var(--dim); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; padding-bottom: 2px; }
  .cm-cell { border: 1px solid var(--line); min-height: 78px; padding: 3px 6px; display: flex; flex-direction: column; gap: 2px; overflow: hidden; background: var(--paper); }
  .cm-cell.out { opacity: 0.32; }
  .cm-cell.today { border-color: var(--acc); }
  .cm-num { font-size: 14px; color: var(--ink); }
  .cm-cell.today .cm-num { color: var(--acc); font-weight: 700; }
  .cm-mark { font-size: 12px; color: var(--acc); line-height: 1.12; }
  .cal-head button.cal-add { color: var(--acc); }
  .cal-form { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 0; margin-bottom: 6px; border-bottom: 1px solid var(--line); }
  .cal-form input { font-family: 'VT323', monospace; font-size: 16px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); padding: 2px 7px; }
  .cal-form input:focus { outline: none; border-color: var(--acc); }
  .cal-msg { font-size: 13px; color: var(--dim); padding: 2px 0 6px; }
  .cal-msg.warn { color: var(--warn); }
  .cw-del { margin-left: 6px; color: var(--dim); cursor: pointer; opacity: 0.55; }
  .cw-del:hover { color: var(--warn); opacity: 1; }
  .cw-act { margin-left: 6px; color: var(--dim); cursor: pointer; opacity: 0.6; }
  .cw-act:hover { color: var(--acc); opacity: 1; }
  .cw-ent.deakt { opacity: 0.4; text-decoration: line-through; border-style: dashed; color: var(--dim); }
  .cw-ent.deakt .cw-act, .cw-ent.deakt .cw-del { text-decoration: none; opacity: 1; }
  .cal-form button.on { background: var(--acc); color: var(--bg); border-color: var(--acc); }
  .cal-wdays { display: inline-flex; gap: 2px; }
  .cal-wd { font-family: 'VT323', monospace; font-size: 16px; padding: 2px 7px; background: transparent; color: var(--dim); border: 1px solid var(--line); cursor: pointer; }
  .cal-wd.on { background: var(--acc); color: var(--bg); border-color: var(--acc); }
</style>
</head>
<body>
  <div id="stage" data-theme="day">
    <header class="top">
      <div>
        <div class="brand"><span class="blk">ZEN</span><span class="still">TRALE</span></div>
        <div class="brand-sub">laptop · kassette</div>
      </div>
      <div class="meta">
        <!-- KEIN Ollama-Status: KI ist in dieser Kassette aus. -->
        <div class="kv">NET <b id="h-net" class="ok">OFFLINE ✓</b></div>
        <div class="kv">UP <b id="p-up">—</b></div>
        <div class="theme-ctl" id="theme-ctl">
          <button data-tm="auto" class="on">AUTO</button>
          <button data-tm="day">HELL</button>
          <button data-tm="night">DUNKEL</button>
        </div>
        <div>
          <div class="clock" id="clock">--:--:--</div>
          <div class="date" id="date">--</div>
        </div>
      </div>
    </header>

    <div class="body">
      <!-- LINKS: Telemetrie / stdout -->
      <!-- Sensoren-Panel entfernt (2026-06): kein echter Sensor angeschlossen.
           Backend/Verkabelung bleibt – Box + setSensor()-Logik aus git-History
           zurückholen, sobald ein echter Sensor dranhängt. -->
      <div class="col">
        <div class="box" style="flex:0 0 auto">
          <span class="bt">telemetrie</span><span class="bt2" id="tele-src">…</span>
          <div class="meter">
            <span class="ml" id="tsg-lbl">LAP·CPU</span>
            <span class="mb" id="tsg-bar"></span>
            <span class="mv" id="tsg-val">–</span>
          </div>
        </div>
        <div class="box" style="flex:1 1 auto;min-height:0">
          <span class="bt">stdout</span><span class="bt2">live</span>
          <div class="term-body" id="term"></div>
        </div>
      </div>

      <!-- MITTE: leeres Skelett (kommt später, gemeinsam) -->
      <div class="col" id="col-mid">
        <div class="box mid-box cal-box">
          <span class="bt">kalender</span><span class="bt2" id="cal-sub">woche</span>
          <div class="cal-head">
            <button data-nav="-1" title="zurück">◀</button>
            <button data-today="1">heute</button>
            <button data-nav="1" title="vor">▶</button>
            <button data-add="1" class="cal-add">＋ Termin</button>
            <span class="cal-label" id="cal-label">…</span>
            <span class="cal-space"></span>
            <button data-view="week" class="on">Woche</button>
            <button data-view="month">Monat</button>
          </div>
          <div class="cal-body" id="cal-body"></div>
        </div>
      </div>

      <!-- RECHTS: Lifestyle / Outbound -->
      <div class="col">
        <div class="box" style="flex:0 0 auto">
          <span class="bt">lifestyle</span>
          <!-- Tracker (sleep/food) noch nicht an /api/data verkabelt — ehrlich leer -->
          <div class="nodata">// tracker-quelle noch nicht verkabelt</div>
        </div>
        <div class="box net" style="flex:1 1 auto;min-height:0">
          <span class="bt">outbound</span><span class="bt2">tripwire</span>
          <div class="term-body" id="term-net"><div class="term-idle">// offline ✓</div></div>
        </div>
      </div>
    </div>
  </div>

  <script>
  /* ════════════════════════════════════════════════════════════════════
     Laptop-Adapter — eigenständig, schlank, KI-frei.
     Pollt NUR was die Kassette anzeigt:
       /api/state      (1 s)  → sensoren, stdout, outbound, uptime, datum
       /api/telemetry  (2 s)  → Laptop CPU/RAM/Temp (rotierendes Meter)
     Kein /api/ai/status, kein /api/chat/history → nichts läuft ins Leere.
     ════════════════════════════════════════════════════════════════════ */
  (function () {
    'use strict';
    var stage = document.getElementById('stage');

    // ── AUTO-Theme (hell 05–21, sonst dunkel) ──────────────────────────
    var themeMode = 'auto';
    function computeTheme() { var h = new Date().getHours(); return (h >= 5 && h < 21) ? 'day' : 'night'; }
    function applyTheme() { stage.setAttribute('data-theme', themeMode === 'auto' ? computeTheme() : themeMode); }
    document.getElementById('theme-ctl').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      themeMode = b.getAttribute('data-tm');
      [].forEach.call(this.children, function (c) { c.classList.toggle('on', c === b); });
      applyTheme();
    });

    // ── Uhr/Datum + Theme-Refresh (1 s, rein lokal — kein Netz) ─────────
    function hms() {
      var d = new Date();
      return [d.getHours(), d.getMinutes(), d.getSeconds()].map(function (n) { return ('0' + n).slice(-2); }).join(':');
    }
    var clockEl = document.getElementById('clock');
    function tickClock() { clockEl.textContent = hms(); if (themeMode === 'auto') applyTheme(); }
    tickClock(); applyTheme(); setInterval(tickClock, 1000);

    // ── stdout / outbound: Log-Zeilen token-coloriert anhängen ──────────
    function colorize(text) {
      var t = text.replace(/&/g, '&amp;').replace(/</g, '&lt;');
      var m = t.match(/^([A-ZÄÖÜ]+)/);
      var cls = { NET:'t-net', GRAPH:'t-graph', EVENT:'t-event', STT:'t-audio', TTS:'t-audio', WEBHOOK:'t-hook', CONSOLIDATE:'t-graph', STATE:'t-dim', CLOCK:'t-num', GESTURE:'t-acc', LOGGED:'t-event' };
      if (m && cls[m[1]]) t = '<span class="' + cls[m[1]] + '">' + m[1] + '</span>' + t.slice(m[1].length);
      t = t.replace(/(\d+[\d.:]*)/g, '<span class="t-num">$1</span>');
      return t;
    }
    function appendLog(id, e, cap) {
      var c = document.getElementById(id); var idle = c.querySelector('.term-idle'); if (idle) idle.remove();
      var row = document.createElement('div'); row.className = 'lg';
      row.innerHTML = '<span class="tt">' + (e.time || hms()) + '</span><span class="tx">' + colorize(e.text || '') + '</span>';
      c.insertBefore(row, c.firstChild); while (c.children.length > (cap || 100)) c.removeChild(c.lastChild);
    }

    // Sensoren-Panel entfernt (2026-06): kein echter Sensor angeschlossen.
    // /api/state liefert sensors weiterhin (Backend verkabelt) – wird hier
    // nur nicht mehr gezeichnet.

    // ── Telemetrie: rotierendes Meter über die LAPTOP-Werte ─────────────
    // Quelle ist /api/telemetry.pc (lokaler Host = der Laptop). Nicht
    // verfügbare Werte werden übersprungen.
    var ROT = [
      ['CPU',  'cpu',  '%'],
      ['RAM',  'ram',  '%'],
      ['TEMP', 'temp', '°C']
    ];
    var rotIdx = 0, lastMetrics = null;
    var tsgLbl = document.getElementById('tsg-lbl'), tsgBar = document.getElementById('tsg-bar'), tsgVal = document.getElementById('tsg-val');
    function rotValue(def) {
      var src = lastMetrics && lastMetrics.pc;
      var m = src && src[def[1]];
      if (!m || m.v == null) return null;
      var pct = def[1] === 'temp' ? (m.v - 30) / 60 * 100 : m.v;   // Temp ehrlich auf 30–90°C skaliert
      return { pct: pct, text: Math.round(m.v) + def[2] };
    }
    // Balken mit Sub-Zellen-Auflösung: volle █ + ein Teilblock (Achtel) +
    // matter Rest ░. Aus 16 Zellen werden so ~128 Stufen → 35 % und 40 %
    // sind sichtbar verschieden, nicht mehr derselbe Balken.
    var SUB = [' ', '▏', '▎', '▍', '▌', '▋', '▊', '▉'];
    function meterBar(pct, cells) {
      var f = Math.max(0, Math.min(100, pct)) / 100 * cells;
      var full = Math.floor(f), pi = Math.round((f - full) * 8);
      if (pi === 8) { full += 1; pi = 0; }
      var head = '█'.repeat(full) + (pi ? SUB[pi] : '');
      var tail = '░'.repeat(Math.max(0, cells - full - (pi ? 1 : 0)));
      return '<span class="mbf">' + head + '</span><span class="mbe">' + tail + '</span>';
    }
    function renderRot() {
      var tries = 0, def = null, val = null;
      while (tries < ROT.length) {
        def = ROT[rotIdx]; val = rotValue(def);
        if (val) break;
        rotIdx = (rotIdx + 1) % ROT.length; tries++;
      }
      if (!val) { tsgLbl.textContent = '—'; tsgBar.innerHTML = ''; tsgVal.textContent = '–'; return; }
      tsgLbl.textContent = 'LAP·' + def[0];
      tsgBar.innerHTML = meterBar(val.pct, 16);
      tsgVal.textContent = val.text;
    }
    setInterval(function () { rotIdx = (rotIdx + 1) % ROT.length; renderRot(); }, 2600);

    // ── Poll: /api/state (1 s) ──────────────────────────────────────────
    var lastLogLen = 0, lastNetLen = 0;
    var hNet = document.getElementById('h-net'), pUp = document.getElementById('p-up'), dateEl = document.getElementById('date');
    function pollState() {
      fetch('/api/state').then(function (r) { return r.json(); }).then(function (s) {
        // Datum
        if (s.time) dateEl.textContent = s.time;
        // Uptime
        if (s.uptime_s != null) {
          var u = s.uptime_s;
          pUp.textContent = [Math.floor(u / 3600), Math.floor(u / 60) % 60, u % 60].map(function (n) { return ('0' + n).slice(-2); }).join(':');
        }
        // stdout — nur den neuen Schwanz
        var logs = s.logs || [];
        if (logs.length < lastLogLen) lastLogLen = 0;   // Backend-Neustart → Reset
        for (var i = lastLogLen; i < logs.length; i++) appendLog('term', logs[i], 100);
        lastLogLen = logs.length;
        // Outbound-Tripwire + NET-Header
        var nets = s.internet_logs || [];
        if (nets.length > 0) { hNet.textContent = 'TRAFFIC !'; hNet.className = 'warn'; }
        else { hNet.textContent = 'OFFLINE ✓'; hNet.className = 'ok'; }
        if (nets.length < lastNetLen) lastNetLen = 0;
        for (var j = lastNetLen; j < nets.length; j++) appendLog('term-net', nets[j], 100);
        lastNetLen = nets.length;
      }).catch(function () { /* Backend kurz weg — nächster Tick versucht's erneut */ });
    }

    // ── Poll: /api/telemetry (2 s) ──────────────────────────────────────
    var teleSrc = document.getElementById('tele-src');
    function pollTelemetry() {
      fetch('/api/telemetry').then(function (r) { return r.json(); }).then(function (t) {
        if (t && !t.error) { lastMetrics = t; teleSrc.textContent = 'laptop live'; renderRot(); }
      }).catch(function () { /* nächster Tick rendert weiter '–' */ });
    }

    // ── Scale-to-fit: 1920×1080-Stage füllt jeden Viewport ──────────────
    function fitStage() {
      var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
    }
    fitStage(); window.addEventListener('resize', fitStage);

    // ── Kalender (Mitte): blätterbare Woche/Monat ───────────────────────
    // Reiner Zeichner wie TUI/Monolith: die Datums-/Layer-Logik liegt im
    // Backend (core/kalender.py → /api/calendar), wir klassifizieren nur view
    // und blättern über ref. KI-frei, derselbe Endpoint für alle Kassetten.
    (function () {
      var body = document.getElementById('cal-body');
      if (!body) return;
      var labelEl = document.getElementById('cal-label'), subEl = document.getElementById('cal-sub');
      var head = body.parentNode.querySelector('.cal-head');
      var WD = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
      var WDCODE = ['MO', 'TU', 'WE', 'TH', 'FR', 'SA', 'SU'];
      var view = 'week', ref = isoToday();
      var adding = false, editing = null, form = {}, msg = '', msgWarn = false, lastData = {};

      function isoToday() { return iso(new Date()); }
      function iso(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
      function parseISO(s) { var p = String(s).split('-'); var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])); return isNaN(d.getTime()) ? null : d; }
      function addDays(d, n) { var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
      function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
      function dayEnts(days, k) { var v = days[k]; return Array.isArray(v) ? v : []; }
      function entLabel(e) {
        if (e && e.ausfall) return 'ℹ ' + ((e.label) || '?');
        var t = (e && e.time && e.ende) ? (e.time + '–' + e.ende + ' ') : (e && e.time ? e.time + ' ' : '');
        return t + ((e && e.label) || '?');
      }

      function load() {
        fetch('/api/calendar?view=' + view + '&ref=' + ref)
          .then(function (r) { return r.json(); }).then(render)
          .catch(function () { body.innerHTML = '<div class="cw-empty">kalender nicht erreichbar.</div>'; });
      }
      function step(delta) {
        var d = parseISO(ref) || new Date();
        if (view === 'month') d = new Date(d.getFullYear(), d.getMonth() + delta, 1);
        else d = addDays(d, 7 * delta);
        ref = iso(d); load();
      }

      function render(d) {
        d = d || lastData || {};
        lastData = d;
        var days = (d.days && typeof d.days === 'object') ? d.days : {};
        var label = (typeof d.label === 'string') ? d.label : '';
        var nalarm = Array.isArray(d.alarms) ? d.alarms.length : 0;
        labelEl.innerHTML = esc(label) + (nalarm ? '<span class="cal-alarm" title="' + nalarm + ' offene erinnerung(en)">⚠' + nalarm + '</span>' : '');
        subEl.textContent = view;
        var top = '';
        if (adding) {
          var isRt = (form.type === 'routine');
          var fh = ['<div class="cal-form">'];
          if (!editing) {
            fh.push('<button data-ftype="entry" class="' + (!isRt ? 'on' : '') + '">Termin</button>');
            fh.push('<button data-ftype="routine" class="' + (isRt ? 'on' : '') + '">Routine</button>');
          }
          if (isRt) {
            fh.push('<span class="cal-wdays">');
            WD.forEach(function (w, i) {
              fh.push('<button class="cal-wd' + ((form.byday || []).indexOf(WDCODE[i]) >= 0 ? ' on' : '')
                + '" data-wd="' + WDCODE[i] + '">' + w + '</button>');
            });
            fh.push('</span>');
          } else {
            fh.push('<input type="date" id="cf-day" value="' + esc(form.day || d.today || isoToday()) + '" />');
          }
          fh.push('<input id="cf-time" placeholder="HH:MM" size="5" maxlength="5" value="' + esc(form.time || '') + '" />');
          fh.push('<input id="cf-label" placeholder="Titel" style="flex:1;min-width:90px" value="' + esc(form.label || '') + '" />');
          fh.push('<input id="cf-ort" placeholder="Ort (optional)" size="12" value="' + esc(form.ort || '') + '" />');
          fh.push('<button data-save="1">' + (editing ? 'ändern' : (isRt ? 'Routine anlegen' : 'anlegen')) + '</button>');
          fh.push(editing ? '<button data-canceledit="1" title="abbrechen">×</button>' : '');
          fh.push('</div>');
          top += fh.join('');
        }
        if (msg) top += '<div class="cal-msg' + (msgWarn ? ' warn' : '') + '">' + esc(msg) + '</div>';
        body.innerHTML = top + ((view === 'month') ? renderMonth(d, days) : renderWeek(d, days));
        if (adding) { var lf = body.querySelector('#cf-label'); if (lf) lf.focus(); }
      }

      function captureForm() {
        var q = function (s) { var el = body.querySelector(s); return el ? el.value : undefined; };
        if (q('#cf-day') !== undefined) form.day = q('#cf-day');
        if (q('#cf-time') !== undefined) form.time = q('#cf-time');
        if (q('#cf-label') !== undefined) form.label = q('#cf-label');
        if (q('#cf-ort') !== undefined) form.ort = q('#cf-ort');
      }

      function addEntry() {
        captureForm();
        var label = (form.label || '').trim();
        var time = (form.time || '').trim();
        var ort = (form.ort || '').trim();
        if (!label) { msg = 'Titel fehlt.'; msgWarn = true; render(); return; }

        if (form.type === 'routine' && !editing) {       // NEUE wöchentliche Routine
          if (!(form.byday || []).length) { msg = 'Wochentag wählen.'; msgWarn = true; render(); return; }
          fetch('/api/calendar/routine', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ label: label, byday: form.byday, time: time, ort: ort })
          }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
            .then(function (res) {
              if (!res.ok) { msg = res.j.error || 'fehlgeschlagen.'; msgWarn = true; render(); return; }
              adding = false; form = {}; msg = 'Routine angelegt: ' + label; msgWarn = false; load();
            }).catch(function () { msg = 'netzwerkfehler.'; msgWarn = true; render(); });
          return;
        }

        var day = (form.day || '').trim();
        var method, payload;
        if (editing) {
          method = 'PUT';
          payload = { day: editing.iso, label: editing.label, layer: editing.layer,
                      new: { day: day, label: label, time: time, ort: ort } };
        } else {
          method = 'POST';
          payload = { day: day, label: label, time: time, ort: ort };
        }
        fetch('/api/calendar/entry', {
          method: method, headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
          .then(function (res) {
            if (!res.ok) { msg = res.j.error || 'fehlgeschlagen.'; msgWarn = true; render(); return; }
            var verb = editing ? 'geändert: ' : 'angelegt: ';
            adding = false; editing = null; form = {};
            var warn = (res.j.conflicts && res.j.conflicts.length) ? ' · ⚠ ' + res.j.conflicts.join(' · ') : '';
            msg = verb + label + warn; msgWarn = !!warn;
            ref = day || ref; load();
          }).catch(function () { msg = 'netzwerkfehler.'; msgWarn = true; render(); });
      }
      function beginEdit(isoDay, label, layer, time, ort) {
        editing = { iso: isoDay, label: label, layer: layer };
        form = { type: 'entry', day: isoDay, time: time || '', label: label, ort: ort || '' };
        adding = true; msg = ''; render();
      }
      function delEntry(day, label, layer) {
        fetch('/api/calendar/entry', {
          method: 'DELETE', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ day: day, label: label, layer: layer || undefined })
        }).then(function (r) { return r.json(); }).then(function (j) {
          msg = (j.deleted ? 'gelöscht: ' + label : 'nichts gelöscht.'); msgWarn = !j.deleted; load();
        }).catch(function () { msg = 'netzwerkfehler.'; msgWarn = true; render(); });
      }
      function routineToggle(day, label, layer, off) {
        fetch('/api/calendar/routine/skip', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ layer: layer, label: label, day: day, off: off })
        }).then(function (r) {
          if (!r.ok) { msg = 'fehlgeschlagen (Backend neu starten?).'; msgWarn = true; render(); return; }
          msg = (off ? 'deaktiviert: ' : 'aktiviert: ') + label; msgWarn = false; load();
        }).catch(function () { msg = 'netzwerkfehler.'; msgWarn = true; render(); });
      }
      function routineDelete(label, layer) {
        if (!confirm('Ganze Routine „' + label + '" löschen? Alle Vorkommen verschwinden.')) return;
        fetch('/api/calendar/routine', {
          method: 'DELETE', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ layer: layer, label: label })
        }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); }).then(function (res) {
          if (!res.ok) { msg = 'fehlgeschlagen (Backend neu starten?).'; msgWarn = true; render(); return; }
          msg = (res.j.deleted ? 'Routine gelöscht: ' + label : 'nichts gelöscht.'); msgWarn = !res.j.deleted; load();
        }).catch(function () { msg = 'netzwerkfehler.'; msgWarn = true; render(); });
      }
      function renderWeek(d, days) {
        var start = parseISO(d.start), end = parseISO(d.end);
        if (!start || !end) return '<div class="cw-empty">keine daten.</div>';
        var out = ['<div class="cw">'], cur = start, g = 0;
        while (cur <= end && g++ < 40) {
          var k = iso(cur), es = dayEnts(days, k), isT = (k === d.today);
          out.push('<div class="cw-day' + (isT ? ' today' : '') + '"><span class="cw-date">'
            + WD[(cur.getDay() + 6) % 7] + ' ' + ('0' + cur.getDate()).slice(-2) + '.' + ('0' + (cur.getMonth() + 1)).slice(-2) + '.</span><span class="cw-ents">');
          if (!es.length) out.push('<span class="cw-empty">—</span>');
          else es.forEach(function (e) {
            if (!e || typeof e !== 'object') return;
            // Einmal: ✎ bearbeiten + ✕ löschen. Routine: ⊘ deaktivieren / ↺ aktivieren.
            var lbl = (e.label || ''), deakt = !!e.deaktiviert, acts = '';
            if (e.ausfall) {
              acts = '';
            } else if (e.recurring) {
              acts = '<span class="cw-act" title="' + (deakt ? 'wieder aktivieren' : 'diesen Termin deaktivieren')
                + '" data-rt-day="' + k + '" data-rt-label="' + esc(lbl) + '" data-rt-layer="' + esc(e.layer || '')
                + '" data-rt-off="' + (deakt ? '0' : '1') + '">' + (deakt ? '↺' : '⊘') + '</span>'
                + '<span class="cw-del" title="ganze Routine löschen" data-rd-label="' + esc(lbl)
                + '" data-rd-layer="' + esc(e.layer || '') + '">🗑</span>';
            } else {
              acts = '<span class="cw-act" title="bearbeiten" data-edit-day="' + k + '" data-edit-label="' + esc(lbl)
                + '" data-edit-layer="' + esc(e.layer || '') + '" data-edit-time="' + esc(e.time || '')
                + '" data-edit-ort="' + esc(e.ort || '') + '">✎</span>'
                + '<span class="cw-del" title="löschen" data-del-day="' + k + '" data-del-label="' + esc(lbl)
                + '" data-del-layer="' + esc(e.layer || '') + '">✕</span>';
            }
            var txt = (deakt ? '✗ ' : '') + entLabel(e) + (e.ort ? ' @' + e.ort : '') + (deakt ? ' (aus)' : '');
            out.push('<span class="cw-ent' + (e.ausfall ? ' ausfall' : '') + (deakt ? ' deakt' : '') + '" title="'
              + esc(entLabel(e) + (e.ort ? ' @' + e.ort : '')) + '">' + esc(txt) + acts + '</span>');
          });
          out.push('</span></div>');
          cur = addDays(cur, 1);
        }
        out.push('</div>'); return out.join('');
      }
      function renderMonth(d, days) {
        var start = parseISO(d.start), end = parseISO(d.end), first = parseISO(d.first), last = parseISO(d.last);
        if (!start || !end) return '<div class="cw-empty">keine daten.</div>';
        var out = ['<div class="cm">'];
        WD.forEach(function (w) { out.push('<div class="cm-wd">' + w + '</div>'); });
        var cur = start, g = 0;
        while (cur <= end && g++ < 50) {
          var k = iso(cur), es = dayEnts(days, k), isT = (k === d.today);
          var isOut = (first && cur < first) || (last && cur > last);
          out.push('<div class="cm-cell' + (isT ? ' today' : '') + (isOut ? ' out' : '') + '"><span class="cm-num">' + cur.getDate() + '</span>');
          if (es.length) {
            var marks = es.slice(0, 3).map(function (e) { return esc(entLabel(e)); });
            out.push('<span class="cm-mark" title="' + esc(es.map(entLabel).join('\n')) + '">'
              + marks.join('<br>') + (es.length > 3 ? '<br>+' + (es.length - 3) : '') + '</span>');
          }
          out.push('</div>');
          cur = addDays(cur, 1);
        }
        out.push('</div>'); return out.join('');
      }

      head.addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b) return;
        if (b.hasAttribute('data-nav')) { msg = ''; step(Number(b.getAttribute('data-nav'))); }
        else if (b.hasAttribute('data-today')) { msg = ''; ref = isoToday(); load(); }
        else if (b.hasAttribute('data-add')) { adding = !adding; editing = null; msg = ''; form = adding ? { type: 'entry', day: (lastData && lastData.today) || isoToday(), byday: [] } : {}; b.classList.toggle('on', adding); render(); }
        else if (b.hasAttribute('data-view')) {
          var v = b.getAttribute('data-view');
          if (v !== view) { msg = ''; view = v; [].forEach.call(head.querySelectorAll('[data-view]'), function (x) { x.classList.toggle('on', x === b); }); load(); }
        }
      });
      // Save/Cancel/Edit/Delete/Routine liegen im (JS-gerenderten) Body → Delegation.
      body.addEventListener('click', function (e) {
        if (e.target.closest('[data-save]')) { addEntry(); return; }
        if (e.target.closest('[data-canceledit]')) { adding = false; editing = null; form = {}; render(); return; }
        var ft = e.target.closest('[data-ftype]');
        if (ft) { captureForm(); form.type = ft.getAttribute('data-ftype'); if (!form.byday) form.byday = []; render(); return; }
        var wd = e.target.closest('[data-wd]');
        if (wd) { captureForm(); var c = wd.getAttribute('data-wd'); form.byday = form.byday || []; var i = form.byday.indexOf(c); if (i >= 0) form.byday.splice(i, 1); else form.byday.push(c); render(); return; }
        var ed = e.target.closest('[data-edit-label]');
        if (ed) { e.stopPropagation(); beginEdit(ed.getAttribute('data-edit-day'), ed.getAttribute('data-edit-label'), ed.getAttribute('data-edit-layer'), ed.getAttribute('data-edit-time'), ed.getAttribute('data-edit-ort')); return; }
        var rt = e.target.closest('[data-rt-label]');
        if (rt) { e.stopPropagation(); routineToggle(rt.getAttribute('data-rt-day'), rt.getAttribute('data-rt-label'), rt.getAttribute('data-rt-layer'), rt.getAttribute('data-rt-off') === '1'); return; }
        var rd = e.target.closest('[data-rd-label]');
        if (rd) { e.stopPropagation(); routineDelete(rd.getAttribute('data-rd-label'), rd.getAttribute('data-rd-layer')); return; }
        var d = e.target.closest('[data-del-label]');
        if (d) { e.stopPropagation(); delEntry(d.getAttribute('data-del-day'), d.getAttribute('data-del-label'), d.getAttribute('data-del-layer')); }
      });
      body.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && e.target && /^cf-(label|time|ort|day)$/.test(e.target.id)) addEntry();
      });
      load();
      setInterval(function () { if (!adding) load(); }, 60000);   // minütlich auffrischen, aber nicht während der Eingabe
    })();

    // ── Loops starten ───────────────────────────────────────────────────
    pollState(); setInterval(pollState, 1000);
    pollTelemetry(); setInterval(pollTelemetry, 2000);
  })();
  </script>
</body>
</html>
