[pytest]
# Smoke-Test-Suite für ZENTRALE. Bewusst schlank: kein Netzwerk, kein Ollama,
# keine echte Hardware — nur dass das Grundgerüst hochkommt und die geflickten
# Stellen (TUI-Größencheck, Boot-Höhe der bash) sich korrekt verhalten.
#   Ausführen:  venv/bin/python -m pytest
testpaths = tests

# -m "not kostet_geld": Tests, die eine echte (kostenpflichtige) Cloud-Leitung
# anfassen, laufen NICHT im normalen Durchlauf. Sie werden von Hand angestossen:
#     venv/bin/python -m pytest -m kostet_geld
# Grund siehe tests/conftest.py, Punkt 5.
addopts = -q -m "not kostet_geld"

markers =
    kostet_geld: faehrt gegen eine echte Cloud-API und kostet Geld. Laeuft nur, wenn ausdruecklich per -m kostet_geld angefordert.
