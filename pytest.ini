[pytest]
# Smoke-Test-Suite für ZENTRALE. Bewusst schlank: kein Netzwerk, kein Ollama,
# keine echte Hardware — nur dass das Grundgerüst hochkommt und die geflickten
# Stellen (TUI-Größencheck, Boot-Höhe der bash) sich korrekt verhalten.
#   Ausführen:  venv/bin/python -m pytest
testpaths = tests
addopts = -q
