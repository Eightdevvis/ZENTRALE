# ZENTRALE als Systemeinheit — i3-Teil
#
# Wird per `include` aus ~/.config/i3/config gezogen (i3 >= 4.20), damit die
# Regeln versioniert im Repo liegen und nicht in einer Konfiguration, die auf
# jedem Knoten anders aussieht.
#
# ── Was das hier macht ────────────────────────────────────────────────
# ZENTRALE ist kein Terminal mehr, das man aufruft, sondern etwas, das
# laeuft: Der Kern startet mit der Sitzung als Benutzer-Dienst, das Fenster
# liegt im Scratchpad und kommt auf $mod+z ueber das, was gerade offen ist —
# egal auf welchem Workspace.
#
# Sashas Vorgabe, 19.08.2026: "zentrale autostartet mit der maschine und ist
# default offen. mit cmd+z kann ich immer auf sie wechseln egal was ich sonst
# grad mache." $mod ist Mod4 = Super = die Cmd-Taste auf seiner Tastatur.

# ── Der Kern: laeuft ohne offenes Fenster ─────────────────────────────
# Der Dienst haelt das Backend samt Takt am Leben, auch wenn keine TUI offen
# ist. Ohne ihn kann sie nur mahnen, wenn ohnehin jemand hinschaut.
exec --no-startup-id systemctl --user start zentrale-kern.service

# ── Das Fenster ───────────────────────────────────────────────────────
# --disable-server ist NOETIG: xfce4-terminal laeuft sonst als ein einziger
# Server-Prozess und haengt neue Fenster dort an — die Rolle ginge verloren
# und die Regel unten faende nichts.
#
# Erkannt wird ueber window_role, nicht ueber die Klasse: xfce4-terminal
# vergibt fuer JEDES Fenster dieselbe Klasse. Ein Match darauf wuerde jedes
# beliebige Terminal ins Scratchpad ziehen.
exec --no-startup-id xfce4-terminal --disable-server --role=zentrale --title=ZENTRALE --command=zentrale-tui

for_window [window_role="zentrale"] floating enable, resize set 1280 780, move position center, move scratchpad

# ── Die Taste ─────────────────────────────────────────────────────────
# Fest auf ZENTRALEs Fenster gebunden, NICHT auf "das naechste im
# Scratchpad": der Scratchpad kann mehrere Fenster halten und blaettert bei
# wiederholtem Druecken durch. Sonst kaeme irgendwann etwas anderes hoch.
# Ein zweiter Druck legt sie wieder weg (i3 blendet ein sichtbares
# Scratchpad-Fenster auf demselben Kriterium wieder aus).
bindsym $mod+z [window_role="zentrale"] scratchpad show

# Nachstarten, falls das Fenster mal weg ist (Absturz, versehentlich
# geschlossen) — dieselbe Taste mit Shift.
bindsym $mod+Shift+z exec --no-startup-id xfce4-terminal --disable-server --role=zentrale --title=ZENTRALE --command=zentrale-tui
