# ZENTRALE als Systemeinheit — i3-Teil
#
# Wird per `include` aus ~/.config/i3/config gezogen (i3 >= 4.20), damit die
# Regeln versioniert im Repo liegen und nicht in einer Konfiguration, die auf
# jedem Knoten anders aussieht.
#
# Sashas Vorgabe, 19.08.2026: "zentrale autostartet mit der maschine und ist
# default offen. mit cmd+z kann ich immer auf sie wechseln egal was ich sonst
# grad mache." $mod ist Mod4 = Super = die Cmd-Taste auf seiner Tastatur.

# ── Der Kern: laeuft ohne offenes Fenster ─────────────────────────────
# Der Dienst haelt das Backend samt Takt am Leben, auch wenn keine TUI offen
# ist. Ohne ihn kann sie nur mahnen, wenn ohnehin jemand hinschaut.
exec --no-startup-id systemctl --user start zentrale-kern.service

# ── Das Fenster ───────────────────────────────────────────────────────
# --disable-server ist NOETIG: xfce4-terminal laeuft sonst als ein einziger
# Server-Prozess und haengt neue Fenster dort an — die Rolle ginge verloren
# und die Regel unten faende nichts.
#
# Erkannt wird ueber window_role, nicht ueber die Klasse: xfce4-terminal
# vergibt fuer JEDES Fenster dieselbe Klasse. Ein Match darauf wuerde jedes
# beliebige Terminal erwischen.
# Gestartet wird ueber denselben Umschalter, der auch auf $mod+z liegt.
# EINE Stelle, die das Fenster oeffnet und platziert — sonst tut es beim
# Anmelden jemand anderes als beim Tastendruck, und die beiden laufen
# auseinander.
exec --no-startup-id zentrale-fenster

# ── KEIN `move scratchpad` in dieser Regel ────────────────────────────
# Hier stand bis zum 20.08.2026 zusaetzlich `move scratchpad`, und genau das
# war der Fehler: i3 wertet `for_window` nicht nur beim ERSCHEINEN eines
# Fensters aus, sondern erneut bei Fenster-Ereignissen. Die Regel konnte das
# Fenster also jederzeit wieder wegziehen — Sasha: "wenn ich modz drücke
# flackert das fenster aber schließt sich nicht", und die Anwesenheits-
# Anzeige behauptete, er arbeite woanders, waehrend er direkt draufschaute.
# Beides derselbe Grund: es hing im Scratchpad-Ast, obwohl es vor ihm stand.
#
# Uebrig bleibt das eine, was gefahrlos wiederholbar ist: schwebend.
#
# Groesse und Position stehen hier BEWUSST nicht mehr. `move position
# center` zentrierte auf den Koordinatenursprung statt auf den Bildschirm —
# Sashas Fenster stand danach auf x=-643, y=-390, also mit seiner Mitte in
# der linken oberen Ecke ("jetzt klebt es links oben in der ecke!"). Vorher
# fiel das nicht auf, weil das Scratchpad-Einblenden die Lage selbst setzte;
# die Zeile, die den Fehler verdeckte, war `move scratchpad`.
#
# Ausserdem laeuft eine for_window-Regel zu einem Zeitpunkt, an dem das
# Fenster noch keinen Bildschirm kennt. Platziert wird deshalb im Skript,
# nachdem es wirklich da ist.
for_window [window_role="zentrale"] floating enable

# ── Die Taste ─────────────────────────────────────────────────────────
# Ein Skript statt einer i3-Regel, weil eine Taste hier DREI Faelle
# abdecken muss: sichtbar -> weglegen, weggelegt -> holen, gar nicht da ->
# starten. `scratchpad show` kann das nicht — und hat eine zweite Tuecke:
# ist das Fenster auf einem ANDEREN Workspace sichtbar, holt der Befehl es
# herueber, statt es wegzulegen. Zweimal druecken schliesst dann nichts, es
# wandert nur. Der Zustand steht deshalb explizit in scripts/zentrale-fenster.
bindsym $mod+z exec --no-startup-id zentrale-fenster
