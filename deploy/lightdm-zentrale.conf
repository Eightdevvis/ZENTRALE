# /etc/lightdm/lightdm.conf.d/10-zentrale.conf
#
# Drop-in fuer lightdm. install_pi_services.sh kopiert diese Datei
# beim Deploy/autopull nach /etc/lightdm/lightdm.conf.d/.
#
# Was wir hier setzen:
#  - xserver-command=X -nocursor
#      Startet den X-Server OHNE Cursor. Wir haben keine Maus am
#      Pi-Kiosk, also brauchen wir auch keinen Pfeil. Wirkt frueher
#      als unclutter & co, weil X gar nicht erst einen Cursor lädt.
#
# Gilt fuer alle Seats (Default-Sektion [Seat:*]).
[Seat:*]
xserver-command=X -nocursor
