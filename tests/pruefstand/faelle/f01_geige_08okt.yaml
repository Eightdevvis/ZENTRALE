  Rekonstruiert aus den Antworten und Werkzeug-Ergebnissen des Gesprächs
  (die Ergebnisse sind dort auf 300 Zeichen gekürzt):
  - Zwei Geigenstunde-Regeln donnerstags, 17:45–18:30 und 18:00–19:00 — so
    nennt sie die KI im ersten Zug. GESCHÄTZT: welche den Ort „Geigenschule"
    trug (die KI schrieb später „@ Geigenschule", Sasha hat das nie gesagt,
    also stand es im Kalender) — hier die frühere.
  - Reise „nyam" 08.–09.10. als mehrtägiger Termin unter dem 08.10. (das
    Löschen am 08.10. traf ihn ganz). GESCHÄTZT: der Ort „unterwegs" — ohne
    Ort zählt ein Mehrtages-Termin nicht als Reise und der Konflikt mit Drive
    entstünde nicht, den die KI aber gemeldet hat.
  - Drive 09.10. 18:30–19:30, Fahrschule Di+Do 19–20 @ Fahrschule, Parkour
    Mi 18–19 und Fr 20–21, DJ wand school Mi 19–20, Vorlesungsbeginn 12.10.,
    Experimentalphysik Mo 12.10./Di 13.10. 08:30–10:00 @ C6.4 0.10, „mathe"
    Di 12–13, Praktikum Di 11:00 — aus dem letzten read_calendar. GESCHÄTZT:
    dass diese Uni-Termine schon vor dem Gespräch drinstanden (die KI hat sie
    nicht angelegt) und dass es Einzeltermine sind.
  - Die LSF-Seite der Vorlesung: Inhalt aus der Antwort der KI nachgebaut
    (Zeiten, sechs Übungsgruppen), nicht die echte Seite.
  - Gedächtnis: nur ein Satz Steckbrief; Sashas echtes Gedächtnis weiß mehr.

