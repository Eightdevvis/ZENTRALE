# openapi.yaml — die HTTP-Schnittstelle des Hubs (Kacheln, Katalog, Desk,
# Schaufenster, Werkstatt).
#
# OpenAPI 3.1 (Sasha 2026-10-10: Standards statt Eigenformat, „openapi als
# Vorbild"). Diese Datei ist die Autorität für die Routen unten; die Tabelle
# in memory/system/api_endpoints.md zeigt nur hierher. Schemas sind JSON
# Schema 2020-12 — derselbe Dialekt wie `parameter` im Katalog.
# tests/test_openapi.py hält Routen und Datei gleich (jede Route unter
# /api/kachel*, /api/kacheln, /api/desk*, /api/shop*, /api/werkstatt*,
# /api/tasten, /api/apps* steht hier und umgekehrt), prüft die Datei selbst und
# echte Antworten gegen ihre Schemas.
#
# Seit 2026-10-22 auch die Seite der APPS (Pfade unter /hub/, eigener
# `servers`-Eintrag = die `adresse` im app.toml): was eine Prozess-App dem Hub
# beantwortet — lebt sie, Ereignisse, Kacheln. Pfade, die eine App laut
# `routen` im app.toml besitzt (z. B. /api/map → App karte), reicht der Hub
# unverändert weiter; beschrieben stehen sie im Repo der App.
openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: ZENTRALE Hub
  version: "2026-10-10"
  description: >
    Der Hub, durch den jede Oberfläche (TUI, später Fenster und Handy) Kacheln
    anderer Apps holt, und die Desk-Ansicht (Flächen mit Zetteln, Bildern und
    Kacheln). Jedes Objekt hat eine Adresse `zentrale://<app>/<pfad>?<abfrage>`
    (eine gewöhnliche URI, RFC 3986; core/adressen.py). Doku:
    memory/hub/hub_bauplan.md, memory/hub/desk_view.md.
servers:
  - url: http://localhost:5000
    description: Backend auf diesem Rechner (Flask, ui/app.py)
tags:
  - name: kacheln
    description: Katalog, Inhalt einer Kachel, Aktionen (core/kacheln.py)
  - name: desk
    description: Desks laden und speichern (core/desk.py)
  - name: desk-bild
    description: Bilder auf dem Desk (core/desk_bild.py)
  - name: werkstatt
    description: Selbst gebaute Apps aus Vorlagen (core/werkstatt.py)
  - name: shop
    description: Schaufenster — Katalog, holen, Besitz (core/shop.py)
  - name: tasten
    description: Tastentabellen der Apps — welche Tasten in welcher Ansicht (core/tastentabelle.py)
  - name: apps
    description: >
      Installierte Apps, Start/Stopp, Weiterleitung (core/app_verwaltung.py,
      core/app_weiterleitung.py). Jede Anfrage auf einen Pfad, den eine App
      laut `routen` im app.toml besitzt, reicht der Hub unverändert an ihre
      `adresse` weiter (Methode, Pfad, Abfrage, Körper, Inhalts-Köpfe hin;
      Status, Inhalts-Köpfe, Körper zurück; nie Authorization/Cookie). App
      aus, nicht erreichbar oder länger als 30 s → 503 `{"fehler": "aus"}`.
  - name: wires
    description: >
      Wires of this node (building kit steps 9/9b, memory/hub/port_types.md):
      a projection of the stored truths; every change passes the one gate
      (compile → diff → switch, core/generations.py).
  - name: app-seite
    description: >
      Was eine Prozess-App selbst beantwortet (unter ihrer `adresse`, nur auf
      127.0.0.1). Der Hub fragt; eine Oberfläche nie direkt.

paths:
  /api/kacheln:
    get:
      tags: [kacheln]
      operationId: katalog
      summary: Was jede App als Kachel liefern kann
      description: >
        Nur Apps mit dem Recht `<app>:lesen`. `parameter` ist ein JSON Schema
        (2020-12): was man beim Anlegen angibt; Auswahl (welche Liste) und
        Vorgaben (heute) sind zur Fragezeit eingetragen. Die Reihenfolge der
        `properties` ist die Reihenfolge der Felder.
      responses:
        "200":
          description: Der Katalog
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/KatalogEintrag"}

  /api/kachel:
    post:
      tags: [kacheln]
      operationId: kachelHolen
      summary: Inhalt einer Kachel in w×h Zellen
      description: >
        Der Hub prüft die Abfrage der Adresse gegen `parameter` des Katalogs
        (Werte als Text werden nach `type` gelesen, wie Query-Parameter) und
        danach, was JSON Schema nicht sagen kann, bei der Quelle selbst (z. B.
        höchstens 31 Tage zwischen „von" und „bis"). `w = h = 0` fragt nur
        Prüfung und Größe (Antwort `zu_klein` mit `bevorzugt`).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/KachelAnfrage"}
      responses:
        "200":
          description: Inhalt, unverändert, oder zu klein
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KachelAntwort"}
        "400": {$ref: "#/components/responses/Ungueltig"}
        "403": {$ref: "#/components/responses/OhneRecht"}
        "404": {$ref: "#/components/responses/Weg"}
        "503": {$ref: "#/components/responses/Aus"}

  /api/kachel/aktion:
    post:
      tags: [kacheln]
      operationId: kachelAktion
      summary: Aktion einer Kachel weiterreichen
      description: >
        Heute nur `oeffnen`: die App sagt mit einer Adresse, WAS aufgehen soll;
        welche Ansicht das wird, entscheidet die Oberfläche.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AktionAnfrage"}
      responses:
        "200":
          description: Wohin
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AktionAntwort"}
        "400": {$ref: "#/components/responses/Ungueltig"}
        "403": {$ref: "#/components/responses/OhneRecht"}
        "404": {$ref: "#/components/responses/Weg"}
        "503": {$ref: "#/components/responses/Aus"}

  /api/desk:
    get:
      tags: [desk]
      operationId: deskListe
      summary: Alle Desks, zuletzt geändert zuerst
      responses:
        "200":
          description: Die Desks
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DeskListe"}
    post:
      tags: [desk]
      operationId: deskAnlegen
      summary: Leeren Desk anlegen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, examples: [Elektronik]}
      responses:
        "201":
          description: Der neue Desk
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Desk"}
        "400": {$ref: "#/components/responses/DeskFehler"}
        "409": {$ref: "#/components/responses/DeskFehler"}

  /api/desk/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: {type: string}
    get:
      tags: [desk]
      operationId: deskLaden
      summary: Einen Desk laden (in Zellen)
      responses:
        "200":
          description: Der Desk
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Desk"}
        "400": {$ref: "#/components/responses/DeskFehler"}
        "404": {$ref: "#/components/responses/DeskFehler"}
        "422": {$ref: "#/components/responses/DeskFehler"}
    put:
      tags: [desk]
      operationId: deskSpeichern
      summary: Den ganzen Desk schreiben
      description: >
        Fehlende Elemente sind gelöscht, ihre Schnüre auch. Hat sich die
        Datei seit dem Laden woanders geändert (`stand`), kommt 409 mit dem
        neuen Stand und es wird nichts geschrieben.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DeskSpeichern"}
      responses:
        "200":
          description: Der gespeicherte Desk
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Desk"}
        "400": {$ref: "#/components/responses/DeskFehler"}
        "404": {$ref: "#/components/responses/DeskFehler"}
        "409": {$ref: "#/components/responses/DeskFehler"}
        "422": {$ref: "#/components/responses/DeskFehler"}

    patch:
      tags: [desk]
      operationId: deskUmbenennen
      summary: Desk umbenennen (Verwaltung in der Werkstatt)
      description: >
        Benennt die Datei um; selbst gebaute Apps, die auf den Desk zeigen
        (`desk` in ihrer app.toml), ziehen mit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
      responses:
        "200":
          description: Der neue Name
          content:
            application/json:
              schema:
                type: object
                required: [name]
                properties:
                  name: {type: string}
        "400": {$ref: "#/components/responses/DeskFehler"}
        "404": {$ref: "#/components/responses/DeskFehler"}
        "409": {$ref: "#/components/responses/DeskFehler"}
    delete:
      tags: [desk]
      operationId: deskLoeschen
      summary: Desk löschen — nicht, solange eine App auf ihm steht (409)
      responses:
        "200": {$ref: "#/components/responses/Ok"}
        "404": {$ref: "#/components/responses/DeskFehler"}
        "409": {$ref: "#/components/responses/DeskFehler"}

  /api/desk-bild/quellen:
    get:
      tags: [desk-bild]
      operationId: bildQuellen
      summary: Bilder in ~/Zentrale/Input, neueste zuerst
      responses:
        "200":
          description: Die Bilder
          content:
            application/json:
              schema:
                type: object
                required: [quellen]
                properties:
                  quellen:
                    type: array
                    items:
                      type: object
                      required: [name, pfad]
                      properties:
                        name: {type: string, description: relativ zu Input/}
                        pfad: {type: string}

  /api/desk-bild:
    post:
      tags: [desk-bild]
      operationId: bildUebernehmen
      summary: Ein Bild in den Desk-Ordner kopieren
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quelle]
              properties:
                quelle: {type: string, description: Name in Input/ oder ein Pfad}
      responses:
        "201":
          description: Übernommen
          content:
            application/json:
              schema:
                type: object
                required: [datei, titel, w, h]
                properties:
                  datei: {type: string, description: relativ zum Desk-Ordner}
                  titel: {type: string}
                  w: {type: integer, description: Vorschlag in Zellen}
                  h: {type: integer}
        "400": {$ref: "#/components/responses/DeskFehler"}
        "404": {$ref: "#/components/responses/DeskFehler"}
        "422": {$ref: "#/components/responses/DeskFehler"}
        "503": {$ref: "#/components/responses/DeskFehler"}

  /api/desk-bild/vorschau:
    post:
      tags: [desk-bild]
      operationId: bildVorschau
      summary: Ein Bild als Zeichen (ASCII-Filter, core/bild_vorschau.py)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [datei, w, h]
              properties:
                datei: {type: string}
                w: {type: integer}
                h: {type: integer}
                modus: {type: string, enum: [mono, farbe], default: mono}
                invert: {type: boolean, default: false}
      responses:
        "200":
          description: Vorschau oder ein leiser Grund
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BildVorschau"}
        "400": {$ref: "#/components/responses/DeskFehler"}

  /api/desk-bild/oeffnen:
    post:
      tags: [desk-bild]
      operationId: bildOeffnen
      summary: Was die Oberfläche zum Öffnen braucht
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [datei]
              properties:
                datei: {type: string}
      responses:
        "200":
          description: Pfad, ob es ihn gibt, eingestellter Betrachter
          content:
            application/json:
              schema:
                type: object
                required: [pfad, da, betrachter]
                properties:
                  pfad: {type: string}
                  da: {type: boolean}
                  betrachter: {type: string}
        "400": {$ref: "#/components/responses/DeskFehler"}

  /api/desk-bild/datei:
    get:
      tags: [desk-bild]
      operationId: bildDatei
      summary: Das Bild selbst (für eine Oberfläche auf einem anderen Rechner)
      parameters:
        - name: datei
          in: query
          required: true
          schema: {type: string, examples: [bilder/x.png]}
      responses:
        "200":
          description: Die Bilddatei
          content:
            image/*:
              schema: {type: string, contentMediaType: "image/*"}
        "400": {$ref: "#/components/responses/DeskFehler"}
        "404": {$ref: "#/components/responses/DeskFehler"}

  /api/shop:
    get:
      tags: [shop]
      operationId: shopKatalog
      summary: Der Katalog des Schaufensters (schema.org ItemList, JSON-LD)
      description: >
        Alle Stücke, auf Wunsch nur eine Kategorie und/oder ein Thema
        (`keywords`). Heute kostet alles 0 EUR; bezahlen kommt später über
        Sashas Server (memory/hub/shop.md).
      parameters:
        - {name: kategorie, in: query, required: false, schema: {$ref: "#/components/schemas/ShopKategorie"}}
        - {name: thema, in: query, required: false, schema: {type: string}, example: pixel}
      responses:
        "200":
          description: Der (gefilterte) Katalog
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/ShopKatalog"}
        "400": {$ref: "#/components/responses/ShopFehler"}
        "503": {$ref: "#/components/responses/ShopFehler"}

  /api/shop/kategorien:
    get:
      tags: [shop]
      operationId: shopKategorien
      summary: Kategorien (auch leere) und Themen, je mit Anzahl
      responses:
        "200":
          description: Die Leiste der Oberfläche
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ShopUebersicht"}
        "503": {$ref: "#/components/responses/ShopFehler"}

  /api/shop/{kategorie}/{kennung}:
    parameters:
      - {name: kategorie, in: path, required: true, schema: {$ref: "#/components/schemas/ShopKategorie"}}
      - {name: kennung, in: path, required: true, schema: {type: string}}
    get:
      tags: [shop]
      operationId: shopStueck
      summary: Ein Stück (Adresse zentrale://shop/<kategorie>/<kennung>)
      responses:
        "200":
          description: Das Stück mit `@context`
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/ShopStueck"}
        "400": {$ref: "#/components/responses/ShopFehler"}
        "404": {$ref: "#/components/responses/ShopFehler"}

  /api/shop/holen:
    post:
      tags: [shop]
      operationId: shopHolen
      summary: Ein Stück holen (heute kostenlos, idempotent)
      description: >
        Schon Geholtes bleibt mit seinem ersten Datum (`neu: false`). Ein
        Stück mit Preis über 0 lehnt der Hub heute mit 402 ab.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ShopHolenAnfrage"}
      responses:
        "200":
          description: Geholt
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ShopHolenAntwort"}
        "400": {$ref: "#/components/responses/ShopFehler"}
        "402": {$ref: "#/components/responses/ShopFehler"}
        "404": {$ref: "#/components/responses/ShopFehler"}

  /api/shop/besitz:
    get:
      tags: [shop]
      operationId: shopBesitz
      summary: Was geholt ist (ItemList von OwnershipInfo), auf Wunsch je Kategorie
      description: >
        Vereinigung aller Rechner. `typeOfGood` ist das Stück aus dem Katalog;
        kennt der Katalog es nicht mehr, nur `@id`, `category`, `identifier`.
        Die Werkstatt liest hier die geholten Icons (`?kategorie=icons`).
      parameters:
        - {name: kategorie, in: query, required: false, schema: {$ref: "#/components/schemas/ShopKategorie"}}
      responses:
        "200":
          description: Der Besitz
          content:
            application/ld+json:
              schema: {$ref: "#/components/schemas/ShopBesitz"}
        "400": {$ref: "#/components/responses/ShopFehler"}
        "503": {$ref: "#/components/responses/ShopFehler"}

  /api/werkstatt/apps:
    get:
      tags: [werkstatt]
      operationId: werkstattApps
      summary: Selbst gebaute Apps (Reihenfolge = im App-Rad)
      responses:
        "200":
          description: Die Apps
          content:
            application/json:
              schema:
                type: object
                required: [apps]
                properties:
                  apps:
                    type: array
                    items: {$ref: "#/components/schemas/EigeneApp"}
    post:
      tags: [werkstatt]
      operationId: werkstattAnlegen
      summary: Neue App aus einer Vorlage bauen
      description: >
        Legt <apps_ordner>/<slug>/app.toml an (+ icon.png aus einem Bild in
        ~/Zentrale/Input) und bei der Vorlage `desk` einen Desk gleichen
        Namens (ein vorhandener wird übernommen).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, icon]
              properties:
                name: {type: string, examples: [Geige]}
                icon: {$ref: "#/components/schemas/IconWahl"}
                vorlage: {type: string, enum: [desk], default: desk}
      responses:
        "201":
          description: Die neue App
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EigeneApp"}
        "400": {$ref: "#/components/responses/WerkstattFehler"}
        "404": {$ref: "#/components/responses/WerkstattFehler"}
        "409": {$ref: "#/components/responses/WerkstattFehler"}

  /api/werkstatt/apps/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: {type: string, pattern: "^[a-z][a-z0-9-]{0,15}$"}
    patch:
      tags: [werkstatt]
      operationId: werkstattAendern
      summary: Name und/oder Symbol ändern (der Kurzname bleibt)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                icon: {$ref: "#/components/schemas/IconWahl"}
      responses:
        "200":
          description: Die geänderte App
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EigeneApp"}
        "400": {$ref: "#/components/responses/WerkstattFehler"}
        "404": {$ref: "#/components/responses/WerkstattFehler"}
        "409": {$ref: "#/components/responses/WerkstattFehler"}
    delete:
      tags: [werkstatt]
      operationId: werkstattLoeschen
      summary: App löschen, mit `?desk=1` auch ihren Desk
      parameters:
        - name: desk
          in: query
          required: false
          schema: {type: string, enum: ["0", "1"]}
      responses:
        "200": {$ref: "#/components/responses/Ok"}
        "404": {$ref: "#/components/responses/WerkstattFehler"}

  /api/werkstatt/name:
    post:
      tags: [werkstatt]
      operationId: werkstattName
      summary: Taugt der Name für eine neue App? (frei, nicht reserviert)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
                ausser: {type: string, description: Kurzname der App, die umbenannt wird}
      responses:
        "200":
          description: Name taugt; so heißt der Kurzname
          content:
            application/json:
              schema:
                type: object
                required: [name, slug]
                properties:
                  name: {type: string}
                  slug: {type: string}
        "400": {$ref: "#/components/responses/WerkstattFehler"}
        "409": {$ref: "#/components/responses/WerkstattFehler"}

  /api/werkstatt/vorlagen:
    get:
      tags: [werkstatt]
      operationId: werkstattVorlagen
      summary: Vorlagen, aus denen der Schmied baut
      responses:
        "200":
          description: Die Vorlagen
          content:
            application/json:
              schema:
                type: object
                required: [vorlagen]
                properties:
                  vorlagen:
                    type: array
                    items:
                      type: object
                      required: [id, titel, text]
                      properties:
                        id: {type: string}
                        titel: {type: string}
                        text: {type: string}

  /api/werkstatt/bilder:
    get:
      tags: [werkstatt]
      operationId: werkstattBilder
      summary: Bilder in ~/Zentrale/Input, die ein Symbol werden können
      responses:
        "200":
          description: Die Bilder
          content:
            application/json:
              schema:
                type: object
                required: [bilder]
                properties:
                  bilder:
                    type: array
                    items:
                      type: object
                      required: [name, pfad]
                      properties:
                        name: {type: string, description: relativ zu Input/}
                        pfad: {type: string}

  /api/tasten:
    get:
      tags: [tasten]
      operationId: tastentabellen
      summary: Welche Tasten jede App in welcher Ansicht nimmt
      description: >
        Aus `[tasten]` im app.toml jeder installierten App. Eine Oberfläche
        fragt das einmal beim Verkabeln und zeigt in ihrer Leiste nur die
        Einträge der gerade offenen Ansicht. Apps ohne (gültige) Tabelle
        fehlen — die hört die Oberfläche selbst ab. Die eingebauten
        TUI-Programme tragen dasselbe Format im Code.
      responses:
        "200":
          description: Die Tabellen
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [app, tasten]
                  properties:
                    app: {type: string}
                    tasten: {$ref: "#/components/schemas/Tastentabelle"}
                  additionalProperties: false

  /api/apps:
    get:
      tags: [apps]
      operationId: appsListe
      summary: Installierte Apps aus ihren Manifesten
      description: >
        Prozess-Apps (eigener Server, `start` + `adresse`) und selbst gebaute
        Vorlage-Apps (Werkstatt). Ob eine Prozess-App läuft, fragt der Hub
        parallel und kurz über `GET <adresse>/hub/gesund`.
      responses:
        "200":
          description: Die Apps
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/App"}

  /api/apps/laden:
    post:
      tags: [apps]
      operationId: appLaden
      summary: App aus dem Schaufenster herunterladen und ihre Ansichten zeigen
      description: >
        Das Stück (Kategorie apps) nennt in `downloadUrl` ein git-Repo; der Hub
        holt es in ein Zwischenlager (oder übernimmt einen Checkout desselben
        Repos, der schon an seinem Platz liegt) und liest das app.toml.
        Eingerichtet wird noch nichts — erst `POST /api/apps/installieren`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adresse]
              properties:
                adresse: {$ref: "#/components/schemas/Adresse"}
      responses:
        "200":
          description: Die Ansichten zur Wahl
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AppWahl"}
        "400": {$ref: "#/components/responses/InstallFehler"}
        "402": {$ref: "#/components/responses/InstallFehler"}
        "404": {$ref: "#/components/responses/InstallFehler"}
        "409": {$ref: "#/components/responses/InstallFehler"}
        "422": {$ref: "#/components/responses/InstallFehler"}
        "502": {$ref: "#/components/responses/InstallFehler"}
        "503": {$ref: "#/components/responses/InstallFehler"}
        "504": {$ref: "#/components/responses/InstallFehler"}

  /api/apps/installieren:
    post:
      tags: [apps]
      operationId: appInstallieren
      summary: App mit den gewählten Ansichten einrichten
      description: >
        Mindestens eine Ansicht aus dem app.toml. Lädt vorher, falls nötig.
        Nochmal aufrufen ändert nur die Auswahl. Das Stück gilt danach auch
        als geholt (Besitz).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adresse]
              properties:
                adresse: {$ref: "#/components/schemas/Adresse"}
                ansichten: {type: array, minItems: 1, items: {type: string}, examples: [[browser, terminal]],
                            description: "required except for a built-in app (step 10)"}
      responses:
        "200":
          description: Eingerichtet
          content:
            application/json:
              schema:
                type: object
                required: [name, titel, ansichten, ordner, adresse, neu]
                additionalProperties: false
                properties:
                  name: {type: string}
                  titel: {type: string}
                  ansichten: {type: array, items: {type: string}}
                  ordner: {type: string, description: wo die App auf diesem Rechner liegt}
                  adresse: {$ref: "#/components/schemas/Adresse"}
                  neu: {type: boolean, description: vorher nicht installiert}
                  built_in: {type: boolean, description: "switched on, nothing downloaded (step 10)"}
        "400": {$ref: "#/components/responses/InstallFehler"}
        "402": {$ref: "#/components/responses/InstallFehler"}
        "404": {$ref: "#/components/responses/InstallFehler"}
        "409": {$ref: "#/components/responses/InstallFehler"}
        "422": {$ref: "#/components/responses/InstallFehler"}
        "502": {$ref: "#/components/responses/InstallFehler"}
        "503": {$ref: "#/components/responses/InstallFehler"}
        "504": {$ref: "#/components/responses/InstallFehler"}

  /api/wires:
    get:
      tags: [wires]
      operationId: wiresList
      summary: Pieces and wires of this node (a projection, no store of its own)
      description: >
        Sync wires come from the setting `abgleich_apps` of this node,
        calendar-source wires from `quelle` of each calendar instance. Full
        item schemas: contracts/ports/1/ports.schema.json.
      responses:
        "200":
          description: The projection
          content:
            application/json:
              schema:
                type: object
                required: [node, pieces, wires]
                properties:
                  node: {type: string}
                  pieces: {type: array, items: {$ref: "#/components/schemas/Piece"}}
                  wires: {type: array, items: {$ref: "#/components/schemas/Wire"}}

  /api/wires/{wid}:
    parameters:
      - {name: wid, in: path, required: true, schema: {type: string}, description: "wire id, may contain '/' (sync/minipc/tutor)"}
      - {name: plan, in: query, required: false, schema: {type: string, enum: ["1", "true", "yes"]}, description: only plan (diff), do not switch}
    put:
      tags: [wires]
      operationId: wirePut
      summary: Plug or re-plug one wire — through the gate (compile → diff → switch)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Wire"}
      responses:
        "200": {$ref: "#/components/responses/RunResult"}
        "400": {$ref: "#/components/responses/RunResult"}
        "409": {$ref: "#/components/responses/RunResult"}
    delete:
      tags: [wires]
      operationId: wireDelete
      summary: Unplug one wire (state off) — through the gate
      responses:
        "200": {$ref: "#/components/responses/RunResult"}
        "404": {$ref: "#/components/responses/RunResult"}
        "409": {$ref: "#/components/responses/RunResult"}

  /api/apps/remove:
    post:
      tags: [apps]
      operationId: appRemove
      summary: Remove an app from this node (building kit step 10)
      description: >
        Ownership and data stay, here and in the cloud. Today only built-in
        apps (`cloud`, `cloud_folder`); a downloaded app → 501.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adresse]
              properties:
                adresse: {$ref: "#/components/schemas/Adresse"}
      responses:
        "200":
          description: Off on this node
          content:
            application/json:
              schema:
                type: object
                required: [adresse, name, installiert, war]
                additionalProperties: false
                properties:
                  adresse: {$ref: "#/components/schemas/Adresse"}
                  name: {type: string}
                  installiert: {type: boolean, const: false}
                  war: {type: boolean, description: was installed before}
        "400": {$ref: "#/components/responses/InstallFehler"}
        "404": {$ref: "#/components/responses/InstallFehler"}
        "501": {$ref: "#/components/responses/InstallFehler"}

  /api/apps/installed:
    get:
      tags: [apps]
      operationId: appsInstalled
      summary: Shop addresses of the apps installed on this node (built-in and downloaded)
      responses:
        "200":
          description: Addresses
          content:
            application/json:
              schema:
                type: object
                required: [adressen, held]
                additionalProperties: false
                properties:
                  adressen: {type: array, items: {$ref: "#/components/schemas/Adresse"}}
                  held:
                    type: object
                    description: "address → hold of an extracted app (step 12): {version, commit, since}"
                    additionalProperties:
                      type: object
                      properties:
                        version: {type: string}
                        commit: {type: string}
                        since: {type: string}

  /api/apps/hold:
    post:
      tags: [apps]
      operationId: appHold
      summary: Hold an extracted app at its version on this node (building kit step 12)
      description: >
        `zentrale update --automatic` skips a held app until it is released
        (`hold: false`). Built-in apps update with the core → 400; not
        installed here → 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adresse, hold]
              properties:
                adresse: {$ref: "#/components/schemas/Adresse"}
                hold: {type: boolean}
      responses:
        "200":
          description: Held or released
          content:
            application/json:
              schema:
                type: object
                required: [adresse, name, held, version]
                additionalProperties: false
                properties:
                  adresse: {$ref: "#/components/schemas/Adresse"}
                  name: {type: string}
                  held: {type: boolean}
                  version: {type: string, description: the app.toml version it is held at}
        "400": {$ref: "#/components/responses/InstallFehler"}
        "404": {$ref: "#/components/responses/InstallFehler"}
        "409": {$ref: "#/components/responses/InstallFehler"}

  /api/apps/{name}/plugs:
    parameters:
      - {name: name, in: path, required: true, schema: {type: string, pattern: "^[a-z0-9][a-z0-9_-]*$"}}
    get:
      tags: [apps]
      operationId: appPlugs
      summary: The plug dialog — the sockets an app needs and the providers on this node
      description: >
        Building kit step 11 (core/plugs.py). Old rights words (legacy) are
        not asked; the `data` → `sync` socket is asked by the new-app question
        of the sync choice.
      responses:
        "200":
          description: The sockets to ask
          content:
            application/json:
              schema:
                type: object
                required: [name, sockets]
                properties:
                  name: {type: string}
                  sockets:
                    type: array
                    items:
                      type: object
                      required: [need, type, range, min, max, scope, title, providers, wire]
                      properties:
                        need: {type: string, description: the socket id}
                        type: {type: string, examples: [model]}
                        range: {type: string, examples: ["^1"]}
                        min: {type: integer, description: "≥ 1 = required: the install only counts when it is plugged in"}
                        max: {type: [integer, string]}
                        scope: {enum: [node, instance, link]}
                        title: {type: string}
                        providers:
                          type: array
                          items:
                            type: object
                            required: [port, piece, title]
                            properties:
                              port: {type: string, examples: ["zentrale://adapter/port/model"]}
                              piece: {type: string, examples: ["app:adapter"]}
                              title: {type: string}
                        wire: {oneOf: [{$ref: "#/components/schemas/Wire"}, {type: "null"}]}
        "404": {$ref: "#/components/responses/InstallFehler"}
    post:
      tags: [apps]
      operationId: appPlugsConfirm
      summary: Plug in what the person chose — one run through the gate
      description: >
        `choices` maps a socket to a provider port, or null = refused (the
        wire stays `off`). Sockets not named keep what they have. A required
        socket (min ≥ 1) still unplugged afterwards withdraws a store app from
        this node's register (`withdrawn`, its folder stays). Errors carry
        `need`, the socket they are pinned to.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [choices]
              properties:
                choices:
                  type: object
                  additionalProperties: {type: [string, "null"]}
                  examples: [{model: "zentrale://adapter/port/model"}]
      responses:
        "200": {$ref: "#/components/responses/PlugResult"}
        "400": {$ref: "#/components/responses/InstallFehler"}
        "404": {$ref: "#/components/responses/InstallFehler"}
        "409": {$ref: "#/components/responses/PlugResult"}

  /api/apps/{name}/start:
    parameters:
      - {name: name, in: path, required: true, schema: {type: string, pattern: "^[a-z0-9][a-z0-9_-]*$"}}
    post:
      tags: [apps]
      operationId: appStarten
      summary: Prozess-App starten
      description: >
        Läuft sie schon (egal, wer sie gestartet hat), passiert nichts
        (`gestartet: false`). Sonst startet der Hub `start` aus dem app.toml
        im Ordner der App und wartet bis zu 15 s auf `/hub/gesund`.
      responses:
        "200":
          description: "Läuft (oder fährt noch hoch, `laeuft: false`)"
          content:
            application/json:
              schema:
                type: object
                required: [name, laeuft, gestartet]
                additionalProperties: false
                properties:
                  name: {type: string}
                  laeuft: {type: boolean}
                  gestartet: {type: boolean, description: von diesem Aufruf gestartet}
        "400": {$ref: "#/components/responses/AppFehler"}
        "404": {$ref: "#/components/responses/AppFehler"}
        "503": {$ref: "#/components/responses/AppFehler"}

  /api/apps/{name}/stop:
    parameters:
      - {name: name, in: path, required: true, schema: {type: string, pattern: "^[a-z0-9][a-z0-9_-]*$"}}
    post:
      tags: [apps]
      operationId: appStoppen
      summary: Prozess-App stoppen — nur, was der Hub selbst gestartet hat
      description: >
        Eine App, die jemand anderes gestartet hat (systemd, Terminal, das
        Zimmer des Tutors), lässt der Hub in Ruhe → 409 `fremd`.
      responses:
        "200":
          description: Gestoppt
          content:
            application/json:
              schema:
                type: object
                required: [name, gestoppt]
                additionalProperties: false
                properties:
                  name: {type: string}
                  gestoppt: {const: true}
        "404": {$ref: "#/components/responses/AppFehler"}
        "409": {$ref: "#/components/responses/AppFehler"}

  /hub/gesund:
    servers: [{url: "http://127.0.0.1:{port}", description: "die App (adresse im app.toml)",
               variables: {port: {default: "5070"}}}]
    get:
      tags: [app-seite]
      operationId: appGesund
      summary: Lebt die App?
      description: Jede Prozess-App hat diese Route. Der Hub fragt sie für `laeuft` und beim Start.
      responses:
        "200":
          description: Ja
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: {const: true}
                  name: {type: string}

  /hub/ereignis:
    servers: [{url: "http://127.0.0.1:{port}", description: "die App (adresse im app.toml)",
               variables: {port: {default: "5070"}}}]
    post:
      tags: [app-seite]
      operationId: appEreignis
      summary: Ein abonniertes Ereignis (Recht `ereignis:<name>`)
      description: >
        Ziel aus `[ereignisse] ziel` im app.toml (Standard /hub/ereignis). Der
        Hub schickt im Hintergrund und vergisst Fehler (core/hub_ereignisse.py).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, daten]
              properties:
                name: {type: string, examples: [anwesenheit]}
                daten: {type: object}
      responses:
        "200": {description: Angekommen}

  /hub/kachel:
    servers: [{url: "http://127.0.0.1:{port}", description: "die App (adresse im app.toml)",
               variables: {port: {default: "5070"}}}]
    post:
      tags: [app-seite]
      operationId: appKachel
      summary: Inhalt einer Kachel (die App ist Quelle, `liefert = ["kachel:<art>"]`)
      description: >
        Der Hub hat Adresse und Werte schon gegen `[kachel.<art>] parameter`
        geprüft und getypt (`ref`). Die App kürzt selbst auf w×h. Antwortet sie
        nicht in 0,5 s, heißt die Kachel „aus" (core/kachel_http.py). Den
        Katalog-Eintrag (titel, min, bevorzugt, max, ttl, parameter) und welche
        optionalen Fragen sie beantwortet (`kann`: aktion, parameter_jetzt,
        pruefen, bevorzugt) sagt die App in `[kachel.<art>]` im app.toml.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AppKachelFrage"}
      responses:
        "200":
          description: Inhalt oder zu klein
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [zeilen, text]
                    properties:
                      zeilen: {type: array, items: {$ref: "#/components/schemas/Zeile"}}
                      text: {type: string}
                      oben: {type: integer, minimum: 0}
                      oben_max: {type: integer, minimum: 0}
                  - type: object
                    required: [zu_klein]
                    properties:
                      zu_klein: {$ref: "#/components/schemas/Groesse"}
        "400": {$ref: "#/components/responses/Ungueltig"}
        "404": {$ref: "#/components/responses/Weg"}

  /hub/kachel/aktion:
    servers: [{url: "http://127.0.0.1:{port}", description: "die App (adresse im app.toml)",
               variables: {port: {default: "5070"}}}]
    post:
      tags: [app-seite]
      operationId: appKachelAktion
      summary: Aktion einer Kachel (`kann` enthält aktion)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [art, ref, aktion]
              properties:
                art: {type: string}
                ref: {type: object}
                aktion: {type: string, enum: [oeffnen]}
      responses:
        "200":
          description: Wohin
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AktionAntwort"}
        "400": {$ref: "#/components/responses/Ungueltig"}
        "404": {$ref: "#/components/responses/Weg"}

  /hub/kachel/parameter:
    servers: [{url: "http://127.0.0.1:{port}", description: "die App (adresse im app.toml)",
               variables: {port: {default: "5070"}}}]
    post:
      tags: [app-seite]
      operationId: appKachelParameter
      summary: Schema mit der Auswahl von jetzt (`kann` enthält parameter_jetzt)
      description: null = es gibt nichts zu wählen, der Katalog-Eintrag fehlt dann.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [art, schema]
              properties:
                art: {type: string}
                schema: {type: object}
      responses:
        "200":
          description: Das Schema
          content:
            application/json:
              schema:
                type: object
                required: [schema]
                properties:
                  schema: {type: [object, "null"]}

  /hub/kachel/pruefen:
    servers: [{url: "http://127.0.0.1:{port}", description: "die App (adresse im app.toml)",
               variables: {port: {default: "5070"}}}]
    post:
      tags: [app-seite]
      operationId: appKachelPruefen
      summary: Was JSON Schema nicht sagen kann (`kann` enthält pruefen)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [art, ref]
              properties:
                art: {type: string}
                ref: {type: object}
      responses:
        "200": {description: In Ordnung}
        "400": {$ref: "#/components/responses/Ungueltig"}

  /hub/kachel/bevorzugt:
    servers: [{url: "http://127.0.0.1:{port}", description: "die App (adresse im app.toml)",
               variables: {port: {default: "5070"}}}]
    post:
      tags: [app-seite]
      operationId: appKachelBevorzugt
      summary: Bevorzugte Größe für genau diesen Bezug (`kann` enthält bevorzugt)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [art, ref]
              properties:
                art: {type: string}
                ref: {type: object}
      responses:
        "200":
          description: Größe in Zellen
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Groesse"}

components:
  responses:
    Ungueltig:
      description: Anfrage taugt nicht (Text in Alltagswörtern, z. B. „höchstens 31 tage")
      content:
        application/json:
          schema: {$ref: "#/components/schemas/KachelFehler"}
    OhneRecht:
      description: "`<app>:lesen` fehlt"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/KachelFehler"}
    Weg:
      description: Das Objekt gibt es nicht mehr
      content:
        application/json:
          schema: {$ref: "#/components/schemas/KachelFehler"}
    Aus:
      description: App nicht da, kaputt oder zu langsam (auch wenn der Prüfer fehlt)
      content:
        application/json:
          schema: {$ref: "#/components/schemas/KachelFehler"}
    DeskFehler:
      description: Fehler des Desks (409 trägt den neuen Stand)
      content:
        application/json:
          schema: {$ref: "#/components/schemas/DeskFehler"}
    ShopFehler:
      description: Fehler des Schaufensters (Text in Alltagswörtern)
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ShopFehler"}

    WerkstattFehler:
      description: Fehler der Werkstatt (Name vergeben, Bild fehlt …)
      content:
        application/json:
          schema: {$ref: "#/components/schemas/DeskFehler"}
    AppFehler:
      description: >
        App unbekannt (404 `unbekannt`), keine Prozess-App (400 `kein_prozess`),
        startet nicht (503 `aus`), nicht vom Hub gestartet (409 `fremd`)
      content:
        application/json:
          schema:
            type: object
            required: [fehler, text]
            additionalProperties: false
            properties:
              fehler: {type: string, enum: [unbekannt, kein_prozess, aus, fremd]}
              text: {type: string}
    InstallFehler:
      description: >
        Installieren ging nicht: keine App oder keine Ansicht gewählt (400),
        kostet etwas (402), gibt es nicht (404), Name/Ordner schon vergeben
        (409), app.toml fehlt/passt nicht (422), herunterladen ging nicht
        (502), git fehlt (503), Netz zu langsam (504)
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: {type: string}
    Ok:
      description: Erledigt
      content:
        application/json:
          schema:
            type: object
            required: [ok]
            properties:
              ok: {const: true}
    RunResult:
      description: >
        The result of Run (core/generations.run). Refused (400/404/409) →
        nothing was written, `errors` pinned to pieces/wires. A failed health
        check after the switch rolls back (`rolled_back`, `problems`).
      content:
        application/json:
          schema:
            type: object
            required: [ok, errors]
            properties:
              ok: {type: boolean}
              diff: {type: array, items: {type: string}, description: "plan lines: + new, - gone, ~ changed"}
              errors: {type: array, items: {$ref: "#/components/schemas/CompileError"}}
              generation: {type: [string, "null"]}
              rolled_back: {type: boolean}
              problems: {type: array, items: {type: string}}
    PlugResult:
      description: >
        The result of the plug dialog (core/plugs.confirm): a Run result plus
        the required sockets still unplugged and whether the install was
        withdrawn because of them.
      content:
        application/json:
          schema:
            type: object
            required: [ok, errors, unmet, withdrawn]
            properties:
              ok: {type: boolean}
              diff: {type: array, items: {type: string}}
              errors: {type: array, items: {$ref: "#/components/schemas/CompileError"}}
              generation: {type: [string, "null"]}
              previous: {type: [string, "null"]}
              rolled_back: {type: boolean}
              problems: {type: array, items: {type: string}}
              unmet: {type: array, items: {type: string}, description: required sockets without a live wire}
              withdrawn: {type: boolean}

  schemas:
    Wire:
      type: object
      description: One wire (contracts/ports/1/ports.schema.json $defs/wire is the full schema).
      required: [id, from, to, type, owner, state]
      properties:
        id: {type: string}
        from: {type: string, examples: ["zentrale://cloud/port/sync"]}
        to: {type: string, examples: ["zentrale://tutor/port/data"]}
        type: {type: string, examples: [sync]}
        owner: {type: string, examples: ["node:minipc"]}
        state: {enum: [live, off, broken, planned]}
        seen: {type: string}
    Piece:
      type: object
      description: One piece (contracts/ports/1/ports.schema.json $defs/piece is the full schema).
      required: [id, ref, kind]
      properties:
        id: {type: string}
        ref: {type: string}
        kind: {enum: [node, app, device]}
    CompileError:
      type: object
      required: [code, text]
      properties:
        code: {type: string, examples: [unmet-requirement, double-owner, cycle]}
        text: {type: string, description: for people, in the UI language}
        piece: {type: string}
        wire: {type: string}
        port: {type: string}
        need: {type: string, description: "plug dialog: the socket of the app the error is pinned to"}
    App:
      type: object
      required: [name, titel, version, art, adresse, laeuft, gestartet_vom_hub, autostart,
                 ansichten, rechte, liefert, routen, daten, quelle, ansichten_installiert, icon]
      additionalProperties: false
      properties:
        name: {type: string, description: Name (Prozess-App) bzw. Kurzname (selbst gebaut)}
        titel: {type: string}
        version: {type: string}
        art: {type: string, enum: [prozess, vorlage]}
        adresse: {type: [string, "null"], description: "http://127.0.0.1:<port> der App; null bei Vorlage-Apps"}
        laeuft: {type: [boolean, "null"], description: antwortet auf /hub/gesund; null bei Vorlage-Apps}
        gestartet_vom_hub: {type: boolean, description: nur dann stoppt der Hub sie}
        autostart: {type: boolean, description: startet mit dem Backend (Einstellung apps_autostart)}
        ansichten: {type: array, items: {type: string}, description: was die App anbietet (app.toml), examples: [[terminal, fenster]]}
        quelle:
          type: [string, "null"]
          description: Adresse des Stücks im Schaufenster, wenn die App von dort installiert ist; sonst null
          examples: ["zentrale://shop/apps/budget"]
        ansichten_installiert:
          type: array
          description: >
            Was auf diesem Rechner eingerichtet ist: bei Apps aus dem Laden die
            beim Installieren gewählten, sonst alle. browser mit `url`
            (adresse + `[ansicht.browser] pfad`), die anderen mit `start` (hat
            das app.toml einen Start-Befehl für diese Ansicht).
          items:
            type: object
            required: [id, titel]
            additionalProperties: false
            properties:
              id: {type: string, examples: [browser]}
              titel: {type: string, examples: [im browser]}
              url: {type: string}
              start: {type: boolean}
        icon:
          description: Symbol fürs Rad (wie bei EigeneApp) oder null
          oneOf:
            - type: "null"
            - type: object
              required: [art, raster]
              properties:
                art: {const: bild}
                raster: {type: array, items: {type: array, items: {type: [string, "null"]}}}
            - type: object
              required: [art, motiv]
              properties:
                art: {const: motiv}
                motiv: {type: string}
        rechte: {type: array, items: {type: string}, examples: [["ereignis:anwesenheit"]]}
        liefert: {type: array, items: {type: string}, examples: [["kachel:liste"]]}
        routen:
          type: array
          items: {type: string}
          description: Pfad-Anfänge, die der Hub an die App weiterreicht
          examples: [["/api/map"]]
        daten:
          description: >
            `[daten]` aus dem app.toml: welche Dateien die App hat (Muster
            relativ zum ZENTRALE-Ordner) und ob sie abgeglichen werden dürfen.
            Abgeglichen wird ein Muster nur, wenn es auch auf der Positivliste
            des Hubs steht. null = die App hat keine Daten.
          oneOf:
            - type: "null"
            - type: object
              required: [muster, abgleichen]
              additionalProperties: false
              properties:
                muster: {type: array, items: {type: string}, examples: [["data/lists.json"]]}
                abgleichen: {type: boolean}

    AppWahl:
      type: object
      required: [adresse, name, titel, version, ansichten, gewaehlt, installiert, neu]
      additionalProperties: false
      properties:
        adresse: {$ref: "#/components/schemas/Adresse"}
        name: {type: string}
        titel: {type: string}
        version: {type: string}
        ansichten:
          type: array
          description: was das app.toml anbietet, in seiner Reihenfolge
          items:
            type: object
            required: [id, titel]
            additionalProperties: false
            properties:
              id: {type: string}
              titel: {type: string}
        gewaehlt: {type: array, items: {type: string}, description: Vorschlag — die bisherige Wahl, sonst alle}
        installiert: {type: boolean}
        neu: {type: boolean, description: gerade heruntergeladen (sonst lag sie schon da)}
        built_in: {type: boolean, description: "inside the core package (building kit step 10): no views to pick, nothing downloaded"}

    AppKachelFrage:
      type: object
      required: [art, ref, w, h, oben]
      properties:
        art: {type: string}
        ref: {type: object, description: Abfrage der Adresse, vom Hub geprüft und getypt}
        w: {type: integer, minimum: 0, maximum: 400}
        h: {type: integer, minimum: 0, maximum: 400}
        oben: {type: integer, minimum: 0}

    Adresse:
      type: string
      format: uri
      pattern: "^zentrale://[a-z0-9_-]+(/[^?#]*)?(\\?[^#]*)?$"
      description: >
        Die eine Adresse eines Objekts: `zentrale://<app>/<pfad>?<abfrage>`
        (URI nach RFC 3986, Schema `zentrale`, Autorität = App). Kanonisch:
        Namen der Abfrage sortiert, Wahr/Falsch als `true`/`false`. Bei einer
        Kachel ist der erste Pfad-Abschnitt die Art aus dem Katalog und die
        Abfrage hält ihre Parameter. Fragment reserviert (heute abgelehnt).
      examples:
        - zentrale://kalender/ausschnitt?modus=mitlaufend&tage=7
        - zentrale://kalender/2026-10-12

    Farbrolle:
      type: string
      description: >
        Was ein Stück BEDEUTET, nie welche Farbe (core/farbrollen.py); jede
        Oberfläche wählt die Farbe selbst.
      enum: [text, leise, kopf, betont, heute, spanne, mehr, warnung, erledigt, auswahl]

    Stueck:
      type: array
      prefixItems:
        - {type: string}
        - {$ref: "#/components/schemas/Farbrolle"}
      minItems: 2
      maxItems: 2
      description: "[text, rolle]"

    Zeile:
      type: array
      items: {$ref: "#/components/schemas/Stueck"}

    Groesse:
      type: object
      description: Abstrakte Zellen (Spalten × Zeilen), das Innere ohne Rahmen
      required: [w, h]
      properties:
        w: {type: integer, minimum: 0, maximum: 400}
        h: {type: integer, minimum: 0, maximum: 400}
      additionalProperties: false

    KatalogEintrag:
      type: object
      required: [app, art, titel, min, bevorzugt, max, ttl, parameter, aktionen, formen]
      additionalProperties: false
      properties:
        app: {type: string}
        art: {type: string}
        titel: {type: string}
        min: {$ref: "#/components/schemas/Groesse"}
        bevorzugt: {$ref: "#/components/schemas/Groesse"}
        max: {$ref: "#/components/schemas/Groesse"}
        ttl: {type: integer, minimum: 0, description: Sekunden, bis neu gefragt wird}
        parameter:
          type: object
          description: >
            Ein JSON Schema (2020-12, `type: object`): die Parameter dieser Art,
            die in die Abfrage der Adresse kommen. Benutzt werden properties
            (type, title, description, default, minimum/maximum,
            minLength/maxLength, format date, oneOf [{const, title}] oder
            enum), required, allOf mit if/then (Felder, die nur bei einem Wert
            gelten), additionalProperties false.
        aktionen:
          type: array
          items: {type: string, enum: [oeffnen]}
        formen:
          type: array
          items: {type: string, enum: [zeilen]}

    KachelAnfrage:
      type: object
      properties:
        adresse: {$ref: "#/components/schemas/Adresse"}
        w: {type: integer, minimum: 0, maximum: 400}
        h: {type: integer, minimum: 0, maximum: 400}
        groesse: {$ref: "#/components/schemas/Groesse"}
        oben: {type: integer, minimum: 0, maximum: 10000, default: 0, description: Blätter-Lage}
        stand: {type: string, description: "Stand der letzten Antwort → `unveraendert`"}
        form:
          type: string
          enum: [zeilen, roh]
          default: zeilen
          description: "`roh` ist reserviert (heute 400)"
        app: {type: string, deprecated: true, description: alte Form statt adresse}
        art: {type: string, deprecated: true}
        ref: {type: object, deprecated: true}
      examples:
        - {adresse: "zentrale://kalender/ausschnitt?modus=mitlaufend&tage=7", w: 90, h: 7}

    KachelInhalt:
      type: object
      required: [form, zeilen, text, stand, ttl, oben, oben_max]
      additionalProperties: false
      properties:
        form: {const: zeilen}
        zeilen:
          type: array
          items: {$ref: "#/components/schemas/Zeile"}
        text: {type: string, description: Klartext-Rückfall (z. B. für Obsidian)}
        stand: {type: string}
        ttl: {type: integer}
        oben: {type: integer, minimum: 0}
        oben_max: {type: integer, minimum: 0}
        bevorzugt: {$ref: "#/components/schemas/Groesse"}
        roh: {description: "Reserviert: Rohdaten für Fenster/Handy (noch nie gesendet)"}

    KachelUnveraendert:
      type: object
      required: [unveraendert, stand, ttl]
      additionalProperties: false
      properties:
        unveraendert: {const: true}
        stand: {type: string}
        ttl: {type: integer}

    KachelZuKlein:
      type: object
      required: [zu_klein, ttl]
      additionalProperties: false
      properties:
        zu_klein: {$ref: "#/components/schemas/Groesse"}
        ttl: {type: integer}
        bevorzugt: {$ref: "#/components/schemas/Groesse"}

    KachelAntwort:
      oneOf:
        - {$ref: "#/components/schemas/KachelInhalt"}
        - {$ref: "#/components/schemas/KachelUnveraendert"}
        - {$ref: "#/components/schemas/KachelZuKlein"}

    KachelFehler:
      type: object
      required: [fehler]
      additionalProperties: false
      properties:
        fehler: {type: string, enum: [ungueltig, recht, weg, aus]}
        text: {type: string}

    AktionAnfrage:
      type: object
      required: [aktion]
      properties:
        adresse: {$ref: "#/components/schemas/Adresse"}
        aktion: {type: string, enum: [oeffnen]}
        app: {type: string, deprecated: true}
        art: {type: string, deprecated: true}
        ref: {type: object, deprecated: true}

    AktionAntwort:
      type: object
      required: [zeige]
      additionalProperties: false
      properties:
        zeige:
          type: object
          required: [adresse]
          additionalProperties: false
          properties:
            adresse: {$ref: "#/components/schemas/Adresse"}

    DeskListe:
      type: object
      required: [desks]
      properties:
        desks:
          type: array
          items:
            type: object
            required: [name, elemente, geaendert]
            properties:
              name: {type: string}
              elemente: {type: [integer, "null"], description: "null bei kaputter Datei"}
              geaendert: {type: number, description: Unix-Zeit}

    Element:
      type: object
      description: Ein Element in Zellen; Felder mit „_" legt nur die Oberfläche zwischen
      required: [id, x, y, w, h, art]
      properties:
        id: {type: string}
        x: {type: integer}
        y: {type: integer}
        w: {type: integer, minimum: 1}
        h: {type: integer, minimum: 1}
        art: {type: string, enum: [notiz, bild, kachel, fremd]}
        text: {type: string}
        typ: {type: string}
        titel: {type: string}
        datei: {type: string}
        modus: {type: string, enum: [mono, farbe]}
        rueckfall: {type: string, description: Klartext für Obsidian (nur beim Speichern)}
        kachel:
          type: object
          required: [v, adresse]
          properties:
            v: {const: 2}
            adresse: {$ref: "#/components/schemas/Adresse"}

    Verbindung:
      type: object
      required: [id, von, nach]
      properties:
        id: {type: string}
        von: {type: string}
        nach: {type: string}
        label: {type: string}
        von_seite: {type: string}
        nach_seite: {type: string}

    Desk:
      type: object
      required: [name, elemente, verbindungen, stand]
      properties:
        name: {type: string}
        elemente:
          type: array
          items: {$ref: "#/components/schemas/Element"}
        verbindungen:
          type: array
          items: {$ref: "#/components/schemas/Verbindung"}
        stand: {type: [string, "null"]}

    DeskSpeichern:
      type: object
      required: [elemente]
      properties:
        elemente:
          type: array
          items: {$ref: "#/components/schemas/Element"}
        verbindungen:
          type: array
          items: {$ref: "#/components/schemas/Verbindung"}
          description: ohne → die Schnüre der Datei bleiben
        stand: {type: [string, "null"]}

    DeskFehler:
      type: object
      required: [error]
      properties:
        error: {type: string}
        stand: {type: [string, "null"]}

    BildVorschau:
      oneOf:
        - type: object
          required: [status, zeilen]
          properties:
            status: {const: ok}
            zeilen:
              type: array
              items:
                type: array
                items:
                  type: array
                  prefixItems:
                    - {type: string}
                    - {type: [string, "null"], pattern: "^#[0-9a-f]{6}$"}
                  minItems: 2
                  maxItems: 2
        - type: object
          required: [status, text]
          properties:
            status: {type: string, enum: [weg, kein_bild, ohne_pillow]}
            text: {type: string}

    # ── Schaufenster (core/shop.py, 2026-10-10) ─────────────────────────
    # schema.org-Formen, locker beschrieben: was ZENTRALE liest, ist Pflicht;
    # weitere schema.org-Felder sind erlaubt.
    ShopKategorie:
      type: string
      enum: [icons, hintergruende, apps, bauteile, agenten, avatare]

    ShopAngebot:
      type: object
      description: schema.org Offer — heute immer Preis "0" EUR
      required: ["@type", price, priceCurrency]
      properties:
        "@type": {const: Offer}
        price: {type: string, pattern: "^[0-9]+(\\.[0-9]{1,2})?$"}
        priceCurrency: {type: string, pattern: "^[A-Z]{3}$"}
        availability: {type: string, format: uri}

    ShopStueck:
      type: object
      description: >
        Ein Stück: schema.org ImageObject, CreativeWork, SoftwareApplication
        oder Product. `@id` ist seine Adresse zentrale://shop/<category>/<identifier>.
      required: ["@type", "@id", identifier, name, description, category, keywords, offers]
      properties:
        "@context": {const: "https://schema.org"}
        "@type": {enum: [ImageObject, CreativeWork, SoftwareApplication, Product]}
        "@id":
          allOf:
            - {$ref: "#/components/schemas/Adresse"}
            - {pattern: "^zentrale://shop/[a-z]+/[^/?#]+$"}
        identifier: {type: string, minLength: 1}
        name: {type: string, minLength: 1}
        description: {type: string}
        category: {$ref: "#/components/schemas/ShopKategorie"}
        keywords: {type: array, items: {type: string}}
        offers: {$ref: "#/components/schemas/ShopAngebot"}
        image: {type: string, format: uri}
        applicationCategory: {type: string}
        isBasedOn: {$ref: "#/components/schemas/Adresse"}
        additionalProperty:
          type: array
          description: schema.org PropertyValue, z. B. `pixel_motiv` = Name des Motivs in tui/pixel.py; `built_in` true = the app ships inside the core package (step 10)
          items:
            type: object
            required: ["@type", name, value]
            properties:
              "@type": {const: PropertyValue}
              name: {type: string}
              value: {type: [string, boolean]}

    ShopKatalog:
      type: object
      description: schema.org ItemList der Stücke
      required: ["@context", "@type", itemListElement, numberOfItems]
      properties:
        "@context": {const: "https://schema.org"}
        "@type": {const: ItemList}
        "@id": {$ref: "#/components/schemas/Adresse"}
        name: {type: string}
        numberOfItems: {type: integer, minimum: 0}
        itemListElement:
          type: array
          items:
            type: object
            required: ["@type", position, item]
            properties:
              "@type": {const: ListItem}
              position: {type: integer, minimum: 1}
              item: {$ref: "#/components/schemas/ShopStueck"}

    ShopUebersicht:
      type: object
      required: [kategorien, themen]
      properties:
        kategorien:
          type: array
          items:
            type: object
            required: [id, name, anzahl]
            properties:
              id: {$ref: "#/components/schemas/ShopKategorie"}
              name: {type: string}
              anzahl: {type: integer, minimum: 0}
        themen:
          type: array
          items:
            type: object
            required: [thema, anzahl]
            properties:
              thema: {type: string}
              anzahl: {type: integer, minimum: 1}

    ShopHolenAnfrage:
      type: object
      required: [adresse]
      properties:
        adresse: {$ref: "#/components/schemas/Adresse"}
      examples:
        - {adresse: "zentrale://shop/icons/post"}

    ShopHolenAntwort:
      type: object
      required: [adresse, geholt, neu, am]
      properties:
        adresse: {$ref: "#/components/schemas/Adresse"}
        geholt: {const: true}
        neu: {type: boolean, description: "false = war schon geholt"}
        am: {type: string, format: date-time}

    ShopBesitz:
      type: object
      description: schema.org ItemList von OwnershipInfo
      required: ["@context", "@type", itemListElement, numberOfItems]
      properties:
        "@context": {const: "https://schema.org"}
        "@type": {const: ItemList}
        name: {type: string}
        numberOfItems: {type: integer, minimum: 0}
        itemListElement:
          type: array
          items:
            type: object
            required: ["@type", position, item]
            properties:
              "@type": {const: ListItem}
              position: {type: integer, minimum: 1}
              item:
                type: object
                required: ["@type", ownedFrom, typeOfGood]
                properties:
                  "@type": {const: OwnershipInfo}
                  ownedFrom: {type: string, format: date-time}
                  typeOfGood:
                    type: object
                    required: ["@id", category]
                    properties:
                      "@id": {$ref: "#/components/schemas/Adresse"}
                      category: {$ref: "#/components/schemas/ShopKategorie"}

    ShopFehler:
      type: object
      required: [error]
      properties:
        error: {type: string}

    IconWahl:
      description: Symbol einer selbst gebauten App — ein Bild aus Input/ oder ein Motiv des Rads
      oneOf:
        - type: object
          required: [bild]
          properties:
            bild: {type: string, description: Name in ~/Zentrale/Input}
        - type: object
          required: [motiv]
          properties:
            motiv: {type: string, pattern: "^[a-z]{1,20}$"}

    EigeneApp:
      type: object
      required: [slug, name, version, vorlage, desk, adresse, icon]
      properties:
        slug: {type: string, pattern: "^[a-z][a-z0-9-]{0,15}$"}
        name: {type: string}
        version: {type: string}
        vorlage: {type: string}
        desk: {type: string, description: Name des Desks, auf den die App zeigt}
        adresse: {type: string, pattern: "^zentrale://"}
        icon:
          oneOf:
            - type: "null"
            - type: object
              required: [art, raster]
              properties:
                art: {const: bild}
                raster:
                  type: array
                  description: 16 Zeilen zu 16 Feldern, Farbe oder durchsichtig
                  items:
                    type: array
                    items: {type: [string, "null"], pattern: "^#[0-9a-f]{6}$"}
            - type: object
              required: [art, motiv]
              properties:
                art: {const: motiv}
                motiv: {type: string}

    Tastentabelle:
      type: object
      description: >
        Ansicht → Einträge (core/tastentabelle.py). Was hier steht, nimmt die
        App in dieser Ansicht; was angezeigt wird, steht hier. Eine Taste hat
        je Ansicht nur eine Aktion.
      additionalProperties:
        type: array
        items: {$ref: "#/components/schemas/TastenEintrag"}

    TastenEintrag:
      type: object
      required: [taste, aktion]
      properties:
        taste:
          type: string
          description: >
            Beschriftung wie in der Leiste; daraus liest die Oberfläche die
            Tasten: „a/s" = zwei, „↑↓" = zwei, „pgup pgdn" = zwei, `alt+…`,
            `ctrl+x`, `f1`–`f12`, enter esc tab space ⌫ del home end pgup pgdn.
            „type" = Freitext, „any key" = jede übrige Taste.
          examples: ["↑↓", "a/s", "enter", "alt+←→", "type"]
        aktion:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
          description: Name der Handlung in der App
        text:
          type: [string, "null"]
          description: kurz, englisch; fehlt er, wird die Taste genommen, aber nicht angezeigt
      additionalProperties: false
