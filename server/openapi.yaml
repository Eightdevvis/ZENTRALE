openapi: 3.1.0
info:
  title: ZENTRALE cloud
  version: "1"
  summary: Accounts, sessions, the encrypted sync "Mitte", devices and packages.
  description: |
    Zero-knowledge (Bitwarden model): the server never sees the password, the
    account key or any plain content. The client derives everything; the
    server stores HMAC-SHA256(key = random 32-byte per-account salt) of
    `anmelde_schluessel` and `notfall_beweis`. Both are 256-bit keys the
    client derived with Argon2id/HKDF, so no slow hash is needed server-side.

    Anonymous: an account is a username (`Name`), never an email. The server
    keeps no IP address and no plain name outside `konten` (rate-limit keys
    are HMAC with a key that changes every UTC day).

    Key scheme and decisions: `memory/hub/knoten_beitritt.md` ("Bauplan v1").

    All answers are JSON unless stated. Errors:
    `{"fehler": "<code>", "text": "<English sentence>"}`.
    Session: `Authorization: Bearer <token>` (90 days, bound to the device name).
    No CORS.
servers:
  - url: https://zentrale-cloud.example.workers.dev
components:
  securitySchemes:
    sitzung:
      type: http
      scheme: bearer
  parameters:
    code:
      name: code
      in: query
      required: false
      description: Invite code. Not used up by downloads. Alternative to a session.
      schema: { type: string, maxLength: 128 }
  schemas:
    Fehler:
      type: object
      required: [fehler, text]
      properties:
        fehler:
          type: string
          description: |
            Machine code, e.g. ungueltig, zu_gross, nicht_angemeldet, nur_passwort,
            falsche_anmeldung, falscher_notfallschluessel, zu_viele_versuche,
            code_ungueltig, code_noetig, name_vergeben, jemand_schneller,
            blob_fehlt (with `fehlen: [sha256…]`), pruefsumme, laenge_fehlt,
            fremder_knoten, kein_paket, nicht_gefunden, methode_falsch,
            nicht_eingerichtet, nur_betreiber, speicher_voll, serverfehler,
            and for the phone app release: no_release, operator_only,
            version_not_newer (with `current_version_code`), apk_missing, apk_mismatch.
        text: { type: string, description: English sentence for the user. }
    Name:
      type: string
      maxLength: 64
      pattern: "^[a-z][a-z0-9._-]{2,31}$"
      description: |
        Username, 3–32 characters a-z 0-9 . _ -, starting with a letter. The
        server trims, NFC-normalizes and lower-cases before checking. A value
        with '@' is refused with the hint that no email is needed. When
        creating, reserved names (admin, root, support, zentrale…, see
        server/src/name.ts) are refused too.
    Kdf:
      type: object
      required: [name, t, m, p]
      properties:
        name: { const: argon2id }
        t: { type: integer, minimum: 1, maximum: 20 }
        m: { type: integer, minimum: 19456, maximum: 4194304, description: KiB }
        p: { type: integer, minimum: 1, maximum: 16 }
    Sha256:
      type: string
      pattern: "^[0-9a-f]{64}$"
    B64u32:
      type: string
      description: 32 bytes, base64url (padding optional).
    Fernet:
      type: string
      pattern: "^[A-Za-z0-9_=-]+$"
      maxLength: 2048
    PhoneRelease:
      type: object
      description: The release manifest of the phone app (self-update, memory/system/zen_mobile.md).
      required: [version, version_code, sha256, size, notes, published_at]
      properties:
        version: { type: string, pattern: "^[0-9A-Za-z][0-9A-Za-z.+_-]{0,63}$", description: Android versionName. }
        version_code: { type: integer, minimum: 1, maximum: 2100000000, description: Android versionCode; grows with every release. }
        sha256: { $ref: "#/components/schemas/Sha256" }
        size: { type: integer, minimum: 1, description: APK size in bytes. }
        notes: { type: string, maxLength: 2000 }
        published_at: { type: string, format: date-time, description: Set by the server. }
    Paket:
      type: object
      required: [version, sha256, groesse]
      properties:
        version: { type: string }
        sha256: { type: string }
        groesse: { type: integer }
  responses:
    Fehler:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Fehler" }
security: []
paths:
  /install.sh:
    get:
      summary: The installer script (public). A placeholder that exits 1 until one is uploaded.
      responses:
        "200":
          description: Shell script
          content: { text/plain: { schema: { type: string } } }
  /v1/paket:
    get:
      summary: The newest package version.
      parameters: [{ $ref: "#/components/parameters/code" }]
      security: [{}, { sitzung: [] }]
      responses:
        "200":
          description: Newest version
          content: { application/json: { schema: { $ref: "#/components/schemas/Paket" } } }
        "401": { $ref: "#/components/responses/Fehler" }
        "403": { $ref: "#/components/responses/Fehler" }
        "404": { $ref: "#/components/responses/Fehler" }
  /v1/paket/{version}.tar.gz:
    get:
      summary: Download a package.
      parameters:
        - name: version
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9A-Za-z][0-9A-Za-z._-]{0,63}$" }
        - { $ref: "#/components/parameters/code" }
      security: [{}, { sitzung: [] }]
      responses:
        "200":
          description: The package
          content: { application/gzip: { schema: { type: string, format: binary } } }
        "401": { $ref: "#/components/responses/Fehler" }
        "403": { $ref: "#/components/responses/Fehler" }
        "404": { $ref: "#/components/responses/Fehler" }
  /v1/konto:
    post:
      summary: Create an account. Uses up the invite code.
      description: |
        A taken name answers 409 `name_vergeben` (the code stays unused). This
        is the one place that reveals that a name exists — and only to someone
        holding an unused invite code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, code, salz, kdf, anmelde_schluessel, verpackt_passwort, verpackt_notfall, notfall_beweis]
              properties:
                name: { $ref: "#/components/schemas/Name" }
                code: { type: string }
                salz: { type: string, description: 16–64 bytes base64url (client Argon2id salt). }
                kdf: { $ref: "#/components/schemas/Kdf" }
                anmelde_schluessel: { $ref: "#/components/schemas/B64u32" }
                verpackt_passwort: { $ref: "#/components/schemas/Fernet" }
                verpackt_notfall: { $ref: "#/components/schemas/Fernet" }
                notfall_beweis:
                  $ref: "#/components/schemas/B64u32"
                  description: base64url(HKDF-SHA256(notfall, info="zentrale/notfall-beweis/v1", 32 bytes)).
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { type: object, properties: { name: { type: string }, erstellt: { type: string, format: date-time } } }
        "400": { $ref: "#/components/responses/Fehler" }
        "403": { $ref: "#/components/responses/Fehler" }
        "409": { $ref: "#/components/responses/Fehler" }
  /v1/vorab:
    post:
      summary: Salt and KDF values for a name. Unknown name → invented values that are stable for that name.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { $ref: "#/components/schemas/Name" } } }
      responses:
        "200":
          description: Values for the client-side Argon2id
          content:
            application/json:
              schema:
                type: object
                required: [salz, kdf]
                properties:
                  salz: { type: string }
                  kdf: { $ref: "#/components/schemas/Kdf" }
        "400": { $ref: "#/components/responses/Fehler" }
  /v1/sitzung:
    post:
      summary: Log in. Rate limited (5 failures / 15 min per name and per IP; counters keyed by a daily HMAC, never stored in plain).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, anmelde_schluessel, knoten]
              properties:
                name: { $ref: "#/components/schemas/Name" }
                anmelde_schluessel: { $ref: "#/components/schemas/B64u32" }
                knoten: { type: string, pattern: "^[\\p{L}\\p{N}@._-]{1,64}$", description: Device name; the session is bound to it. }
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                type: object
                required: [token, laeuft_ab, verpackt_passwort]
                properties:
                  token: { type: string }
                  laeuft_ab: { type: string, format: date-time }
                  verpackt_passwort: { $ref: "#/components/schemas/Fernet" }
        "401": { $ref: "#/components/responses/Fehler" }
        "429": { $ref: "#/components/responses/Fehler" }
    delete:
      summary: Log out (ends this session).
      security: [{ sitzung: [] }]
      responses:
        "200":
          description: Logged out
          content: { application/json: { schema: { type: object, properties: { abgemeldet: { const: true } } } } }
        "401": { $ref: "#/components/responses/Fehler" }
  /v1/notfall:
    post:
      summary: Emergency key. Returns verpackt_notfall and a 15-minute token that may only call PUT /v1/konto/passwort. Rate limited like /v1/sitzung.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, notfall_beweis]
              properties:
                name: { $ref: "#/components/schemas/Name" }
                notfall_beweis: { $ref: "#/components/schemas/B64u32" }
      responses:
        "200":
          description: Restricted session
          content:
            application/json:
              schema:
                type: object
                required: [verpackt_notfall, token]
                properties:
                  verpackt_notfall: { $ref: "#/components/schemas/Fernet" }
                  token: { type: string }
                  laeuft_ab: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Fehler" }
        "429": { $ref: "#/components/responses/Fehler" }
  /v1/konto/passwort:
    put:
      summary: Set a new password (only verpackt_passwort changes, the account key stays). Ends all other sessions; after an emergency reset also the emergency session.
      description: |
        With a normal session `altes_anmelde_schluessel` is required and checked
        like a login (rate limited, 401 falsche_anmeldung / 429). With the
        15-minute emergency token it is not needed.
      security: [{ sitzung: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [salz, kdf, anmelde_schluessel, verpackt_passwort]
              properties:
                salz: { type: string }
                kdf: { $ref: "#/components/schemas/Kdf" }
                anmelde_schluessel: { $ref: "#/components/schemas/B64u32" }
                verpackt_passwort: { $ref: "#/components/schemas/Fernet" }
                altes_anmelde_schluessel:
                  $ref: "#/components/schemas/B64u32"
                  description: Required with a normal session; ignored with the emergency token.
      responses:
        "200":
          description: Changed
          content: { application/json: { schema: { type: object, properties: { geaendert: { type: string, format: date-time } } } } }
        "400": { $ref: "#/components/responses/Fehler" }
        "401": { $ref: "#/components/responses/Fehler" }
        "429": { $ref: "#/components/responses/Fehler" }
  /v1/mitte:
    get:
      summary: The current stand of the Mitte (holen).
      security: [{ sitzung: [] }]
      responses:
        "200":
          description: Head and file names
          content:
            application/json:
              schema:
                type: object
                required: [kennung, namen]
                properties:
                  kennung: { type: [string, "null"] }
                  namen: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Fehler" }
        "403": { $ref: "#/components/responses/Fehler" }
  /v1/mitte/datei/{name}:
    get:
      summary: Bytes of one file in the current stand. `name` may contain "/" (d/<hmac>.enc) — it spans the rest of the path.
      security: [{ sitzung: [] }]
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Opaque bytes
          content: { application/octet-stream: { schema: { type: string, format: binary } } }
        "401": { $ref: "#/components/responses/Fehler" }
        "404": { $ref: "#/components/responses/Fehler" }
  /v1/mitte/fehlende:
    post:
      summary: Which of these blobs does this account not have yet?
      security: [{ sitzung: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sha256]
              properties:
                sha256: { type: array, maxItems: 20000, items: { $ref: "#/components/schemas/Sha256" } }
      responses:
        "200":
          description: The missing ones
          content:
            application/json:
              schema:
                type: object
                required: [fehlen]
                properties:
                  fehlen: { type: array, items: { $ref: "#/components/schemas/Sha256" } }
        "400": { $ref: "#/components/responses/Fehler" }
        "401": { $ref: "#/components/responses/Fehler" }
  /v1/mitte/blob/{sha256}:
    put:
      summary: Upload one blob (already encrypted bytes). The server checks that the body matches the SHA-256 in the address.
      description: Raw body, Content-Length required, max. 24 MiB. Already present → 204 without storing again.
      security: [{ sitzung: [] }]
      parameters:
        - name: sha256
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Sha256" }
      requestBody:
        required: true
        content: { application/octet-stream: { schema: { type: string, format: binary } } }
      responses:
        "204": { description: Stored (or already there) }
        "400": { $ref: "#/components/responses/Fehler" }
        "401": { $ref: "#/components/responses/Fehler" }
        "411": { $ref: "#/components/responses/Fehler" }
        "413": { $ref: "#/components/responses/Fehler" }
        "507":
          description: "speicher_voll: storing it would push R2 over the free storage (brake, var BREMSE_SPEICHER). Nothing was stored."
          content: { application/json: { schema: { $ref: "#/components/schemas/Fehler" } } }
  /v1/mitte/stand:
    post:
      summary: New stand = basis + schreiben + verweise − loeschen (vorbereiten + senden). Compare-and-swap on the head.
      description: |
        JSON body max. 4 MiB, 20 000 names. Big files: ask POST /v1/mitte/fehlende,
        upload with PUT /v1/mitte/blob/{sha256}, then refer to them in `verweise`.
        A name may appear only once across schreiben/verweise/loeschen.
      security: [{ sitzung: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [basis]
              properties:
                basis: { type: [string, "null"], description: The head this stand builds on (null = empty Mitte). }
                schreiben:
                  type: object
                  description: Small files inline.
                  additionalProperties: { type: string, description: base64 (standard or URL-safe) }
                verweise:
                  type: object
                  description: Files already uploaded as blobs, name → SHA-256.
                  additionalProperties: { $ref: "#/components/schemas/Sha256" }
                loeschen: { type: array, items: { type: string } }
      responses:
        "200":
          description: The new head
          content:
            application/json:
              schema: { type: object, required: [kennung], properties: { kennung: { type: string } } }
        "400":
          description: "ungueltig, or blob_fehlt with `fehlen: [sha256…]`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Fehler" } } }
        "401": { $ref: "#/components/responses/Fehler" }
        "409":
          description: "jemand_schneller: the head is no longer `basis`. Fetch again and merge."
          content: { application/json: { schema: { $ref: "#/components/schemas/Fehler" } } }
        "413": { $ref: "#/components/responses/Fehler" }
        "507":
          description: "speicher_voll: the inline files would push R2 over the free storage. Nothing changed."
          content: { application/json: { schema: { $ref: "#/components/schemas/Fehler" } } }
  /v1/mitte/enthaelt/{kennung}:
    get:
      summary: Was this stand ever the head of this account's Mitte?
      security: [{ sitzung: [] }]
      parameters:
        - name: kennung
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Answer
          content:
            application/json:
              schema: { type: object, required: [enthaelt], properties: { enthaelt: { type: boolean } } }
        "401": { $ref: "#/components/responses/Fehler" }
  /v1/knoten:
    get:
      summary: All device descriptions of the account.
      security: [{ sitzung: [] }]
      responses:
        "200":
          description: Devices
          content:
            application/json:
              schema:
                type: object
                required: [knoten]
                properties:
                  knoten: { type: array, items: { type: object, description: See core/knoten.schema.json. } }
        "401": { $ref: "#/components/responses/Fehler" }
  /v1/knoten/{name}:
    put:
      summary: Write this device's description (plain metadata, max. 16 KiB). Only the session's own device name.
      security: [{ sitzung: [] }]
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string, pattern: "^[\\p{L}\\p{N}@._-]{1,64}$" }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object } } }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { type: object, properties: { name: { type: string }, aktualisiert: { type: string, format: date-time } } }
        "400": { $ref: "#/components/responses/Fehler" }
        "401": { $ref: "#/components/responses/Fehler" }
        "403": { $ref: "#/components/responses/Fehler" }
  /v1/besitz:
    get:
      summary: Ownership of the account (schema.org ItemList, encrypted as one opaque string).
      security: [{ sitzung: [] }]
      responses:
        "200":
          description: Ownership blob or null
          content:
            application/json:
              schema:
                type: object
                required: [besitz]
                properties:
                  besitz: { type: [string, "null"] }
                  aktualisiert: { type: [string, "null"], format: date-time }
        "401": { $ref: "#/components/responses/Fehler" }
    put:
      summary: Replace the ownership blob (max. 1 MiB).
      security: [{ sitzung: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [besitz], properties: { besitz: { type: string } } }
      responses:
        "200":
          description: Stored
          content: { application/json: { schema: { type: object, properties: { aktualisiert: { type: string, format: date-time } } } } }
        "400": { $ref: "#/components/responses/Fehler" }
        "401": { $ref: "#/components/responses/Fehler" }
  /v1/nutzung:
    get:
      summary: Free-tier usage of this cloud (operator only).
      description: |
        Only for sessions whose account name is in the var `BETREIBER_NAMEN`
        (others: 403 `nur_betreiber`). Numbers are counted by the Worker itself
        (D1 rows from query meta, R2 operations per call, stored R2 bytes exact on
        put/delete plus a daily recount). With the optional secret
        `CF_ANALYTICS_TOKEN` and var `CF_ACCOUNT_ID` an hourly cron also stores the
        account-wide numbers of the Cloudflare GraphQL Analytics API; `used` is
        the larger of both. Days and months are UTC. `level`: ok below 50 %,
        then "50", "80", "95", and "voll" at 100 %.
      security: [{ sitzung: [] }]
      responses:
        "200":
          description: Usage per limit and the warnings (highest level first)
          content:
            application/json:
              schema:
                type: object
                required: [zeit, grenzen_geprueft, grenzen, warnungen]
                properties:
                  zeit: { type: string, format: date-time }
                  grenzen_geprueft: { type: string, description: Date the limit table was checked against the Cloudflare docs. }
                  grenzen:
                    type: array
                    items:
                      type: object
                      required: [id, name, used, limit, unit, period, percent, level, source]
                      properties:
                        id: { enum: [worker_anfragen, d1_gelesen, d1_geschrieben, d1_speicher, r2_speicher, r2_a, r2_b] }
                        name: { type: string, description: English name. }
                        used: { type: number }
                        limit: { type: number }
                        unit: { enum: [requests, rows, bytes, operations] }
                        period: { enum: [day, month, now], description: "day/month: UTC calendar day/month; now: current amount" }
                        percent: { type: number }
                        level: { enum: [ok, "50", "80", "95", voll] }
                        source: { enum: [self, cloudflare], description: Which number `used` is. }
                        self: { type: number }
                        cloudflare: { type: [number, "null"] }
                        cloudflare_at: { type: [string, "null"], format: date-time }
                        costs_money: { type: boolean, description: Going over costs money (R2) instead of just failing. }
                  warnungen:
                    type: array
                    items:
                      type: object
                      required: [id, name, level, percent, text]
                      properties:
                        id: { type: string }
                        name: { type: string }
                        level: { enum: ["50", "80", "95", voll] }
                        percent: { type: number }
                        text: { type: string, description: One English sentence. }
        "401": { $ref: "#/components/responses/Fehler" }
        "403": { $ref: "#/components/responses/Fehler" }
  /v1/phone/release:
    get:
      summary: The current release manifest of the phone app (any logged-in account).
      description: The app builds the APK address from `version_code` on the same cloud; it never follows a URL.
      security: [{ sitzung: [] }]
      responses:
        "200":
          description: The manifest
          content: { application/json: { schema: { $ref: "#/components/schemas/PhoneRelease" } } }
        "401": { $ref: "#/components/responses/Fehler" }
        "404": { $ref: "#/components/responses/Fehler" }
    put:
      summary: Publish a release (operator only, var BETREIBER_NAMEN). Upload the APK first.
      description: |
        `version_code` must be higher than the published one (409 version_not_newer). The APK
        for it must already be stored with the same size and SHA-256 (409 apk_missing /
        apk_mismatch). Keeps the new APK and the one before it, deletes older ones.
      security: [{ sitzung: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, version_code, sha256, size]
              properties:
                version: { type: string }
                version_code: { type: integer }
                sha256: { $ref: "#/components/schemas/Sha256" }
                size: { type: integer }
                notes: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: Published; the stored manifest
          content: { application/json: { schema: { $ref: "#/components/schemas/PhoneRelease" } } }
        "400": { $ref: "#/components/responses/Fehler" }
        "401": { $ref: "#/components/responses/Fehler" }
        "403": { $ref: "#/components/responses/Fehler" }
        "409": { $ref: "#/components/responses/Fehler" }
  /v1/phone/release/{code}.apk:
    get:
      summary: The APK of a release (any logged-in account).
      security: [{ sitzung: [] }]
      parameters:
        - { name: code, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: The APK
          content: { application/vnd.android.package-archive: { schema: { type: string, format: binary } } }
        "401": { $ref: "#/components/responses/Fehler" }
        "404": { $ref: "#/components/responses/Fehler" }
    put:
      summary: Upload the APK of a release (operator only). Streamed to R2; R2 checks the SHA-256.
      description: Raw body, Content-Length required, max. 96 MiB (Workers Free takes bodies up to 100 MB).
      security: [{ sitzung: [] }]
      parameters:
